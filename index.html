<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>GGO PLAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="card head">
    <a class="brand" href="#home" id="brand">
      <img class="logo" src="logo.jpg" alt="THE GGO STUDIOS" width="88" height="88">
      <div>
        <h1>GGO PLAY</h1>
        <p id="siteSub"></p>
      </div>
    </a>
    <div class="tools">
      <span class="chip" id="userChip" hidden></span>
      <button class="pill" id="navBtn" type="button" hidden></button>
      <button class="pill" id="logoutBtn" type="button" hidden></button>
      <button class="pill" id="langKo" type="button" aria-pressed="true">한국어</button>
      <button class="pill" id="langEn" type="button" aria-pressed="false">English</button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <section class="card auth" id="v-loading" aria-live="polite">
    <p class="loading" data-i18n="loading">불러오는 중...</p>
  </section>

  <!-- 로그인 -->
  <section class="card auth" id="v-login" hidden aria-labelledby="loginTitle">
    <h2 class="auth-title" id="loginTitle" data-i18n="loginTitle"></h2>
    <p class="auth-sub" data-i18n="loginSub"></p>
    <form class="form" id="loginForm" novalidate>
      <div class="field">
        <label for="liId" data-i18n="userId"></label>
        <input class="input" id="liId" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
        <div class="err-msg" id="liIdErr" aria-live="polite"></div>
      </div>
      <div class="field">
        <label for="liPw" data-i18n="password"></label>
        <div class="pw">
          <input class="input" id="liPw" type="password" autocomplete="current-password">
          <button class="pw-toggle" type="button" data-pw="liPw"></button>
        </div>
        <div class="err-msg" id="liPwErr" aria-live="polite"></div>
      </div>
      <button class="btn" type="submit" data-i18n="loginBtn"></button>
      <button class="link" type="button" id="forgotBtn" data-i18n="forgot"></button>
    </form>
    <hr class="divider">
    <p class="switch"><span data-i18n="noAccount"></span> <button class="link" type="button" data-go="signup" data-i18n="goSignup"></button></p>
  </section>

  <!-- 회원가입: 1 초대 코드, 2 정보 입력 -->
  <section class="card auth" id="v-signup" hidden aria-labelledby="inviteTitle">
    <ol class="steps" id="steps">
      <li class="step" data-step="1"><i></i><span data-i18n="stepInvite"></span></li>
      <li class="step" data-step="2"><i></i><span data-i18n="stepInfo"></span></li>
      <li class="step" data-step="3"><i></i><span data-i18n="stepWait"></span></li>
    </ol>

    <div id="su1">
      <h2 class="auth-title" id="inviteTitle" data-i18n="inviteTitle"></h2>
      <p class="auth-sub" data-i18n="inviteSub"></p>
      <form class="form" id="inviteForm" novalidate>
        <div class="field">
          <label for="suCode" data-i18n="inviteLabel"></label>
          <input class="input code-in" id="suCode" type="text" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <div class="err-msg" id="suCodeErr" aria-live="polite"></div>
        </div>
        <button class="btn" type="submit" data-i18n="inviteBtn"></button>
        <p class="note center" data-i18n="inviteHelp"></p>
      </form>
      <hr class="divider">
      <p class="switch"><span data-i18n="haveAccount"></span> <button class="link" type="button" data-go="login" data-i18n="goLogin"></button></p>
    </div>

    <div id="su2" hidden>
      <h2 class="auth-title" data-i18n="infoTitle"></h2>
      <p class="auth-sub" data-i18n="infoSub"></p>
      <form class="form" id="infoForm" novalidate>
        <div class="confirmed"><span class="tag good" id="codeTag"></span><span data-i18n="codeOk"></span></div>
        <div class="field">
          <label for="suNick" data-i18n="nick"></label>
          <input class="input" id="suNick" type="text" maxlength="12" autocomplete="nickname">
          <div class="err-msg" id="suNickErr" aria-live="polite"></div>
        </div>
        <div class="field">
          <label for="suId" data-i18n="userId"></label>
          <input class="input" id="suId" type="text" maxlength="16" autocomplete="username" autocapitalize="none" spellcheck="false">
          <div class="hint" data-i18n="idHint"></div>
          <div class="err-msg" id="suIdErr" aria-live="polite"></div>
        </div>
        <div class="field">
          <label for="suPw" data-i18n="password"></label>
          <div class="pw">
            <input class="input" id="suPw" type="password" autocomplete="new-password">
            <button class="pw-toggle" type="button" data-pw="suPw"></button>
          </div>
          <div class="err-msg" id="suPwErr" aria-live="polite"></div>
        </div>
        <div class="field">
          <label for="suPw2" data-i18n="pw2"></label>
          <input class="input" id="suPw2" type="password" autocomplete="new-password">
          <div class="err-msg" id="suPw2Err" aria-live="polite"></div>
        </div>
        <div class="field">
          <label class="check"><input type="checkbox" id="suAgree"><span data-i18n="agree"></span></label>
          <div class="err-msg" id="suAgreeErr" aria-live="polite"></div>
        </div>
        <div class="btn-row">
          <button class="btn ghost" type="button" id="suBack" data-i18n="back"></button>
          <button class="btn" type="submit" data-i18n="submitBtn"></button>
        </div>
      </form>
    </div>
  </section>

  <!-- 승인 대기 -->
  <section class="card auth" id="v-pending" hidden aria-labelledby="pendTitle">
    <div class="hourglass" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 3 6 5 9-2 3-5 4-5 9M17 3c0 5-3 6-5 9 2 3 5 4 5 9"/></svg>
    </div>
    <h2 class="auth-title center" id="pendTitle" data-i18n="pendTitle"></h2>
    <p class="auth-sub center" style="margin-bottom:0" data-i18n="pendDesc"></p>
    <dl class="kv">
      <dt data-i18n="kvNick"></dt><dd id="pNick"></dd>
      <dt data-i18n="kvId"></dt><dd id="pId"></dd>
      <dt data-i18n="kvCode"></dt><dd id="pCode"></dd>
      <dt data-i18n="kvTime"></dt><dd id="pTime"></dd>
    </dl>
    <ul class="tl">
      <li class="done"><span class="dot">✓</span><div><strong data-i18n="tl1"></strong><span class="d" data-i18n="tl1d"></span></div></li>
      <li class="now"><span class="dot">2</span><div><strong data-i18n="tl2"></strong><span class="d" data-i18n="tl2d"></span></div></li>
      <li><span class="dot">3</span><div><strong data-i18n="tl3"></strong><span class="d" data-i18n="tl3d"></span></div></li>
    </ul>
    <button class="btn" type="button" id="refreshBtn" data-i18n="refresh"></button>
    <p class="note center" data-i18n="contact"></p>
  </section>

  <!-- 서버 이동 신청 -->
  <section class="card auth" id="v-move" hidden aria-labelledby="moveTitle">
    <h2 class="auth-title" id="moveTitle" data-i18n="moveTitle"></h2>
    <p class="auth-sub" data-i18n="moveSub"></p>
    <form class="form" id="moveForm" novalidate>
      <div class="field">
        <label for="mvTarget" data-i18n="mvTarget"></label>
        <select class="input" id="mvTarget"></select>
        <div class="hint" id="mvCond"></div>
        <div class="err-msg" id="mvTargetErr" aria-live="polite"></div>
      </div>
      <div class="field">
        <label for="mvFrom" data-i18n="mvFrom"></label>
        <select class="input" id="mvFrom"></select>
      </div>
      <div class="field">
        <label for="mvTrophy" data-i18n="mvTrophy"></label>
        <input class="input" id="mvTrophy" type="number" min="0" step="1" inputmode="numeric">
        <div class="err-msg" id="mvTrophyErr" aria-live="polite"></div>
      </div>
      <div class="field">
        <label for="mvNote" data-i18n="mvNote"></label>
        <textarea class="input" id="mvNote" maxlength="100" rows="3"></textarea>
      </div>
      <button class="btn" type="submit" data-i18n="mvSubmit"></button>
    </form>
    <hr class="divider">
    <h3 class="sub-title" data-i18n="myMoves"></h3>
    <div id="myMoves" aria-live="polite"></div>
    <hr class="divider">
    <button class="btn ghost" type="button" data-go="home" data-i18n="moveBack"></button>
  </section>

  <!-- 운영진 승인 관리 -->
  <section class="stack" id="v-admin" hidden>
    <div class="card">
      <div class="admin-head">
        <div>
          <h2 class="sec-title" data-i18n="adminTitle"></h2>
          <p class="muted" data-i18n="adminSub"></p>
        </div>
        <div class="seg" id="adminTabs" role="tablist"></div>
      </div>
      <form class="codeform" id="codeForm" novalidate hidden>
        <div class="field">
          <label for="acCode" data-i18n="acCodeLabel"></label>
          <input class="input code-in" id="acCode" type="text" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <div class="err-msg" id="acCodeErr" aria-live="polite"></div>
        </div>
        <div class="field">
          <label for="acMax" data-i18n="acMaxLabel"></label>
          <input class="input" id="acMax" type="number" min="1" step="1" value="70" disabled>
          <label class="check"><input type="checkbox" id="acUnl" checked><span data-i18n="unlimited"></span></label>
          <div class="err-msg" id="acMaxErr" aria-live="polite"></div>
        </div>
        <div class="field">
          <label for="acExp" data-i18n="acExpLabel"></label>
          <select class="input" id="acExp">
            <option value="30" data-i18n="exp30"></option>
            <option value="7" data-i18n="exp7"></option>
            <option value="90" data-i18n="exp90"></option>
            <option value="0" data-i18n="expNone"></option>
          </select>
        </div>
        <div class="field">
          <button class="btn" type="submit" data-i18n="createBtn"></button>
        </div>
      </form>
      <div id="adminBody"></div>
      <p class="note" id="adminNote"></p>
    </div>
  </section>

  <!-- 메인 (승인된 길드원) -->
  <div class="stack" id="v-home" hidden>
    <div class="info" role="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <span id="banner"></span>
    </div>
    <main class="cols">
      <section class="card" aria-labelledby="menuTitle">
        <h2 class="sec-title"><span id="menuTitle"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        </h2>
        <div class="menu" id="menu" role="tablist"></div>
        <hr class="divider">
        <h2 class="sec-title" id="infoTitle"></h2>
        <div class="stats">
          <div class="stat"><label id="lbl1"></label><div id="val1"></div></div>
          <div class="stat"><label id="lbl2"></label><div id="val2"></div></div>
        </div>
      </section>
      <section class="card" aria-labelledby="prevTitle">
        <h2 class="sec-title" id="prevTitle"></h2>
        <div class="tbl-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
        <p class="note" id="sampleNote"></p>
        <hr class="divider">
        <div class="tips"><h3 id="tipTitle"></h3><ul id="tips"></ul></div>
        <button class="btn mt" id="openBtn" type="button"></button>
      </section>
    </main>
  </div>

  <footer class="foot" id="foot"></footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>

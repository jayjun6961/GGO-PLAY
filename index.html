<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>GGO PLAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 둥근 흰색 카드. 인증 화면은 가운데 좁은 카드 1장, 메인/승인 관리는 넓은 카드. 상단 헤더는 모든 화면 공통 */
:root {
  --bg: #f3f4fa;
  --card: #ffffff;
  --fg: #1f2233;
  --muted: #6b7088;
  --line: #e6e8f2;
  --field: #f5f6fb;
  --accent: #7c5cf0;
  --accent-fg: #ffffff;
  --accent-soft: #ece8ff;
  --info-bg: #e4efff;
  --info-fg: #1d4fd8;
  --gold-bg: #fff4cf;
  --gold-line: #f0c24b;
  --gold-fg: #8a5a00;
  --good: #1f8f5f;
  --good-bg: #dcf5e8;
  --warn: #a8660a;
  --warn-bg: #ffecc7;
  --bad: #c2362f;
  --bad-bg: #fde2df;
  --shadow: 0 1px 2px rgba(31, 34, 51, 0.04), 0 8px 24px rgba(31, 34, 51, 0.05);
  --font-display: "Jua", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12131c;
    --card: #1c1e2d;
    --fg: #eceefa;
    --muted: #9a9fbb;
    --line: #2d3047;
    --field: #252839;
    --accent: #9a82ff;
    --accent-fg: #14122a;
    --accent-soft: #2b2650;
    --info-bg: #1a2a4b;
    --info-fg: #93b8ff;
    --gold-bg: #3a3115;
    --gold-line: #8a6d1c;
    --gold-fg: #ffd978;
    --good: #5fd39b;
    --good-bg: #17382b;
    --warn: #f0b95c;
    --warn-bg: #3d2e12;
    --bad: #ff8f87;
    --bad-bg: #4a2220;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12131c;
  --card: #1c1e2d;
  --fg: #eceefa;
  --muted: #9a9fbb;
  --line: #2d3047;
  --field: #252839;
  --accent: #9a82ff;
  --accent-fg: #14122a;
  --accent-soft: #2b2650;
  --info-bg: #1a2a4b;
  --info-fg: #93b8ff;
  --gold-bg: #3a3115;
  --gold-line: #8a6d1c;
  --gold-fg: #ffd978;
  --good: #5fd39b;
  --good-bg: #17382b;
  --warn: #f0b95c;
  --warn-bg: #3d2e12;
  --bad: #ff8f87;
  --bad-bg: #4a2220;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  padding-inline: 16px;
  padding-block: 24px 40px;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1200px; margin-inline: auto; display: flex; flex-direction: column; gap: 24px; }
.stack { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 24px; min-width: 0; }
.muted { color: var(--muted); }

/* preview bar (실제 구현 시 삭제) */
.devbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px;
  font-size: 12px; color: var(--muted); background: var(--card);
}
.devbar b { color: var(--fg); }
.devbar button { border: 1px solid var(--line); background: var(--field); border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
.devbar button:hover { border-color: var(--accent); }
.dev-note { flex-basis: 100%; }

/* header */
.head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
a.brand { display: flex; align-items: center; gap: 16px; min-width: 0; color: inherit; text-decoration: none; }
.logo { flex: none; display: block; width: 88px; height: 88px; border-radius: 14px; box-shadow: 0 0 0 1px var(--line); }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.2; margin: 0; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; height: 44px; padding-inline: 14px; border-radius: 10px; background: var(--field); font-weight: 700; font-size: 14px; }
.pill {
  height: 44px; padding-inline: 18px; border-radius: 10px; border: 1px solid transparent;
  background: var(--card); font-weight: 700; font-size: 15px; box-shadow: 0 0 0 1px var(--line);
}
.pill[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); box-shadow: none; }
.icon-btn { width: 44px; height: 44px; border-radius: 10px; border: 0; background: var(--field); display: grid; place-items: center; color: var(--fg); }
.icon-btn svg { width: 20px; height: 20px; }

/* info banner */
.info { display: flex; gap: 12px; align-items: flex-start; background: var(--info-bg); color: var(--info-fg); border-radius: 10px; padding: 14px 18px; font-weight: 700; font-size: 14px; }
.info svg { flex: none; width: 18px; height: 18px; margin-top: 3px; }

/* home columns */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.sec-title { display: flex; align-items: center; gap: 8px; margin: 0 0 20px; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.sec-title svg { width: 18px; height: 18px; color: var(--muted); }

.menu { display: flex; flex-direction: column; gap: 12px; }
.row {
  display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
  padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--field);
  transition: background .15s, border-color .15s;
}
.row:hover { border-color: var(--accent); }
.row .ico { flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--card); display: grid; place-items: center; color: var(--accent); }
.row .ico svg { width: 24px; height: 24px; }
.row .txt { min-width: 0; flex: 1; }
.row .name { display: block; font-weight: 700; font-size: 16px; }
.row .desc { display: block; font-size: 13px; color: var(--muted); }
.row .go { flex: none; width: 18px; height: 18px; color: var(--muted); }
.row[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.row[aria-selected="true"] .desc, .row[aria-selected="true"] .go { color: inherit; opacity: .85; }
.row[aria-selected="true"] .ico { background: rgba(255, 255, 255, 0.2); color: inherit; }

.divider { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.stat label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.stat div { background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* tables */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 13px; font-weight: 700; color: var(--muted); padding: 10px 14px; background: var(--field); white-space: nowrap; }
th:first-child { border-radius: 10px 0 0 10px; }
th:last-child { border-radius: 0 10px 10px 0; text-align: right; }
td { padding: 12px 14px; font-weight: 500; white-space: nowrap; }
td:first-child { font-weight: 700; }
td:last-child { text-align: right; }
tbody tr { box-shadow: 0 1px 0 var(--line); }
tbody tr.top td { background: var(--gold-bg); color: var(--gold-fg); font-weight: 700; }
tbody tr.top td:first-child { border-radius: 10px 0 0 10px; box-shadow: inset 2px 0 0 var(--gold-line), inset 0 2px 0 var(--gold-line), inset 0 -2px 0 var(--gold-line); }
tbody tr.top td:last-child { border-radius: 0 10px 10px 0; box-shadow: inset -2px 0 0 var(--gold-line), inset 0 2px 0 var(--gold-line), inset 0 -2px 0 var(--gold-line); }
tbody tr.top td:not(:first-child):not(:last-child) { box-shadow: inset 0 2px 0 var(--gold-line), inset 0 -2px 0 var(--gold-line); }
.code { letter-spacing: .06em; font-weight: 700; }
.empty { text-align: center; color: var(--muted); padding: 32px 0; }

.tag { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.tag.good { background: var(--good-bg); color: var(--good); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad { background: var(--bad-bg); color: var(--bad); }
.tag.mute { background: var(--field); color: var(--muted); }
.tag.acc { background: var(--accent-soft); color: var(--accent); }
.mini-btn { border: 0; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; padding: 5px 12px; border-radius: 8px; }
.mini-btn.ok { background: var(--accent); color: var(--accent-fg); }
.mini-btn.danger { background: var(--bad-bg); color: var(--bad); }
.act { display: inline-flex; gap: 6px; }

.tips h3 { margin: 0 0 10px; font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.tips ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.tips li { display: flex; gap: 8px; }
.tips li::before { content: "•"; color: var(--accent); font-weight: 700; }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

/* buttons */
.btn { height: 48px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: 15px; padding-inline: 20px; width: 100%; }
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: var(--field); color: var(--fg); }
.btn.sm { height: 40px; width: auto; font-size: 14px; }
.mt { margin-top: 20px; }
.btn-row { display: flex; gap: 10px; }
.btn-row .ghost { width: auto; flex: none; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

/* auth */
.auth { width: 100%; max-width: 460px; align-self: center; }
.auth-title { font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.25; margin: 0 0 6px; text-wrap: balance; }
.auth-sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
.form { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: 13px; font-weight: 700; color: var(--muted); }
.input {
  width: 100%; height: 48px; border: 1px solid var(--line); background: var(--card); color: var(--fg);
  border-radius: 10px; padding-inline: 14px; font: inherit; font-weight: 500;
}
.input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.input.err { border-color: var(--bad); }
.input.code-in { letter-spacing: .14em; font-weight: 700; font-variant-numeric: tabular-nums; text-transform: uppercase; }
.err-msg { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: -2px; }
.err-msg:empty { min-height: 0; }
.hint { font-size: 12px; color: var(--muted); }
.pw { position: relative; }
.pw .input { padding-right: 70px; }
.pw-toggle { position: absolute; right: 8px; top: 8px; height: 32px; padding-inline: 10px; border: 0; border-radius: 8px; background: var(--field); font-size: 12px; font-weight: 700; color: var(--muted); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.switch { margin: 0; text-align: center; font-size: 14px; color: var(--muted); display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.center { text-align: center; }

.steps { list-style: none; padding: 0; margin: 0 0 24px; display: flex; gap: 8px; }
.step { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); }
.step i { display: block; height: 6px; border-radius: 99px; background: var(--line); }
.step.on { color: var(--accent); }
.step.on i { background: var(--accent); }
.step.done i { background: var(--accent); opacity: .45; }
.confirmed { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }

/* pending */
.hourglass { width: 64px; height: 64px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 16px; }
.hourglass svg { width: 30px; height: 30px; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; background: var(--field); border-radius: 12px; padding: 16px; font-size: 14px; margin: 20px 0; }
.kv dt { color: var(--muted); font-weight: 700; }
.kv dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.tl { list-style: none; padding: 0; margin: 0 0 20px; display: flex; flex-direction: column; gap: 16px; }
.tl li { display: flex; gap: 12px; align-items: flex-start; }
.dot { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--field); color: var(--muted); border: 2px solid var(--line); }
.tl li.done .dot { background: var(--good); border-color: var(--good); color: var(--card); }
.tl li.now .dot { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.tl strong { display: block; font-size: 14px; }
.tl span.d { display: block; font-size: 13px; color: var(--muted); }

/* admin */
.admin-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.admin-head .sec-title { margin-bottom: 4px; }
.admin-head p { margin: 0; font-size: 14px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--field); padding: 4px; border-radius: 12px; }
.seg button { border: 0; background: transparent; padding: 8px 16px; border-radius: 9px; font-weight: 700; font-size: 14px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
.cnt { background: var(--bad); color: #fff; border-radius: 99px; font-size: 11px; min-width: 18px; height: 18px; display: inline-grid; place-items: center; padding-inline: 5px; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.bar p { margin: 0; font-size: 13px; color: var(--muted); }

.foot { text-align: center; color: var(--muted); font-size: 12px; line-height: 1.7; padding-top: 8px; }
.foot p { margin: 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(12px);
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 500;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); z-index: 10;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="devbar" id="devbar">
    <b>미리보기 모드</b>
    <button type="button" data-dev="login">로그인</button>
    <button type="button" data-dev="signup">회원가입</button>
    <button type="button" data-dev="pending">승인 대기</button>
    <button type="button" data-dev="admin">승인 관리(운영진)</button>
    <button type="button" data-dev="home">메인(길드원)</button>
    <span class="dev-note">로그인 화면에서 admin으로 시작하는 아이디는 운영진, pending으로 시작하는 아이디는 승인 대기로 동작합니다. 초대 코드는 GGO1-A2B3처럼 영문·숫자 4자-4자면 통과합니다. 실제 구현 시 이 줄은 삭제합니다.</span>
  </div>

  <header class="card head">
    <a class="brand" href="#home" id="brand">
      <img class="logo" src="logo.jpg" alt="THE GGO STUDIOS" width="88" height="88">
      <div>
        <h1>GGO PLAY</h1>
        <p id="siteSub"></p>
      </div>
    </a>
    <div class="tools">
      <span class="chip" id="userChip" hidden></span>
      <button class="pill" id="navBtn" type="button" hidden></button>
      <button class="pill" id="logoutBtn" type="button" hidden></button>
      <button class="pill" id="langKo" type="button" aria-pressed="true">한국어</button>
      <button class="pill" id="langEn" type="button" aria-pressed="false">English</button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <!-- 로그인 -->
  <section class="card auth" id="v-login" hidden aria-labelledby="loginTitle">
    <h2 class="auth-title" id="loginTitle" data-i18n="loginTitle"></h2>
    <p class="auth-sub" data-i18n="loginSub"></p>
    <form class="form" id="loginForm" novalidate>
      <div class="field">
        <label for="liId" data-i18n="userId"></label>
        <input class="input" id="liId" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
        <div class="err-msg" id="liIdErr" aria-live="polite"></div>
      </div>
      <div class="field">
        <label for="liPw" data-i18n="password"></label>
        <div class="pw">
          <input class="input" id="liPw" type="password" autocomplete="current-password">
          <button class="pw-toggle" type="button" data-pw="liPw"></button>
        </div>
        <div class="err-msg" id="liPwErr" aria-live="polite"></div>
      </div>
      <button class="btn" type="submit" data-i18n="loginBtn"></button>
      <button class="link" type="button" id="forgotBtn" data-i18n="forgot"></button>
    </form>
    <hr class="divider">
    <p class="switch"><span data-i18n="noAccount"></span> <button class="link" type="button" data-go="signup" data-i18n="goSignup"></button></p>
  </section>

  <!-- 회원가입: 1 초대 코드, 2 정보 입력 -->
  <section class="card auth" id="v-signup" hidden aria-labelledby="inviteTitle">
    <ol class="steps" id="steps">
      <li class="step" data-step="1"><i></i><span data-i18n="stepInvite"></span></li>
      <li class="step" data-step="2"><i></i><span data-i18n="stepInfo"></span></li>
      <li class="step" data-step="3"><i></i><span data-i18n="stepWait"></span></li>
    </ol>

    <div id="su1">
      <h2 class="auth-title" id="inviteTitle" data-i18n="inviteTitle"></h2>
      <p class="auth-sub" data-i18n="inviteSub"></p>
      <form class="form" id="inviteForm" novalidate>
        <div class="field">
          <label for="suCode" data-i18n="inviteLabel"></label>
          <input class="input code-in" id="suCode" type="text" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX">
          <div class="err-msg" id="suCodeErr" aria-live="polite"></div>
        </div>
        <button class="btn" type="submit" data-i18n="inviteBtn"></button>
        <p class="note center" data-i18n="inviteHelp"></p>
      </form>
      <hr class="divider">
      <p class="switch"><span data-i18n="haveAccount"></span> <button class="link" type="button" data-go="login" data-i18n="goLogin"></button></p>
    </div>

    <div id="su2" hidden>
      <h2 class="auth-title" data-i18n="infoTitle"></h2>
      <p class="auth-sub" data-i18n="infoSub"></p>
      <form class="form" id="infoForm" novalidate>
        <div class="confirmed"><span class="tag good" id="codeTag"></span><span data-i18n="codeOk"></span></div>
        <div class="field">
          <label for="suNick" data-i18n="nick"></label>
          <input class="input" id="suNick" type="text" maxlength="12" autocomplete="nickname">
          <div class="err-msg" id="suNickErr" aria-live="polite"></div>
        </div>
        <div class="field">
          <label for="suId" data-i18n="userId"></label>

  ],
  members: [
    { n: "운영진A", e: "admin1", r: "admin", d: "2025.03.02", a: true },
    { n: "운영진B", e: "admin2", r: "admin", d: "2025.03.02", a: true },
    { n: "푸른여우", e: "member1", r: "member", d: "2025.03.09", a: true },
    { n: "바람돌이", e: "member2", r: "member", d: "2025.04.21", a: true },
    { n: "구름과자", e: "member3", r: "member", d: "2025.06.14", a: true },
    { n: "솜사탕", e: "member4", r: "member", d: "2025.09.30", a: false },
    { n: "은하수", e: "member5", r: "member", d: "2026.01.18", a: true },
    { n: "모래시계", e: "member6", r: "member", d: "2026.05.07", a: true }
  ],
  codes: [
    { c: "W3VB-6PXE", exp: "10/20", used: false, expired: false },
    { c: "H8NQ-1ZKD", exp: "10/20", used: false, expired: false },
    { c: "K7QD-92LM", exp: "10/17", used: true, expired: false },
    { c: "R4TW-8HNC", exp: "10/17", used: true, expired: false },
    { c: "M2FJ-5YDA", exp: "10/16", used: true, expired: false },
    { c: "T9CU-3GSB", exp: "10/16", used: true, expired: false },
    { c: "P0ZX-4TRY", exp: "10/05", used: false, expired: true }
  ]
};

var order = ["combo", "league", "channel"];
var VIEWS = ["login", "signup", "pending", "admin", "home"];
var state = { lang: "ko", menu: "combo", view: "login", tab: "req", signup: { step: 1, code: "" }, user: null };

/* ---------- 공통 도우미 ---------- */
function $(id) { return document.getElementById(id); }
function s(k) { return S[state.lang][k]; }
function esc(v) {
  return String(v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function fmtTime(d) { return (d.getMonth() + 1) + "/" + d.getDate() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function fmtDay(d) { return (d.getMonth() + 1) + "/" + d.getDate(); }
function fmtFull(d) { return d.getFullYear() + "." + pad(d.getMonth() + 1) + "." + pad(d.getDate()); }
function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function setErr(inputId, msgId, text) {
  var el = $(inputId);
  el.classList.toggle("err", !!text);
  el.setAttribute("aria-invalid", text ? "true" : "false");
  $(msgId).textContent = text || "";
  return !text;
}

function toast(msg) {
  var el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(function () { el.classList.remove("show"); }, 2600);
}

/* ---------- 화면 전환 (접근 규칙) ---------- */
function show(view) {
  var u = state.user;
  var active = !!u && u.status === "active";
  if (view === "admin" && !(active && u.role === "admin")) view = active ? "home" : (u ? "pending" : "login");
  if (view === "home" && !active) view = u ? "pending" : "login";
  if (view === "pending" && !(u && u.status === "pending")) view = active ? "home" : "login";
  if ((view === "login" || view === "signup") && u) view = active ? "home" : "pending";
  state.view = view;
  VIEWS.forEach(function (v) { $("v-" + v).hidden = v !== view; });
  renderAll();
  window.scrollTo(0, 0);
}

function demoUser(kind) {
  if (kind === "admin") return { role: "admin", status: "active", nickname: "운영진A", loginId: "admin1" };
  if (kind === "pending") return { role: "member", status: "pending", nickname: "별빛사수", loginId: "user1", code: "K7QD-92LM", at: fmtTime(new Date()) };
  return { role: "member", status: "active", nickname: "푸른여우", loginId: "member1" };
}

/* ---------- 렌더링 ---------- */
function applyI18n() {
  var nodes = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < nodes.length; i++) nodes[i].textContent = s(nodes[i].getAttribute("data-i18n"));
  var toggles = document.querySelectorAll(".pw-toggle");
  for (var j = 0; j < toggles.length; j++) {
    var inp = $(toggles[j].getAttribute("data-pw"));
    toggles[j].textContent = inp.type === "password" ? s("show") : s("hide");
  }
}

function renderHeader() {
  var u = state.user;
  var active = !!u && u.status === "active";
  $("userChip").hidden = !u;
  if (u) {
    var role = u.status === "pending" ? s("statusPending") : (u.role === "admin" ? s("roleAdmin") : s("roleMember"));
    $("userChip").textContent = u.nickname + " · " + role;
  }
  $("logoutBtn").hidden = !u;
  $("logoutBtn").textContent = s("logout");
  var showNav = active && u.role === "admin";
  $("navBtn").hidden = !showNav;
  $("navBtn").textContent = state.view === "admin" ? s("homeNav") : s("adminNav");
}

function renderSteps() {
  var items = document.querySelectorAll("#steps .step");
  for (var i = 0; i < items.length; i++) {
    var n = parseInt(items[i].getAttribute("data-step"), 10);
    items[i].className = "step" + (n === state.signup.step ? " on" : (n < state.signup.step ? " done" : ""));
  }
  $("su1").hidden = state.signup.step !== 1;
  $("su2").hidden = state.signup.step !== 2;
  $("codeTag").textContent = state.signup.code;
}

function renderPending() {
  var u = state.user;
  if (!u || u.status !== "pending") return;
  $("pNick").textContent = u.nickname;
  $("pId").textContent = u.loginId;
  $("pCode").textContent = u.code ? u.code.slice(0, 4) + "-••••" : "-";
  $("pTime").textContent = u.at || "-";
}

function tag(cls, text) { return '<span class="tag ' + cls + '">' + esc(text) + "</span>"; }

function renderAdmin() {
  var tabs = [["req", s("tabReq"), DB.requests.length], ["mem", s("tabMem"), 0], ["code", s("tabCode"), 0]];
  $("adminTabs").innerHTML = tabs.map(function (t) {
    return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (state.tab === t[0]) + '">' + esc(t[1]) +
      (t[2] > 0 ? ' <span class="cnt">' + t[2] + "</span>" : "") + "</button>";
  }).join("");

  var html = "";
  var note = s("sampleAdmin");
  if (state.tab === "req") {
    if (!DB.requests.length) {
      html = '<p class="empty">' + esc(s("emptyReq")) + "</p>";
    } else {
      html = '<div class="tbl-wrap"><table><thead><tr><th>' + [s("thNick"), s("thId"), s("thTime"), s("thCode"), s("thAction")].join("</th><th>") + "</th></tr></thead><tbody>" +
        DB.requests.map(function (r, i) {
          return "<tr><td>" + esc(r.n) + "</td><td>" + esc(r.e) + "</td><td>" + esc(r.t) + '</td><td class="code">' + esc(r.c) + '</td><td><span class="act">' +
            '<button class="mini-btn danger" type="button" data-act="reject" data-i="' + i + '">' + esc(s("reject")) + "</button>" +
            '<button class="mini-btn ok" type="button" data-act="approve" data-i="' + i + '">' + esc(s("approve")) + "</button></span></td></tr>";
        }).join("") + "</tbody></table></div>";
    }
  } else if (state.tab === "mem") {
    html = '<div class="tbl-wrap"><table><thead><tr><th>' + [s("thNick"), s("thId"), s("thRole"), s("thJoined"), s("thStatus"), s("thAction")].join("</th><th>") + "</th></tr></thead><tbody>" +
      DB.members.map(function (m, i) {
        var action = m.r === "admin" ? '<span class="muted">-</span>' :
          '<button class="mini-btn' + (m.a ? " danger" : "") + '" type="button" data-act="toggle" data-i="' + i + '">' + esc(m.a ? s("deactivate") : s("activate")) + "</button>";
        return "<tr><td>" + esc(m.n) + "</td><td>" + esc(m.e) + "</td><td>" + tag(m.r === "admin" ? "acc" : "mute", m.r === "admin" ? s("roleAdmin") : s("roleMember")) +
          "</td><td>" + esc(m.d) + "</td><td>" + tag(m.a ? "good" : "mute", m.a ? s("statusActive") : s("statusOff")) + "</td><td>" + action + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  } else {
    note = s("codeNote");
    html = '<div class="bar"><p>' + esc(s("codeNote")) + '</p><button class="btn sm" type="button" data-act="newcode">' + esc(s("newCode")) + "</button></div>" +
      '<div class="tbl-wrap"><table><thead><tr><th>' + [s("thCode"), s("thExpire"), s("thStatus"), s("thAction")].join("</th><th>") + "</th></tr></thead><tbody>" +
      DB.codes.map(function (c, i) {
        var st = c.used ? tag("mute", s("useUsed")) : (c.expired ? tag("bad", s("useExpired")) : tag("good", s("useAvail")));
        var cp = (!c.used && !c.expired) ? '<button class="mini-btn" type="button" data-act="copy" data-i="' + i + '">' + esc(s("copy")) + "</button>" : '<span class="muted">-</span>';
        return '<tr><td class="code">' + esc(c.c) + "</td><td>" + esc(c.exp) + "</td><td>" + st + "</td><td>" + cp + "</td></tr>";
      }).join("") + "</tbody></table></div>";
    note = "";
  }
  $("adminBody").innerHTML = html;
  $("adminNote").textContent = note;
  $("adminNote").hidden = !note;
}

function renderMenu() {
  var t = T[state.lang];
  $("menu").innerHTML = order.map(function (id) {
    var m = t.menus[id];
    return '<button class="row" type="button" role="tab" data-id="' + id + '" aria-selected="' + (id === state.menu) + '">' +
      '<span class="ico">' + ICONS[id] + "</span>" +
      '<span class="txt"><span class="name">' + m.name + '</span><span class="desc">' + m.desc + "</span></span>" +
      '<span class="go">' + ICONS.go + "</span></button>";
  }).join("");
}

function renderPreview() {
  var t = T[state.lang];
  var d = t.data[state.menu];
  $("thead").innerHTML = "<tr>" + d.cols.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "</tr>";
  $("tbody").innerHTML = d.rows.map(function (r, i) {
    var cells = r.map(function (cell) {
      if (cell === "go") return '<td><button class="mini-btn" type="button" data-move="1">' + d.goLabel + "</button></td>";
      if (Array.isArray(cell)) return '<td><span class="tag ' + cell[1] + '">' + cell[0] + "</span></td>";
      return "<td>" + cell + "</td>";
    }).join("");
    var top = (i === (d.top === undefined ? -1 : d.top)) ? ' class="top"' : "";
    return "<tr" + top + ">" + cells + "</tr>";
  }).join("");
  $("tips").innerHTML = d.tips.map(function (x) { return "<li>" + x + "</li>"; }).join("");
  $("sampleNote").hidden = state.menu !== "combo";
}

function renderHomeText() {
  var t = T[state.lang];
  $("siteSub").textContent = t.sub;
  $("banner").textContent = t.banner;
  $("menuTitle").textContent = t.menuTitle;
  $("infoTitle").textContent = t.infoTitle;
  $("prevTitle").textContent = t.prevTitle;
  $("tipTitle").textContent = t.tipTitle;
  $("lbl1").textContent = t.lbl1; $("val1").textContent = t.val1;
  $("lbl2").textContent = t.lbl2; $("val2").textContent = t.val2;
  $("openBtn").textContent = t.open;
  $("sampleNote").textContent = t.sample;
  $("foot").innerHTML = t.foot.map(function (l) { return "<p>" + l + "</p>"; }).join("");
  renderMenu();
  renderPreview();
}

function renderAll() {
  document.documentElement.lang = state.lang;
  $("langKo").setAttribute("aria-pressed", state.lang === "ko");
  $("langEn").setAttribute("aria-pressed", state.lang === "en");
  renderHomeText();
  applyI18n();
  renderHeader();
  renderSteps();
  renderPending();
  renderAdmin();
}

/* ---------- 이벤트 ---------- */
function go() {
  var url = ROUTES[state.menu];
  if (url) { window.location.href = url; } else { toast(T[state.lang].soon); }
}

$("menu").addEventListener("click", function (e) {
  var btn = e.target.closest(".row");
  if (!btn) return;
  state.menu = btn.getAttribute("data-id");
  renderMenu();
  renderPreview();
});
$("tbody").addEventListener("click", function (e) { if (e.target.closest("[data-move]")) go(); });
$("openBtn").addEventListener("click", go);

$("langKo").addEventListener("click", function () { state.lang = "ko"; safeSet("ggo-lang", "ko"); renderAll(); });
$("langEn").addEventListener("click", function () { state.lang = "en"; safeSet("ggo-lang", "en"); renderAll(); });
$("themeBtn").addEventListener("click", function () {
  var root = document.documentElement;
  var cur = root.getAttribute("data-theme");
  if (!cur) cur = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  var next = cur === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  safeSet("ggo-theme", next);
});

$("brand").addEventListener("click", function (e) {
  e.preventDefault();
  show(state.user ? (state.user.status === "active" ? "home" : "pending") : "login");
});
$("navBtn").addEventListener("click", function () { show(state.view === "admin" ? "home" : "admin"); });
$("logoutBtn").addEventListener("click", function () {
  /* Firebase: signOut(auth) */
  state.user = null;
  state.signup = { step: 1, code: "" };
  toast(s("loggedOut"));
  show("login");
});

document.addEventListener("click", function (e) {
  var g = e.target.closest("[data-go]");
  if (g) {
    var to = g.getAttribute("data-go");
    if (to === "signup") state.signup = { step: 1, code: "" };
    show(to);
    return;
  }
  var pw = e.target.closest(".pw-toggle");
  if (pw) {
    var inp = $(pw.getAttribute("data-pw"));
    inp.type = inp.type === "password" ? "text" : "password";
    pw.textContent = inp.type === "password" ? s("show") : s("hide");
  }
});

/* 미리보기 막대 */
$("devbar").addEventListener("click", function (e) {
  var b = e.target.closest("[data-dev]");
  if (!b) return;
  var k = b.getAttribute("data-dev");
  if (k === "login") { state.user = null; show("login"); }
  else if (k === "signup") { state.user = null; state.signup = { step: 1, code: "" }; show("signup"); }
  else if (k === "pending") { state.user = demoUser("pending"); show("pending"); }
  else if (k === "admin") { state.user = demoUser("admin"); show("admin"); }
  else if (k === "home") { state.user = demoUser("member"); show("home"); }
});

/* 로그인 */
$("loginForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var em = $("liId").value.trim().toLowerCase();
  var pw = $("liPw").value;
  var ok1 = setErr("liId", "liIdErr", em ? "" : s("errId"));
  var ok2 = setErr("liPw", "liPwErr", pw ? "" : s("errPw"));
  if (!ok1 || !ok2) return;
  /* Firebase: signInWithEmailAndPassword(auth, em + "@ggo-play.local", pw)  (아이디를 가짜 이메일로 변환)
     그 다음 Firestore users/{uid}.status 를 읽어 active 면 메인, pending 이면 승인 대기 화면으로 보냅니다. */
  var local = em;
  var u = { role: "member", status: "active", nickname: local, loginId: em };
  if (local.indexOf("admin") === 0) u.role = "admin";
  if (local.indexOf("pending") === 0) { u.status = "pending"; u.code = "K7QD-92LM"; u.at = fmtTime(new Date()); }
  state.user = u;
  $("liPw").value = "";
  show(u.status === "pending" ? "pending" : "home");
});
$("forgotBtn").addEventListener("click", function () {
  /* 아이디 방식에서는 재설정 메일을 보낼 수 없어 운영진이 직접 처리합니다. */
  toast(s("resetInfo"));
});

/* 회원가입 1단계: 초대 코드 */
$("suCode").addEventListener("input", function () {
  var v = this.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
  if (v.length > 4) v = v.slice(0, 4) + "-" + v.slice(4);
  this.value = v;
});
$("inviteForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var v = $("suCode").value.trim();
  if (!/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(v)) { setErr("suCode", "suCodeErr", s("errInvite")); return; }
  setErr("suCode", "suCodeErr", "");
  /* Firebase: Cloud Function 으로 inviteCodes/{코드} 를 확인합니다 (존재, 미사용, 만료 전).
     코드 목록을 브라우저가 직접 읽을 수 없게 해야 안전합니다. */
  state.signup = { step: 2, code: v };
  renderSteps();
  toast(s("codeOk"));
});

/* 회원가입 2단계: 정보 입력 */
$("suBack").addEventListener("click", function () { state.signup.step = 1; renderSteps(); });
$("infoForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var nick = $("suNick").value.trim();
  var em = $("suId").value.trim().toLowerCase();
  var pw = $("suPw").value;
  var pw2 = $("suPw2").value;
  var r = [
    setErr("suNick", "suNickErr", (nick.length >= 2 && nick.length <= 12) ? "" : s("errNick")),
    setErr("suId", "suIdErr", /^[a-z0-9]{4,16}$/.test(em) ? "" : s("errIdFormat")),
    setErr("suPw", "suPwErr", pw.length >= 6 ? "" : s("errPwShort")),
    setErr("suPw2", "suPw2Err", (pw2 === pw && pw2) ? "" : s("errPw2")),
    setErr("suAgree", "suAgreeErr", $("suAgree").checked ? "" : s("errAgree"))
  ];
  if (r.indexOf(false) !== -1) return;
  /* Firebase: createUserWithEmailAndPassword(auth, em + "@ggo-play.local", pw)  (이미 사용 중이면 auth/email-already-in-use 오류로 중복 안내)
     그 다음 Firestore users/{uid} = { nickname, status: "pending", inviteCode, createdAt } 저장,
     초대 코드는 Cloud Function 에서 사용 처리합니다. */
  state.user = { role: "member", status: "pending", nickname: nick, loginId: em, code: state.signup.code, at: fmtTime(new Date()) };
  state.signup = { step: 1, code: "" };
  ["suCode", "suNick", "suId", "suPw", "suPw2"].forEach(function (id) { $(id).value = ""; });
  $("suAgree").checked = false;
  show("pending");
});

/* 승인 대기 */
$("refreshBtn").addEventListener("click", function () {
  /* Firebase: users/{uid}.status 를 다시 읽어 active 면 메인으로 이동합니다. */
  toast(s("stillPending"));
});

/* 운영진 승인 관리 */
$("adminTabs").addEventListener("click", function (e) {
  var b = e.target.closest("[data-tab]");
  if (!b) return;
  state.tab = b.getAttribute("data-tab");
  renderAdmin();
});
$("adminBody").addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]");
  if (!b) return;
  var act = b.getAttribute("data-act");
  var i = parseInt(b.getAttribute("data-i"), 10);
  if (act === "approve") {
    /* Firebase: users/{uid}.status 를 "active" 로 변경 (운영진만 가능하도록 Security Rules 설정) */
    var r = DB.requests.splice(i, 1)[0];
    DB.members.push({ n: r.n, e: r.e, r: "member", d: fmtFull(new Date()), a: true });
    toast(s("approved").replace("{n}", r.n));
  } else if (act === "reject") {
    var q = DB.requests.splice(i, 1)[0];
    toast(s("rejected").replace("{n}", q.n));
  } else if (act === "toggle") {
    var m = DB.members[i];
    m.a = !m.a;
    toast(s(m.a ? "activated" : "deactivated").replace("{n}", m.n));
  } else if (act === "newcode") {
    var alpha = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    var code = "";
    for (var k = 0; k < 8; k++) code += alpha.charAt(Math.floor(Math.random() * alpha.length));
    var exp = new Date();
    exp.setDate(exp.getDate() + 7);
    DB.codes.unshift({ c: code.slice(0, 4) + "-" + code.slice(4), exp: fmtDay(exp), used: false, expired: false });
    toast(s("newCodeDone"));
  } else if (act === "copy") {
    var text = DB.codes[i].c;
    try {
      navigator.clipboard.writeText(text).then(function () { toast(s("copied")); }, function () { toast(s("copyFail") + " " + text); });
    } catch (err) { toast(s("copyFail") + " " + text); }
  }
  renderAdmin();
});

/* 시작 */
var savedLang = safeGet("ggo-lang");
if (savedLang === "ko" || savedLang === "en") state.lang = savedLang;
var savedTheme = safeGet("ggo-theme");
if (savedTheme === "dark" || savedTheme === "light") document.documentElement.setAttribute("data-theme", savedTheme);
show("login");
</script>
</body>
</html>

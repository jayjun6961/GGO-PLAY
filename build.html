<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빌드 — GGO PLAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep:#0a0612; --bg-card:#130d24; --bg-card2:#1a1035;
    --purple-1:#7c3aed; --purple-2:#9d5ff5; --purple-3:#c084fc;
    --accent-pink:#f472b6; --accent-cyan:#22d3ee; --accent-gold:#fbbf24;
    --text-main:#f0e8ff; --text-sub:#9d8ec4; --text-dim:#5c4e7a;
    --sidebar-w:72px; --bottombar-h:64px;
    --gold:#fbbf24; --silver:#e2e8f0; --bronze:#cd7f32;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg-deep);color:var(--text-main);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 15% 20%,rgba(124,58,237,0.18) 0%,transparent 70%),radial-gradient(ellipse 50% 50% at 85% 75%,rgba(157,95,245,0.12) 0%,transparent 70%);pointer-events:none;z-index:0;}

  /* SIDEBAR */
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:rgba(19,13,36,0.95);border-right:1px solid rgba(124,58,237,0.2);display:flex;flex-direction:column;align-items:center;padding:20px 0;z-index:100;backdrop-filter:blur(20px);}
  .sidebar-logo{width:42px;height:42px;background:linear-gradient(135deg,var(--purple-1),var(--purple-3));border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:16px;color:white;margin-bottom:32px;box-shadow:0 0 20px rgba(124,58,237,0.5);}
  .sidebar-nav{display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}.sidebar-nav::-webkit-scrollbar{display:none;}
  .nav-item{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;position:relative;color:var(--text-dim);border:none;background:transparent;}
  .nav-item:hover,.nav-item.active{background:rgba(124,58,237,0.2);color:var(--purple-3);box-shadow:0 0 20px rgba(124,58,237,0.3);}
  .nav-item.active::before{content:'';position:absolute;left:-12px;width:3px;height:24px;background:var(--purple-2);border-radius:0 3px 3px 0;}
  .nav-item .tooltip{position:absolute;left:60px;background:rgba(19,13,36,0.95);color:var(--text-main);font-size:12px;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.15s;z-index:200;border:1px solid rgba(124,58,237,0.2);}
  .nav-item:hover .tooltip{opacity:1;}
  .sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .avatar-sm{width:36px;height:36px;border-radius:50%;background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.3);display:flex;align-items:center;justify-content:center;font-size:18px;}

  /* BOTTOM NAV */
  

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}

  @media(max-width:640px){
    .sidebar{display:none}.bottom-nav{display:flex}
    .main-wrap{margin-left:0!important;padding-bottom:calc(var(--bottombar-h)+20px)!important}
    .top3-wrap{grid-template-columns:1fr!important;}
    .lb-table{font-size:11px!important;}
    .lb-col-bp,.lb-col-ts,.lb-col-deco{display:none!important;}
    .lb-head-bp,.lb-head-ts,.lb-head-deco{display:none!important;}
  }

  /* MAIN */
  .main-wrap{margin-left:var(--sidebar-w);padding:28px 28px 48px;position:relative;min-height:100vh;}

  /* TOPBAR */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
  .topbar-back{width:36px;height:36px;border-radius:10px;background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.25);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--purple-3);font-size:18px;transition:all 0.2s;}
  .topbar-back:hover{background:rgba(124,58,237,0.3);}

  /* 페이지 타이틀 */
  .page-header{text-align:center;margin-bottom:36px;}
  .page-eyebrow{font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:3px;color:var(--text-dim);margin-bottom:8px;}
  .page-title{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:900;
    background:linear-gradient(135deg,var(--purple-3),var(--accent-cyan),var(--purple-2));
    background-size:200% auto;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:shimmer 4s linear infinite;}
  .page-formula{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(124,58,237,0.08);border:1px solid rgba(124,58,237,0.18);border-radius:20px;padding:5px 14px;font-size:11px;color:var(--text-dim);}
  .formula-item{color:var(--text-sub);}
  .formula-sep{color:var(--text-dim);}

  /* ── TOP3 ── */
  .top3-section{margin-bottom:36px;}
  .section-label{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--text-dim);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .section-label::after{content:'';flex:1;height:1px;background:rgba(124,58,237,0.15);}

  .top3-wrap{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:14px;align-items:end;}

  .top-card{
    background:var(--bg-card);
    border:1px solid rgba(124,58,237,0.2);
    border-radius:18px;
    padding:20px 16px 18px;
    text-align:center;
    position:relative;
    animation:fadeUp 0.4s ease both;
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .top-card.rank1{border-color:rgba(251,191,36,0.35);background:linear-gradient(180deg,rgba(251,191,36,0.08) 0%,var(--bg-card) 60%);animation-delay:0.1s;}
  .top-card.rank2{border-color:rgba(226,232,240,0.25);background:linear-gradient(180deg,rgba(226,232,240,0.05) 0%,var(--bg-card) 60%);animation-delay:0.2s;}
  .top-card.rank3{border-color:rgba(205,127,50,0.25);background:linear-gradient(180deg,rgba(205,127,50,0.06) 0%,var(--bg-card) 60%);animation-delay:0.3s;}

  .top-crown{font-size:22px;animation:float 2.5s ease-in-out infinite;line-height:1;}
  .top-avatar{width:62px;height:62px;border-radius:50%;object-fit:cover;border:2px solid rgba(124,58,237,0.3);}
  .top-avatar-placeholder{width:62px;height:62px;border-radius:50%;background:var(--bg-card2);border:2px solid rgba(124,58,237,0.2);display:flex;align-items:center;justify-content:center;font-size:24px;}
  .top-rank-badge{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;}
  .rank1 .top-rank-badge{background:rgba(251,191,36,0.15);color:var(--gold);border:1px solid rgba(251,191,36,0.3);}
  .rank2 .top-rank-badge{background:rgba(226,232,240,0.1);color:var(--silver);border:1px solid rgba(226,232,240,0.2);}
  .rank3 .top-rank-badge{background:rgba(205,127,50,0.1);color:var(--bronze);border:1px solid rgba(205,127,50,0.2);}
  .top-name{font-size:13px;font-weight:700;color:var(--text-main);}
  .top-server{font-size:10px;color:var(--accent-cyan);font-family:'Orbitron',sans-serif;}
  .top-score{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;color:var(--purple-3);}
  .rank1 .top-score{color:var(--gold);}
  .rank2 .top-score{color:var(--silver);}
  .rank3 .top-score{color:var(--bronze);}
  .top-score-label{font-size:9px;color:var(--text-dim);font-family:'Orbitron',sans-serif;}
  .top-sub-stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:2px;}
  .top-sub-stat{font-size:10px;color:var(--text-dim);background:rgba(124,58,237,0.07);border:1px solid rgba(124,58,237,0.12);border-radius:6px;padding:2px 7px;}
  .top-sub-stat span{color:var(--text-sub);}

  /* ── 리더보드 테이블 ── */
  .lb-section{background:var(--bg-card);border:1px solid rgba(124,58,237,0.15);border-radius:16px;overflow:hidden;}
  .lb-head{display:grid;grid-template-columns:48px 42px 1fr 70px 90px 90px 80px 100px;align-items:center;padding:10px 16px;background:rgba(124,58,237,0.07);border-bottom:1px solid rgba(124,58,237,0.12);}
  .lb-head-cell{font-family:'Orbitron',sans-serif;font-size:9px;color:var(--text-dim);text-align:center;}
  .lb-head-cell.left{text-align:left;}

  .lb-row{display:grid;grid-template-columns:48px 42px 1fr 70px 90px 90px 80px 100px;align-items:center;padding:10px 16px;border-bottom:1px solid rgba(124,58,237,0.07);transition:background 0.15s;animation:fadeUp 0.3s ease both;}
  .lb-row:last-child{border-bottom:none;}
  .lb-row:hover{background:rgba(124,58,237,0.06);}

  .lb-rank{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;text-align:center;color:var(--text-dim);}
  .lb-rank.r1{color:var(--gold);}
  .lb-rank.r2{color:var(--silver);}
  .lb-rank.r3{color:var(--bronze);}

  .lb-avatar-cell{display:flex;justify-content:center;}
  .lb-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid rgba(124,58,237,0.25);}
  .lb-avatar-ph{width:32px;height:32px;border-radius:50%;background:var(--bg-card2);border:1px solid rgba(124,58,237,0.2);display:flex;align-items:center;justify-content:center;font-size:14px;}

  .lb-name-cell{display:flex;flex-direction:column;gap:1px;}
  .lb-name{font-size:12px;font-weight:600;color:var(--text-main);}

  .lb-cell{font-family:'Orbitron',sans-serif;font-size:11px;text-align:center;color:var(--text-sub);}
  .lb-cell.server{color:var(--accent-cyan);font-size:10px;}
  .lb-cell.score-total{color:var(--purple-3);font-size:13px;font-weight:700;}
  .lb-cell.r1{color:var(--gold);}
  .lb-cell.r2{color:var(--silver);}
  .lb-cell.r3{color:var(--bronze);}

  /* 로딩 */
  .loading-wrap{text-align:center;padding:60px;color:var(--text-dim);}
  .spinner{width:32px;height:32px;border:3px solid rgba(124,58,237,0.15);border-top-color:var(--purple-2);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}

  /* ── BUILD PAGE ── */
  .build-wrap {{
    margin-left: var(--sidebar-w);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 40px;
    box-sizing: border-box;
    width: calc(100% - var(--sidebar-w));
  }}
  .build-card {{
    background: rgba(19,13,36,0.9);
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 24px;
    padding: 52px 60px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(124,58,237,0.15);
  }}
  .build-card::before {{
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(124,58,237,0.07), transparent, rgba(34,211,238,0.04));
    pointer-events: none;
  }}
  .build-icon-ring {{
    width: 88px; height: 88px; border-radius: 22px;
    background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(34,211,238,0.1));
    border: 1.5px solid rgba(124,58,237,0.4);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 28px;
    box-shadow: 0 0 30px rgba(124,58,237,0.3);
    animation: buildRingPulse 3s ease-in-out infinite;
  }}
  @keyframes buildRingPulse {{
    0%,100% {{ box-shadow:0 0 24px rgba(124,58,237,0.3); }}
    50% {{ box-shadow:0 0 48px rgba(124,58,237,0.55), 0 0 70px rgba(34,211,238,0.15); }}
  }}
  .build-badge {{
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.35);
    border-radius: 20px; padding: 5px 16px;
    font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700;
    color: #fbbf24; letter-spacing: 1.5px; margin-bottom: 22px;
    animation: badgePulse 2.4s ease-in-out infinite;
  }}
  @keyframes badgePulse {{ 0%,100%{{opacity:.65;}} 50%{{opacity:1;}} }}
  .build-title {{
    font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900;
    margin-bottom: 10px; letter-spacing: 1px;
  }}
  .build-title .hi {{
    background: linear-gradient(90deg, #c084fc, #22d3ee);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }}
  .build-desc {{
    font-size: 13.5px; color: var(--text-sub); line-height: 1.7;
    margin-bottom: 28px; font-family: 'Noto Sans KR', sans-serif;
  }}
  .build-cafe-box {{
    background: rgba(34,211,238,0.07);
    border: 1px solid rgba(34,211,238,0.2);
    border-radius: 12px; padding: 12px 20px;
    font-size: 12.5px; color: var(--accent-cyan);
    font-family: 'Noto Sans KR', sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }}
  .build-particles {{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }}
  .build-particle {{
    position:absolute; width:3px; height:3px; border-radius:50%;
    opacity:0; animation:pDrift var(--dur,5s) var(--del,0s) ease-in-out infinite;
  }}
  @keyframes pDrift {{
    0% {{ opacity:0; transform:translateY(0) scale(0); }}
    25% {{ opacity:.7; }}
    75% {{ opacity:.3; }}
    100% {{ opacity:0; transform:translateY(-90px) scale(1.8); }}
  }}
  @media (max-width:640px) {{
    .build-wrap {{ margin-left:0; padding:24px 16px; width:100%; }}
    .build-card {{ padding:36px 24px; }}
    .build-title {{ font-size:20px; }}
  }}

  /* ════ 모바일 텍스트 짤림 수정 ════ */
  @media (max-width: 640px) {
    /* 텍스트 전역 줄바꿈 허용 */
    * { word-break: keep-all; overflow-wrap: break-word; }

    /* Topbar */
    .topbar { padding: 10px 12px !important; gap: 8px !important; flex-wrap: nowrap !important; }
    .greeting { flex: 1; min-width: 0; overflow: hidden; }
    .greeting h1 { font-size: 11px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .greeting h2 { font-size: 11px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .greeting p  { font-size: 10px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .search-bar  { min-width: 0; flex: 1; }
    .search-bar input { font-size: 12px !important; }
    .topbar-icons { flex-shrink: 0; gap: 6px !important; }
    .topbar-btn   { width: 36px !important; height: 36px !important; }

    /* 헤더/타이틀 */
    .page-title   { font-size: 18px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .section-title{ font-size: 13px !important; }
    .hero-title   { font-size: 22px !important; line-height: 1.1; }
    .hero-sub     { font-size: 11px !important; }

    /* 카드 내 텍스트 */
    .card-title   { font-size: 12px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-sub     { font-size: 10px !important; overflow: hidden; }

    /* 탭 버튼 */
    .tab  { font-size: 10px !important; padding: 6px 8px !important; white-space: nowrap; }
    .tab-bar { overflow-x: auto !important; flex-wrap: nowrap !important; scrollbar-width: none; }
    .tab-bar::-webkit-scrollbar { display: none; }

    /* 배틀패스 / 친선대회 보상 텍스트 */
    .reward-name  { font-size: 10px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bp-tier-label{ font-size: 9px !important; }

    /* 순위표 */
    .lb-name  { font-size: 11px !important; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 90px; }
    .lb-row   { padding: 8px 10px !important; }
    .lb-cell  { font-size: 10px !important; }

    /* 일반 overflow 방지 */
    .content-wrap, .main, .main-wrap { overflow-x: hidden !important; }
  }

  /* ════ MOBILE BOTTOM NAV (강제 적용) ════ */
  .bottom-nav {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--bottombar-h);
    background: rgba(8,5,18,0.97);
    border-top: 1px solid rgba(124,58,237,0.22);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 200;
    overflow: hidden;
  }
  .bnav-scroll {
    display: flex !important;
    flex-direction: row !important;
    align-items: center;
    height: 100%;
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 0 4px;
    box-sizing: border-box;
  }
  .bnav-scroll::-webkit-scrollbar { display: none; }
  .bnav-item {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 3px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 12px;
    transition: all .18s;
    color: #64748b;
    flex-shrink: 0;
    min-width: 58px;
    -webkit-tap-highlight-color: transparent;
  }
  .bnav-item:active { background: rgba(124,58,237,.12); transform: scale(.93); }
  .bnav-item.active { color: #c084fc; }
  .bnav-item.active .bnav-icon { background: rgba(124,58,237,.2); border-radius: 10px; }
  .bnav-icon {
    width: 36px;
    height: 28px;
    display: flex !important;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .18s;
  }
  .bnav-label {
    font-size: 9px !important;
    font-family: 'Noto Sans KR', sans-serif !important;
    font-weight: 500;
    white-space: nowrap !important;
    line-height: 1;
    text-align: center;
    display: block !important;
  }
  .bottom-nav::after {
    content: '';
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 20px;
    background: linear-gradient(to right, transparent, rgba(8,5,18,.9));
    pointer-events: none;
    z-index: 1;
  }
</style>

<!-- Firebase SDK (클라우드 동기화용) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="sync.js"></script>
</head>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">G</div>
  <nav class="sidebar-nav">
    <button class="nav-item" onclick="location.href='index.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg><span class="tooltip">홈</span></button>
    <button class="nav-item" onclick="location.href='character.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg><span class="tooltip">캐릭터</span></button>
    <button class="nav-item" onclick="location.href='equipment.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18"/><path d="M9 3v18"/></svg><span class="tooltip">장비</span></button>

        <ellipse cx='${VX}' cy='${H}' rx='${W*0.55}' ry='${H*0.65}' fill='url(#mpBL3)'/>
        <ellipse cx='${VX}' cy='${H}' rx='${W*0.18}' ry='${H*0.25}' fill='#ff5500' opacity='0.35' filter='url(#mpgB3)'/>
        <ellipse cx='${VX}' cy='${H}' rx='${W*0.06}' ry='${H*0.08}' fill='#ff8800' opacity='0.55' filter='url(#mpgN3)'/>
        <line x1='${VX}' y1='${H}' x2='${VX}' y2='${H*0.7}' stroke='#ff6600' stroke-width='1.5' opacity='0.7' filter='url(#mpgN3)'/>
        ${sL}${sR}
      </svg>`;
    }
  }



// ── 사이드바 아바타 초기화 (아이콘 + 이름효과) ──
function initSidebarProfile() {
  const username   = sessionStorage.getItem('ggo_username') || '';
  const isLoggedIn = sessionStorage.getItem('ggo_logged_in') === 'true';
  const av = document.getElementById('sidebar-avatar');
  if(!av) return;

  if(!isLoggedIn || !username) {
    // 비로그인: 기본 표시
    av.innerHTML  = '👤';
    av.style.background = 'linear-gradient(135deg,var(--purple-1),var(--accent-pink))';
    av.style.overflow = '';
    av.title = '로그인';
    return;
  }

  av.title = username + ' · 마이페이지';

  const itemKey  = 'ggo_items_' + username;
  const allItems = JSON.parse(localStorage.getItem(itemKey) || '[]');
  const iconItem = allItems.find(it => it.type==='프로필아이콘' && it.equipped);

  // ── 아이콘 적용 ──
  av.style.overflow = 'hidden';
  av.style.position = 'relative';

  if(iconItem && iconItem.visualKey === '시즌7번들상자') {
    av.style.background = '#0a0000';
    const s7r = MP_S7.아이콘[iconItem._s7Idx || 0];
    if(s7r) av.innerHTML = s7r.render(38);
    else av.innerHTML = '<span style="font-size:18px">🔥</span>';
  } else if(iconItem) {
    const g  = iconItem.grade;
    const bi = iconItem.itemIdx !== undefined ? iconItem.itemIdx : (iconItem.visualIdx||0);
    const it2 = (MP_ICON_ITEMS[g]||[])[bi % (MP_ICON_ITEMS[g]?.length||1)];
    if(it2) {
      av.style.background = 'var(--bg-card, #1a1035)';
      if(it2.emoji) {
        av.innerHTML = `<span style="font-size:20px;line-height:1">${it2.emoji}</span>`;
      } else if(it2.svg) {
        av.innerHTML = `<svg width="28" height="28" viewBox="0 0 52 52" fill="none">${it2.svg}</svg>`;
      } else if(it2.holo) {
        av.innerHTML = `<div style="position:absolute;inset:0;border-radius:50%;background:${it2.holo};background-size:200%;${it2.anim?'animation:legendaryFlow 3s ease infinite':''}"></div><div style="position:relative;font-size:16px">✦</div>`;
      } else if(it2.glass) {
        av.innerHTML = `<div style="position:absolute;inset:0;border-radius:50%;background:${it2.glass};border:2px solid ${it2.border}"></div><div style="position:relative;font-size:16px">💠</div>`;
      } else {
        av.innerHTML = username.charAt(0).toUpperCase() || '?';
        av.style.background = 'linear-gradient(135deg,var(--purple-1),var(--purple-2))';
      }
    } else {
      av.innerHTML = username.charAt(0).toUpperCase() || '?';
      av.style.background = 'linear-gradient(135deg,var(--purple-1),var(--purple-2))';
    }
  } else {
    av.innerHTML = username.charAt(0).toUpperCase() || '?';
    av.style.background = 'linear-gradient(135deg,var(--purple-1),var(--accent-cyan))';
    av.style.fontSize = '16px';
  }

  // ── 사이드바 이름 표시 (topbar greeting 있으면 적용) ──
  const greetEl = document.getElementById('greet-name') || document.getElementById('sidebar-username');
  if(greetEl) greetEl.textContent = username;

  // ── 이름효과 (topbar 닉네임 텍스트 있는 경우) ──
  const nameEffItem = allItems.find(it => it.type==='이름색상효과' && it.equipped);
  applyNameEffectToElements(nameEffItem, [
    document.getElementById('greet-name'),
    document.getElementById('sidebar-username'),
    document.getElementById('topbar-username'),
  ]);
}

function applyNameEffectToElements(nameEffItem, elements) {
  elements.forEach(el => {
    if(!el) return;
    el.style.cssText = '';
    if(!nameEffItem) return;
    if(nameEffItem.visualKey === '시즌7번들상자') {
      const s7n = MP_S7.이름효과[nameEffItem._s7Idx || 0];
      if(s7n) {
        el.style.background = s7n.grad;
        el.style.backgroundSize = '200%';
        el.style.webkitBackgroundClip = 'text';
        el.style.webkitTextFillColor = 'transparent';
        el.style.backgroundClip = 'text';
        el.style.animation = 's7NameFlow 2s linear infinite';
      }
    } else {
      const g2  = nameEffItem.grade;
      const bi2 = nameEffItem.itemIdx !== undefined ? nameEffItem.itemIdx : (nameEffItem.visualIdx||0);
      const nst = (MP_NAME_EFF_ITEMS[g2]||[])[bi2 % (MP_NAME_EFF_ITEMS[g2]?.length||1)];
      if(nst) {
        if(nst.grad) {
          el.style.background = nst.grad;
          el.style.backgroundSize = '200%';
          el.style.webkitBackgroundClip = 'text';
          el.style.webkitTextFillColor = 'transparent';
          el.style.backgroundClip = 'text';
          if(nst.anim) el.style.animation = 'nameFlow 3s linear infinite';
        } else if(nst.color) {
          el.style.color = nst.color;
          if(nst.glow) el.style.textShadow = nst.glow;
        }
      }
    }
  });
}

// ── 설정 박스 토글 ──
function toggleSidebarBox(e) {
  e.stopPropagation();
  const box = document.getElementById('logout-box');
  if(!box) return;
  const isLoggedIn = sessionStorage.getItem('ggo_logged_in') === 'true';
  if(!isLoggedIn) { location.href='login.html'; return; }
  box.style.display = box.style.display==='none' ? 'block' : 'none';
  const username = sessionStorage.getItem('ggo_username') || '';
  const nameEl = document.getElementById('logout-user-name');
  if(nameEl) nameEl.textContent = username + ' 님';
}

function doSidebarLogout() {
  sessionStorage.removeItem('ggo_logged_in');
  sessionStorage.removeItem('ggo_username');
  location.href = 'index.html';
}

function goSidebarMyPage() {
  const isLoggedIn = sessionStorage.getItem('ggo_logged_in') === 'true';
  if(!isLoggedIn) { location.href='login.html'; return; }
  location.href = 'mypage.html';
}

// ── 쿠폰 모달 ──
const SC_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmibDA5_-djeNETtuGqt5I3wtRqGs0oJjEQ8KZOW6qkQpINtLtEMIDNlU4N2IwipF7peIV6qWZKx5J/pub?gid=1596868022&single=true&output=csv';

function openSidebarCoupon() {
  const box = document.getElementById('logout-box');
  if(box) box.style.display = 'none';
  ['sc-coupon-a','sc-coupon-b','sc-coupon-c'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.value = '';
  });
  setScMsg('', '');
  const modal = document.getElementById('sidebar-coupon-modal-bg');
  if(modal) { modal.style.display = 'flex'; setTimeout(()=>document.getElementById('sc-coupon-a')?.focus(),100); }
}

function closeSidebarCoupon() {
  const modal = document.getElementById('sidebar-coupon-modal-bg');
  if(modal) modal.style.display = 'none';
}

function setScMsg(txt, color) {
  const el = document.getElementById('sc-coupon-msg');
  if(el) { el.textContent = txt; el.style.color = color || '#5c4e7a'; }
}

function scAutoTab(el, nextId) {
  el.value = el.value.toUpperCase();
  if(el.value.length === 4 && nextId) document.getElementById(nextId)?.focus();
}

function scBackspace(e, el, prevId) {
  if(e.key==='Backspace' && el.value==='' && prevId) document.getElementById(prevId)?.focus();
}

async function submitSidebarCoupon() {
  const username = sessionStorage.getItem('ggo_username') || '';
  if(!username) { location.href='login.html'; return; }
  const a = (document.getElementById('sc-coupon-a')?.value||'').trim().toUpperCase();
  const b = (document.getElementById('sc-coupon-b')?.value||'').trim().toUpperCase();
  const cc = (document.getElementById('sc-coupon-c')?.value||'').trim().toUpperCase();
  if(a.length!==4||b.length!==4||cc.length!==4) { setScMsg('쿠폰 번호 12자리를 모두 입력하세요.','#f87171'); return; }
  const code = a+b+cc;
  const usedKey = 'ggo_used_coupons_' + username;
  const used = JSON.parse(localStorage.getItem(usedKey)||'[]');
  if(used.includes(code)) { setScMsg('이미 사용한 쿠폰입니다.','#f87171'); return; }
  setScMsg('확인 중...','#a78bfa');
  try {
    const res = await fetch(SC_CSV + '&cachebust=' + Date.now(), {cache:'no-store'});
    const text = await res.text();
    const rows = text.split('\n').slice(1).map(r=>r.split(','));
    const row = rows.find(r=>(r[0]||'').trim().toUpperCase()===code);
    if(!row) { setScMsg('유효하지 않은 쿠폰입니다.','#f87171'); return; }
    const type = (row[1]||'').trim();
    const amt  = parseInt(row[2]||'0');
    const name = (row[3]||'').trim();
    const currKey = 'ggo_currency_' + username;
    const curr = JSON.parse(localStorage.getItem(currKey)||'{"루비":0,"크리스탈":0,"GP":0}');
    curr[type] = (curr[type]||0) + amt;
    localStorage.setItem(currKey, JSON.stringify(curr));
    used.push(code);
    localStorage.setItem(usedKey, JSON.stringify(used));
    setScMsg(`✅ ${name || code} 등록 완료! ${type} +${amt}`, '#34d399');
    setTimeout(closeSidebarCoupon, 2000);
  } catch(err) {
    setScMsg('오류가 발생했습니다. 다시 시도해주세요.','#f87171');
  }
}

// 외부 클릭 시 설정박스 닫기
document.addEventListener('click', () => {
  const box = document.getElementById('logout-box');
  if(box) box.style.display = 'none';
});

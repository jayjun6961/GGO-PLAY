<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장비 — GGO PLAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep:#0a0612; --bg-card:#130d24; --bg-card2:#1a1035;
    --purple-1:#7c3aed; --purple-2:#9d5ff5; --purple-3:#c084fc;
    --accent-pink:#f472b6; --accent-cyan:#22d3ee; --accent-gold:#fbbf24;
    --text-main:#f0e8ff; --text-sub:#9d8ec4; --text-dim:#5c4e7a;
    --sidebar-w:72px; --bottombar-h:64px;
    --stat-up:#60a5fa; --stat-down:#f87171;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg-deep);color:var(--text-main);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 15% 20%,rgba(124,58,237,0.18) 0%,transparent 70%),radial-gradient(ellipse 50% 50% at 85% 75%,rgba(157,95,245,0.12) 0%,transparent 70%);pointer-events:none;z-index:0;}

  /* SIDEBAR */
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:rgba(19,13,36,0.95);border-right:1px solid rgba(124,58,237,0.2);display:flex;flex-direction:column;align-items:center;padding:20px 0;z-index:100;backdrop-filter:blur(20px);}
  .sidebar-logo{width:42px;height:42px;background:linear-gradient(135deg,var(--purple-1),var(--purple-3));border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:16px;color:white;margin-bottom:32px;box-shadow:0 0 20px rgba(124,58,237,0.5);}
  .sidebar-nav{display:flex;flex-direction:column;gap:8px;flex:1;}
  .nav-item{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;position:relative;color:var(--text-dim);border:none;background:transparent;}
  .nav-item:hover,.nav-item.active{background:rgba(124,58,237,0.2);color:var(--purple-3);box-shadow:0 0 20px rgba(124,58,237,0.3);}
  .nav-item.active::before{content:'';position:absolute;left:-12px;width:3px;height:24px;background:var(--purple-2);border-radius:0 3px 3px 0;}
  .nav-item .tooltip{position:absolute;left:60px;background:rgba(19,13,36,0.95);color:var(--text-main);font-size:12px;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.15s;z-index:200;border:1px solid rgba(124,58,237,0.2);}
  .nav-item:hover .tooltip{opacity:1;}
  .sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .avatar-sm{width:36px;height:36px;border-radius:50%;background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.3);display:flex;align-items:center;justify-content:center;font-size:18px;}

  /* BOTTOM NAV */
  .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bottombar-h);background:rgba(19,13,36,0.97);border-top:1px solid rgba(124,58,237,0.2);z-index:100;backdrop-filter:blur(20px);justify-content:space-around;align-items:center;padding:0 8px;}
  .bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-dim);font-size:10px;cursor:pointer;padding:6px 12px;border-radius:10px;transition:all 0.2s;flex:1;}
  .bottom-nav-item .icon{font-size:20px;}
  .bottom-nav-item.active{color:var(--purple-3);}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  @media(max-width:640px){
    .sidebar{display:none}.bottom-nav{display:flex}
    .main-wrap{margin-left:0!important;padding-bottom:calc(var(--bottombar-h)+20px)!important}
    .calc-columns{flex-direction:column!important}
    .equip-col,.weapon-col{width:100%!important}
    .col-divider{display:none!important}
    .result-grid{grid-template-columns:1fr!important}
    .char-grid{grid-template-columns:repeat(4,1fr)!important}
    .slot-items-grid{grid-template-columns:repeat(3,1fr)!important}
    .weapon-items-grid{grid-template-columns:repeat(3,1fr)!important}
  }

  /* MAIN */
  .main-wrap{margin-left:var(--sidebar-w);padding:28px 28px 48px;position:relative;z-index:1;min-height:100vh;}

  /* TOPBAR */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
  .topbar-back{width:36px;height:36px;border-radius:10px;background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.25);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--purple-3);font-size:18px;transition:all 0.2s;}
  .topbar-back:hover{background:rgba(124,58,237,0.3);}

  /* PAGE TITLE */
  .page-header{text-align:center;margin-bottom:28px;}
  .page-title{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;}
  .page-title span{color:var(--purple-3);}
  .page-sub{font-size:12px;color:var(--text-dim);margin-top:6px;}

  /* STEP 공통 */
  .step-card{background:var(--bg-card);border:1px solid rgba(124,58,237,0.2);border-radius:16px;padding:18px 20px;margin-bottom:20px;}
  .step-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .step-num{width:24px;height:24px;border-radius:50%;background:var(--purple-1);color:white;font-size:11px;font-family:'Orbitron',sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .step-num.done{background:rgba(52,211,153,0.25);color:#34d399;border:1px solid rgba(52,211,153,0.4);}
  .step-title{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;}
  .step-badge{font-size:10px;color:var(--text-dim);}

  /* ── STEP1: 캐릭터 ── */
  .char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;}
  .char-card{background:var(--bg-card2);border:1px solid rgba(124,58,237,0.12);border-radius:10px;padding:8px 6px 6px;cursor:pointer;transition:all 0.18s;display:flex;flex-direction:column;align-items:center;gap:5px;}
  .char-card:hover{border-color:rgba(124,58,237,0.4);transform:translateY(-2px);}
  .char-card.selected{border-color:var(--purple-2);background:rgba(124,58,237,0.12);box-shadow:0 0 12px rgba(124,58,237,0.25);}
  .char-card-img{width:44px;height:44px;border-radius:8px;background:rgba(124,58,237,0.08);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .char-card-img img{width:100%;height:100%;object-fit:cover;border-radius:7px;}
  .char-card-name{font-size:9px;color:var(--text-sub);text-align:center;line-height:1.3;word-break:keep-all;}
  .char-card-job{font-size:8px;padding:1px 5px;border-radius:6px;font-family:'Orbitron',sans-serif;}

  /* 선택된 캐릭터 바 */
  .sel-char-bar{display:none;align-items:center;gap:10px;background:rgba(124,58,237,0.08);border:1px solid rgba(124,58,237,0.2);border-radius:10px;padding:8px 14px;margin-top:12px;}
  .sel-char-bar.on{display:flex;}
  .sel-char-thumb{width:34px;height:34px;border-radius:7px;object-fit:cover;}
  .sel-char-name{font-size:13px;font-weight:700;}
  .sel-char-job-badge{font-size:10px;font-family:'Orbitron',sans-serif;padding:2px 8px;border-radius:10px;}
  .btn-reset{margin-left:auto;font-size:10px;color:var(--accent-pink);cursor:pointer;background:rgba(244,114,182,0.1);border:1px solid rgba(244,114,182,0.2);padding:4px 10px;border-radius:8px;}

  /* ── STEP2: 장비/무기 ── */
  .calc-columns{display:flex;gap:20px;}
  .equip-col{flex:1.1;}
  .weapon-col{flex:0.9;}
  .col-divider{width:1px;background:rgba(124,58,237,0.12);flex-shrink:0;}
  .col-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid rgba(124,58,237,0.1);}
  .col-header-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;}
  .col-header-title{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;}
  .col-header-sub{font-size:10px;color:var(--text-dim);margin-left:auto;}

  /* 장비 슬롯 */
  .slot-list{display:flex;flex-direction:column;gap:7px;}
  .slot-row{background:var(--bg-card2);border:1px solid rgba(124,58,237,0.1);border-radius:11px;overflow:hidden;transition:border-color 0.2s;}
  .slot-row.has-sel{border-color:rgba(124,58,237,0.3);}
  .slot-header{display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;user-select:none;}
  .slot-thumb{width:30px;height:30px;border-radius:7px;background:var(--bg-card);border:1px solid rgba(124,58,237,0.15);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;overflow:hidden;}
  .slot-thumb img{width:100%;height:100%;object-fit:cover;border-radius:6px;}
  .slot-part-label{font-size:9px;font-family:'Orbitron',sans-serif;color:var(--text-dim);width:34px;flex-shrink:0;}
  .slot-sel-name{font-size:11px;color:var(--text-main);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .slot-sel-grade{font-size:8px;padding:2px 6px;border-radius:7px;font-family:'Orbitron',sans-serif;flex-shrink:0;}
  .slot-clr{width:17px;height:17px;border-radius:50%;background:rgba(244,114,182,0.1);border:none;color:var(--accent-pink);font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .slot-arr{font-size:10px;color:var(--text-dim);transition:transform 0.2s;flex-shrink:0;}
  .slot-row.open .slot-arr{transform:rotate(180deg);}
  .slot-panel{display:none;padding:0 11px 11px;}
  .slot-row.open .slot-panel{display:block;}

  .items-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:9px;}
  .item-card{background:var(--bg-card);border:1px solid rgba(124,58,237,0.1);border-radius:8px;padding:6px 5px 5px;cursor:pointer;transition:all 0.16s;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .item-card:hover{border-color:rgba(124,58,237,0.38);transform:translateY(-1px);}
  .item-card.sel{border-color:var(--purple-2);background:rgba(124,58,237,0.1);}
  .item-thumb{width:34px;height:34px;border-radius:6px;background:rgba(124,58,237,0.07);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .item-thumb img{width:100%;height:100%;object-fit:cover;border-radius:5px;}
  .item-name{font-size:8px;color:var(--text-sub);text-align:center;line-height:1.3;word-break:keep-all;}
  .item-cat{font-size:7px;padding:1px 4px;border-radius:5px;font-family:'Orbitron',sans-serif;}
  .cat-c{background:rgba(148,163,184,0.12);color:#94a3b8;}
  .cat-j{background:rgba(251,191,36,0.1);color:var(--accent-gold);}
  .cat-p{background:rgba(244,114,182,0.1);color:var(--accent-pink);}
  .no-items{font-size:11px;color:var(--text-dim);text-align:center;padding:10px 0;grid-column:1/-1;}

  /* 등급 버튼 */
  .grade-wrap{margin-top:2px;}
  .grade-lbl{font-size:9px;color:var(--text-dim);margin-bottom:4px;font-family:'Orbitron',sans-serif;}
  .grade-btns{display:flex;flex-wrap:wrap;gap:4px;}
  .gbtn{padding:3px 7px;border-radius:6px;font-size:8px;font-family:'Orbitron',sans-serif;border:1px solid rgba(124,58,237,0.2);background:var(--bg-card);color:var(--text-dim);cursor:pointer;transition:all 0.14s;white-space:nowrap;}
  .gbtn:hover{border-color:rgba(124,58,237,0.4);color:var(--text-sub);}
  .g-일반{--gc:#94a3b8}.g-희귀{--gc:#60a5fa}.g-에픽{--gc:#a855f7}.g-전설{--gc:#fbbf24}.g-신화{--gc:#f97316}
  .g-슈프림{--gc:#f472b6}.g-얼티밋{--gc:#e11d48}.g-셀레스티얼{--gc:#22d3ee}.g-스텔라{--gc:#818cf8}.g-이모탈{--gc:#34d399}.g-디바인{--gc:#fde68a}
  .gbtn.on{color:white;border-color:transparent;background:var(--gc,var(--purple-2));box-shadow:0 0 7px color-mix(in srgb,var(--gc,var(--purple-2)) 40%,transparent);}

  /* 무기 슬롯 (장비 슬롯과 동일 구조, cyan 계열) */
  .wslot-row{background:var(--bg-card2);border:1px solid rgba(34,211,238,0.1);border-radius:11px;overflow:hidden;transition:border-color 0.2s;}
  .wslot-row.has-sel{border-color:rgba(34,211,238,0.3);}
  .wslot-header{display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;user-select:none;}
  .wslot-thumb{width:30px;height:30px;border-radius:7px;background:var(--bg-card);border:1px solid rgba(34,211,238,0.15);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;overflow:hidden;}
  .wslot-thumb img{width:100%;height:100%;object-fit:cover;border-radius:6px;}
  .wslot-part-label{font-size:9px;font-family:'Orbitron',sans-serif;color:var(--text-dim);width:38px;flex-shrink:0;}
  .wslot-sel-name{font-size:11px;color:var(--text-main);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wslot-sel-grade{font-size:8px;padding:2px 6px;border-radius:7px;font-family:'Orbitron',sans-serif;flex-shrink:0;}
  .wslot-clr{width:17px;height:17px;border-radius:50%;background:rgba(244,114,182,0.1);border:none;color:var(--accent-pink);font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .wslot-arr{font-size:10px;color:var(--text-dim);transition:transform 0.2s;flex-shrink:0;}
  .wslot-row.open .wslot-arr{transform:rotate(180deg);}
  .wslot-panel{display:none;padding:0 11px 11px;}
  .wslot-row.open .wslot-panel{display:block;}
  .witem-card{background:var(--bg-card);border:1px solid rgba(34,211,238,0.1);border-radius:8px;padding:6px 5px 5px;cursor:pointer;transition:all 0.16s;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .witem-card:hover{border-color:rgba(34,211,238,0.35);transform:translateY(-1px);}
  .witem-card.sel{border-color:var(--accent-cyan);background:rgba(34,211,238,0.06);}
  .witem-thumb{width:34px;height:28px;border-radius:6px;background:rgba(34,211,238,0.05);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .witem-thumb img{width:100%;height:100%;object-fit:cover;border-radius:5px;}

  /* 결과 */
  .result-section{animation:fadeUp 0.3s ease;margin-top:4px;}
  .result-title{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;margin-bottom:14px;}
  .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .result-card{background:var(--bg-card);border:1px solid rgba(124,58,237,0.15);border-radius:14px;overflow:hidden;}
  .rc-head{padding:11px 14px 8px;border-bottom:1px solid rgba(124,58,237,0.1);display:flex;align-items:center;gap:7px;}
  .rc-title{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;}
  .rc-cnt{font-size:10px;font-family:'Orbitron',sans-serif;margin-left:auto;}
  .rc-body{padding:10px 13px;display:flex;flex-direction:column;gap:6px;min-height:50px;}
  .si{display:flex;align-items:flex-start;gap:7px;padding:6px 8px;border-radius:7px;}
  .si.up{background:rgba(96,165,250,0.07);border:1px solid rgba(96,165,250,0.13);}
  .si.dn{background:rgba(248,113,113,0.07);border:1px solid rgba(248,113,113,0.13);}
  .si-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .up .si-dot{background:var(--stat-up);}.dn .si-dot{background:var(--stat-down);}
  .si-txt{font-size:12px;line-height:1.5;flex:1;}
  .up .si-txt{color:var(--stat-up);}.dn .si-txt{color:var(--stat-down);}
  .si-src{font-size:9px;color:var(--text-dim);font-family:'Orbitron',sans-serif;}
  .empty-r{text-align:center;padding:18px;color:var(--text-dim);font-size:11px;}

  /* 선택 요약 */
  .sel-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--bg-card2);border:1px solid rgba(124,58,237,0.14);border-radius:10px;padding:8px 13px;margin-bottom:16px;}
  .sel-chip{display:flex;align-items:center;gap:4px;padding:3px 7px;border-radius:7px;background:rgba(124,58,237,0.1);border:1px solid rgba(124,58,237,0.17);color:var(--text-sub);font-size:10px;}

  /* 로딩 */
  .loading-wrap{text-align:center;padding:60px;color:var(--text-dim);}
  .spinner{width:32px;height:32px;border:3px solid rgba(124,58,237,0.15);border-top-color:var(--purple-2);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">G</div>
  <nav class="sidebar-nav">
    <button class="nav-item" onclick="location.href='index.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg><span class="tooltip">홈</span></button>
    <button class="nav-item" onclick="location.href='character.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg><span class="tooltip">캐릭터</span></button>
    <button class="nav-item active" onclick="location.href='equipment.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg><span class="tooltip">장비</span></button>
    <button class="nav-item" onclick="location.href='battlepass.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span class="tooltip">배틀패스</span></button>
    <button class="nav-item" onclick="location.href='tournament.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 19h20M2 19l3-10 5 5 2-8 2 8 5-5 3 10"/><circle cx="12" cy="6" r="1" fill="currentColor"/></svg><span class="tooltip">친선대회</span></button>
    <button class="nav-item" onclick="location.href='activity.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg><span class="tooltip">활동점수</span></button>
    <button class="nav-item" onclick="location.href='shop.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg><span class="tooltip">상점</span></button>
    <button class="nav-item" onclick="location.href='event.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="10" width="18" height="11" rx="1"/><path d="M3 10h18V7a1 1 0 00-1-1H4a1 1 0 00-1 1v3z"/><path d="M12 6V21"/></svg><span class="tooltip">이벤트</span></button>
  </nav>
  <div class="sidebar-bottom">
    <button class="nav-item">⚙️<span class="tooltip">설정</span></button>
    <div class="avatar-sm">👤</div>
  </div>
</aside>

<!-- BOTTOM NAV -->

<main class="main-wrap">
  <div class="topbar">
    <div class="topbar-back" onclick="location.href='index.html'">←</div>
    <span style="font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900">장비</span>
    <div style="margin-left:auto">
      <button onclick="loadAll()" style="background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.25);color:var(--purple-3);padding:6px 14px;border-radius:8px;font-size:11px;cursor:pointer;font-family:'Orbitron',sans-serif;">↻ 새로고침</button>
    </div>
  </div>

  <div id="loading-state" class="loading-wrap"><div class="spinner"></div>데이터 불러오는 중...</div>

  <div id="content-wrap" style="display:none">

    <div class="page-header">
      <div class="page-title">장비 / 무기 <span>조합 계산기</span></div>
      <div class="page-sub">① 캐릭터 선택 → ② 장비·무기 선택 및 등급 설정 → ③ 합산 능력치 확인</div>
    </div>

    <!-- STEP 1: 캐릭터 선택 -->
    <div class="step-card">
      <div class="step-header">
        <div class="step-num" id="step1-num">1</div>
        <span class="step-title">캐릭터 선택</span>
        <span class="step-badge" id="char-count-badge" style="margin-left:auto"></span>
      </div>
      <div class="char-grid" id="char-grid"></div>
      <div class="sel-char-bar" id="sel-char-bar">
        <span id="sel-char-thumb-wrap" style="font-size:22px">🎮</span>
        <span class="sel-char-name" id="sel-char-name"></span>
        <span class="sel-char-job-badge" id="sel-char-job"></span>
        <button class="btn-reset" onclick="resetChar()">✕ 변경</button>
      </div>
    </div>

    <!-- STEP 2: 장비 + 무기 -->
    <div class="step-card" id="step2-card" style="display:none">
      <div class="step-header" style="margin-bottom:16px">
        <div class="step-num" id="step2-num">2</div>
        <span class="step-title">장비 · 무기 선택</span>
        <button onclick="clearAll()" style="margin-left:auto;background:rgba(244,114,182,0.1);border:1px solid rgba(244,114,182,0.2);color:var(--accent-pink);padding:4px 10px;border-radius:8px;font-size:10px;cursor:pointer;">전체 초기화</button>
      </div>
      <div class="calc-columns">
        <!-- 장비 -->
        <div class="equip-col">
          <div class="col-header">
            <div class="col-header-icon" style="background:rgba(124,58,237,0.15)">🛡️</div>
            <span class="col-header-title">장비</span>
            <span class="col-header-sub" id="equip-cnt">0 / 6</span>
          </div>
          <div class="slot-list" id="slot-list"></div>
        </div>
        <div class="col-divider"></div>
        <!-- 무기 -->
        <div class="weapon-col">
          <div class="col-header">
            <div class="col-header-icon" style="background:rgba(34,211,238,0.1)">🔫</div>
            <span class="col-header-title">무기</span>
            <span class="col-header-sub" id="weapon-cnt">0 / 4</span>
          </div>
          <div id="wslot-list" style="display:flex;flex-direction:column;gap:7px;"></div>
        </div>
      </div>
    </div>

    <!-- 선택 요약 -->
    <div class="sel-bar" id="sel-bar" style="display:none">
      <span style="font-family:'Orbitron',sans-serif;font-size:10px;color:var(--text-dim)">선택:</span>
      <span id="sel-summary"></span>
    </div>

    <!-- STEP 3: 결과 -->
    <div class="result-section" id="result-sec" style="display:none">
      <div class="result-title">⚡ 합산 능력치</div>
      <div class="result-grid">
        <div class="result-card">
          <div class="rc-head"><span>📈</span><span class="rc-title" style="color:var(--stat-up)">능력치 증가</span><span class="rc-cnt" id="up-cnt" style="color:var(--stat-up)"></span></div>
          <div class="rc-body" id="up-list"><div class="empty-r">증가 능력치 없음</div></div>
        </div>
        <div class="result-card">
          <div class="rc-head"><span>📉</span><span class="rc-title" style="color:var(--stat-down)">능력치 감소</span><span class="rc-cnt" id="dn-cnt" style="color:var(--stat-down)"></span></div>
          <div class="rc-body" id="dn-list"><div class="empty-r">감소 능력치 없음</div></div>
        </div>
      </div>
    </div>

  </div>
</main>

<script>
  const CSV_CHAR   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmibDA5_-djeNETtuGqt5I3wtRqGs0oJjEQ8KZOW6qkQpINtLtEMIDNlU4N2IwipF7peIV6qWZKx5J/pub?gid=599911059&single=true&output=csv';
  const CSV_EQUIP  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmibDA5_-djeNETtuGqt5I3wtRqGs0oJjEQ8KZOW6qkQpINtLtEMIDNlU4N2IwipF7peIV6qWZKx5J/pub?gid=1255169524&single=true&output=csv';
  const CSV_WEAPON = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmibDA5_-djeNETtuGqt5I3wtRqGs0oJjEQ8KZOW6qkQpINtLtEMIDNlU4N2IwipF7peIV6qWZKx5J/pub?gid=2117031065&single=true&output=csv';

  const EQUIP_SLOTS  = ['모자','몸통','장갑','신발','반지','장신구'];
  const SLOT_ICONS   = {'모자':'🪖','몸통':'🦺','장갑':'🧤','신발':'👟','반지':'💍','장신구':'📿'};
  const WEAPON_SLOTS = ['총구','조준기','스프링','그립'];
  const WEAPON_ICONS = {'총구':'🔧','조준기':'🔭','스프링':'⚙️','그립':'✊'};
  const EQ_GRADES    = ['일반','희귀','에픽','전설','신화','슈프림','얼티밋','셀레스티얼','스텔라','이모탈','디바인'];
  const WP_GRADES    = ['일반','희귀','에픽','전설','신화'];
  const GC = {'일반':'#94a3b8','희귀':'#60a5fa','에픽':'#a855f7','전설':'#fbbf24','신화':'#f97316','슈프림':'#f472b6','얼티밋':'#e11d48','셀레스티얼':'#22d3ee','스텔라':'#818cf8','이모탈':'#34d399','디바인':'#fde68a'};
  const JC = {'트루퍼':'#3b82f6','집행자':'#ef4444','정찰병':'#eab308','탱커':'#a855f7','스나이퍼':'#22c55e'};
  const CAT_CLS   = {'공통장비':'c','직업장비':'j','개인장비':'p'};
  const CAT_LABEL = {'c':'공통','j':'직업','p':'개인'};

  let charData=[], equipData=[], weaponData=[];
  let selChar=null;
  const esSel={}, wsSel={};   // 장비슬롯 선택, 무기슬롯 선택

  function parseCSV(txt){
    return txt.trim().split('\n').slice(1).map(line=>{
      const cols=[];let cur='',inQ=false;
      for(let c of line){if(c==='"'){inQ=!inQ;continue;}if(c===','&&!inQ){cols.push(cur.trim());cur='';}else cur+=c;}
      cols.push(cur.trim());return cols;
    }).filter(r=>r[0]);
  }

  async function loadAll(){
    document.getElementById('loading-state').style.display='block';
    document.getElementById('content-wrap').style.display='none';
    try{
      const [rc,re,rw]=await Promise.all([
        fetch(CSV_CHAR +'&t='+Date.now(),{cache:'no-store'}),
        fetch(CSV_EQUIP+'&t='+Date.now(),{cache:'no-store'}),
        fetch(CSV_WEAPON+'&t='+Date.now(),{cache:'no-store'}),
      ]);
      const cR=parseCSV(await rc.text());
      const eR=parseCSV(await re.text());
      const wR=parseCSV(await rw.text());

      // 캐릭터: A=이름 B=직업 C=이미지
      charData=cR.map(r=>({name:r[0]||'',job:r[1]||'',img:r[2]||''})).filter(c=>c.name);

      // 장비: A=이름 B=부위 C=분류 D=대상 E=이미지 F~=등급쌍
      equipData=eR.map(r=>{
        const gr={};
        EQ_GRADES.forEach((g,i)=>{const e=r[5+i*2]||'',t=r[6+i*2]||'';if(e)gr[g]={eff:e,type:t};});
        return{name:r[0]||'',slot:r[1]||'',cat:r[2]||'',target:r[3]||'',img:r[4]||'',gr};
      }).filter(e=>e.name);

      // 무기: A=이름 B=부위 C=대상 D=이미지 E~=등급쌍
      weaponData=wR.map(r=>{
        const gr={};
        WP_GRADES.forEach((g,i)=>{const e=r[4+i*2]||'',t=r[5+i*2]||'';if(e)gr[g]={eff:e,type:t};});
        return{name:r[0]||'',slot:r[1]||'',target:r[2]||'',img:r[3]||'',gr};
      }).filter(w=>w.name);

      document.getElementById('loading-state').style.display='none';
      document.getElementById('content-wrap').style.display='block';
      renderCharGrid();
    }catch(e){
      document.getElementById('loading-state').innerHTML=`<div style="color:var(--accent-pink);font-size:13px">⚠️ 불러오기 실패<br><small style="color:var(--text-dim)">${e.message}</small><br><br><button onclick="loadAll()" style="margin-top:8px;background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.3);color:var(--purple-3);padding:8px 20px;border-radius:8px;cursor:pointer;">↻ 다시 시도</button></div>`;
    }
  }

  /* ── 캐릭터 ── */
  function renderCharGrid(){
    const g=document.getElementById('char-grid');
    document.getElementById('char-count-badge').textContent=charData.length+'명';
    g.innerHTML=charData.map(c=>{
      const jc=JC[c.job]||'#9d5ff5';
      const img=c.img?`<img src="${c.img}" onerror="this.outerHTML='🎮'">`:'🎮';
      return `<div class="char-card" id="cc-${encodeURIComponent(c.name)}" onclick="selectChar('${c.name.replace(/'/g,"\\'")}')">
        <div class="char-card-img">${img}</div>
        <div class="char-card-name">${c.name}</div>
        <span class="char-card-job" style="background:${jc}18;color:${jc};border:1px solid ${jc}33">${c.job}</span>
      </div>`;
    }).join('');
  }

  function selectChar(name){
    const c=charData.find(x=>x.name===name); if(!c) return;
    selChar=c;
    document.querySelectorAll('.char-card').forEach(el=>el.classList.remove('selected'));
    document.getElementById('cc-'+encodeURIComponent(name))?.classList.add('selected');

    const bar=document.getElementById('sel-char-bar');
    bar.classList.add('on');
    document.getElementById('sel-char-name').textContent=name;
    const jc=JC[c.job]||'#9d5ff5';
    const jobEl=document.getElementById('sel-char-job');
    jobEl.textContent=c.job;
    jobEl.style.cssText=`background:${jc}18;color:${jc};border:1px solid ${jc}33;`;
    const tw=document.getElementById('sel-char-thumb-wrap');
    tw.innerHTML=c.img?`<img class="sel-char-thumb" src="${c.img}" onerror="this.outerHTML='🎮'">`: '🎮';

    document.getElementById('step1-num').classList.add('done');
    document.getElementById('step1-num').textContent='✓';

    // 기존 선택 초기화
    Object.keys(esSel).forEach(k=>delete esSel[k]);
    Object.keys(wsSel).forEach(k=>delete wsSel[k]);

    document.getElementById('step2-card').style.display='block';
    renderEquipSlots();
    renderWeaponSlots();
    updateResult();
    updateCounts();
  }

  function resetChar(){
    selChar=null;
    document.querySelectorAll('.char-card').forEach(el=>el.classList.remove('selected'));
    document.getElementById('sel-char-bar').classList.remove('on');
    document.getElementById('step1-num').classList.remove('done');
    document.getElementById('step1-num').textContent='1';
    document.getElementById('step2-card').style.display='none';
    document.getElementById('result-sec').style.display='none';
    document.getElementById('sel-bar').style.display='none';
  }

  /* ── 장비 슬롯 ── */
  function getEquipItems(slot){
    if(!selChar) return [];
    return equipData.filter(e=>{
      if(e.slot!==slot) return false;
      if(e.cat==='공통장비') return true;
      if(e.cat==='직업장비') return e.target===selChar.job;
      if(e.cat==='개인장비') return e.target===selChar.name;
      return false;
    });
  }

  function renderEquipSlots(){
    document.getElementById('slot-list').innerHTML=EQUIP_SLOTS.map(slot=>{
      const items=getEquipItems(slot);
      const itemsHtml=items.length===0
        ?`<div class="no-items">${slot} 장비 없음</div>`
        :items.map(it=>{
          const cl=CAT_CLS[it.cat]||'c';
          const img=it.img?`<img src="${it.img}" onerror="this.outerHTML='🛡️'">`:'🛡️';
          return `<div class="item-card" id="ec-${slot}-${encodeURIComponent(it.name)}" onclick="selectEquip('${slot}','${it.name.replace(/'/g,"\\'")}')">
            <div class="item-thumb">${img}</div>
            <div class="item-name">${it.name}</div>
            <span class="item-cat cat-${cl}">${CAT_LABEL[cl]}</span>
          </div>`;
        }).join('');
      return `<div class="slot-row" id="slot-${slot}">
        <div class="slot-header" onclick="toggleSlot('${slot}')">
          <div class="slot-thumb" id="sthumb-${slot}">${SLOT_ICONS[slot]||'📦'}</div>
          <span class="slot-part-label">${slot}</span>
          <span class="slot-sel-name" id="sname-${slot}" style="color:var(--text-dim)">선택 안 됨</span>
          <span class="slot-sel-grade" id="sgrade-${slot}"></span>
          <button class="slot-clr" onclick="clearEquipSlot(event,'${slot}')">✕</button>
          <span class="slot-arr">▾</span>
        </div>
        <div class="slot-panel">
          <div class="items-grid" id="sg-${slot}">${itemsHtml}</div>
          <div class="grade-wrap" id="sgw-${slot}" style="display:none">
            <div class="grade-lbl">등급 선택</div>
            <div class="grade-btns" id="sgb-${slot}"></div>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function toggleSlot(slot){
    const row=document.getElementById('slot-'+slot);
    const isOpen=row.classList.contains('open');
    EQUIP_SLOTS.forEach(s=>document.getElementById('slot-'+s)?.classList.remove('open'));
    if(!isOpen) row.classList.add('open');
  }

  function selectEquip(slot,name){
    const it=equipData.find(e=>e.slot===slot&&e.name===name); if(!it) return;
    document.querySelectorAll(`#sg-${slot} .item-card`).forEach(el=>el.classList.remove('sel'));
    document.getElementById(`ec-${slot}-${encodeURIComponent(name)}`)?.classList.add('sel');
    esSel[slot]={item:it,grade:null};
    const gw=document.getElementById(`sgw-${slot}`);
    const gb=document.getElementById(`sgb-${slot}`);
    gw.style.display='block';
    const avail=EQ_GRADES.filter(g=>it.gr[g]);
    gb.innerHTML=avail.map(g=>`<button class="gbtn g-${g}" onclick="selectEquipGrade('${slot}','${g}')">${g}</button>`).join('');
    document.getElementById(`sname-${slot}`).textContent=name;
    document.getElementById(`sname-${slot}`).style.color='var(--text-main)';
    if(it.img) document.getElementById(`sthumb-${slot}`).innerHTML=`<img src="${it.img}" onerror="this.outerHTML='${SLOT_ICONS[slot]||'📦'}'">`;
    updateCounts(); updateResult(); updateSummary();
  }

  function selectEquipGrade(slot,grade){
    if(!esSel[slot]) return;
    esSel[slot].grade=grade;
    document.querySelectorAll(`#sgb-${slot} .gbtn`).forEach(b=>b.classList.toggle('on',b.textContent===grade));
    const c=GC[grade]||'#9d8ec4';
    const el=document.getElementById(`sgrade-${slot}`);
    el.textContent=grade;
    el.style.cssText=`background:${c}22;color:${c};border:1px solid ${c}44;padding:2px 6px;border-radius:7px;font-family:'Orbitron',sans-serif;font-size:8px;`;
    document.getElementById('slot-'+slot).classList.remove('open');
    document.getElementById('slot-'+slot).classList.add('has-sel');
    updateCounts(); updateResult(); updateSummary();
  }

  function clearEquipSlot(e,slot){
    e.stopPropagation();
    delete esSel[slot];
    document.getElementById(`sname-${slot}`).textContent='선택 안 됨';
    document.getElementById(`sname-${slot}`).style.color='var(--text-dim)';
    document.getElementById(`sgrade-${slot}`).textContent='';
    document.getElementById(`sgrade-${slot}`).style.cssText='';
    document.getElementById(`sthumb-${slot}`).innerHTML=SLOT_ICONS[slot]||'📦';
    document.getElementById(`sgw-${slot}`).style.display='none';
    document.querySelectorAll(`#sg-${slot} .item-card`).forEach(el=>el.classList.remove('sel'));
    document.getElementById('slot-'+slot).classList.remove('open','has-sel');
    updateCounts(); updateResult(); updateSummary();
  }

  /* ── 무기 슬롯 ── */
  function getWeaponItems(wslot){
    if(!selChar) return [];
    return weaponData.filter(w=>w.slot===wslot && w.target===selChar.name);
  }

  function renderWeaponSlots(){
    document.getElementById('wslot-list').innerHTML=WEAPON_SLOTS.map(wslot=>{
      const items=getWeaponItems(wslot);
      const itemsHtml=items.length===0
        ?`<div class="no-items">${wslot} 무기 없음</div>`
        :items.map(it=>{
          const img=it.img?`<img src="${it.img}" onerror="this.outerHTML='🔫'">`:'🔫';
          return `<div class="witem-card" id="wc-${wslot}-${encodeURIComponent(it.name)}" onclick="selectWeapon('${wslot}','${it.name.replace(/'/g,"\\'")}')">
            <div class="witem-thumb">${img}</div>
            <div class="item-name">${it.name}</div>
          </div>`;
        }).join('');
      return `<div class="wslot-row" id="wslot-${wslot}">
        <div class="wslot-header" onclick="toggleWslot('${wslot}')">
          <div class="wslot-thumb" id="wthumb-${wslot}">${WEAPON_ICONS[wslot]||'🔩'}</div>
          <span class="wslot-part-label">${wslot}</span>
          <span class="wslot-sel-name" id="wname-${wslot}" style="color:var(--text-dim)">선택 안 됨</span>
          <span class="wslot-sel-grade" id="wgrade-${wslot}"></span>
          <button class="wslot-clr" onclick="clearWeaponSlot(event,'${wslot}')">✕</button>
          <span class="wslot-arr">▾</span>
        </div>
        <div class="wslot-panel" id="wpanel-${wslot}">
          <div class="items-grid" id="wg-${wslot}">${itemsHtml}</div>
          <div class="grade-wrap" id="wgw-${wslot}" style="display:none">
            <div class="grade-lbl">등급 선택</div>
            <div class="grade-btns" id="wgb-${wslot}"></div>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function toggleWslot(wslot){
    const row=document.getElementById('wslot-'+wslot);
    const isOpen=row.classList.contains('open');
    WEAPON_SLOTS.forEach(s=>document.getElementById('wslot-'+s)?.classList.remove('open'));
    if(!isOpen) row.classList.add('open');
  }

  function selectWeapon(wslot,name){
    const it=weaponData.find(w=>w.slot===wslot&&w.name===name); if(!it) return;
    document.querySelectorAll(`#wg-${wslot} .witem-card`).forEach(el=>el.classList.remove('sel'));
    document.getElementById(`wc-${wslot}-${encodeURIComponent(name)}`)?.classList.add('sel');
    wsSel[wslot]={item:it,grade:null};
    const gw=document.getElementById(`wgw-${wslot}`);
    const gb=document.getElementById(`wgb-${wslot}`);
    gw.style.display='block';
    const avail=WP_GRADES.filter(g=>it.gr[g]);
    gb.innerHTML=avail.map(g=>`<button class="gbtn g-${g}" onclick="selectWeaponGrade('${wslot}','${g}')">${g}</button>`).join('');
    document.getElementById(`wname-${wslot}`).textContent=name;
    document.getElementById(`wname-${wslot}`).style.color='var(--text-main)';
    if(it.img) document.getElementById(`wthumb-${wslot}`).innerHTML=`<img src="${it.img}" onerror="this.outerHTML='${WEAPON_ICONS[wslot]||'🔩'}'">`;
    updateCounts(); updateResult(); updateSummary();
  }

  function selectWeaponGrade(wslot,grade){
    if(!wsSel[wslot]) return;
    wsSel[wslot].grade=grade;
    document.querySelectorAll(`#wgb-${wslot} .gbtn`).forEach(b=>b.classList.toggle('on',b.textContent===grade));
    const c=GC[grade]||'#9d8ec4';
    const el=document.getElementById(`wgrade-${wslot}`);
    el.textContent=grade;
    el.style.cssText=`background:${c}22;color:${c};border:1px solid ${c}44;padding:2px 6px;border-radius:7px;font-family:'Orbitron',sans-serif;font-size:8px;`;
    document.getElementById('wslot-'+wslot).classList.remove('open');
    document.getElementById('wslot-'+wslot).classList.add('has-sel');
    updateCounts(); updateResult(); updateSummary();
  }

  function clearWeaponSlot(e,wslot){
    e.stopPropagation();
    delete wsSel[wslot];
    document.getElementById(`wname-${wslot}`).textContent='선택 안 됨';
    document.getElementById(`wname-${wslot}`).style.color='var(--text-dim)';
    document.getElementById(`wgrade-${wslot}`).textContent='';
    document.getElementById(`wgrade-${wslot}`).style.cssText='';
    document.getElementById(`wthumb-${wslot}`).innerHTML=WEAPON_ICONS[wslot]||'🔩';
    document.getElementById(`wgw-${wslot}`).style.display='none';
    document.querySelectorAll(`#wg-${wslot} .witem-card`).forEach(el=>el.classList.remove('sel'));
    document.getElementById('wslot-'+wslot).classList.remove('open','has-sel');
    updateCounts(); updateResult(); updateSummary();
  }

  function clearAll(){
    EQUIP_SLOTS.forEach(s=>clearEquipSlot({stopPropagation:()=>{}},s));
    WEAPON_SLOTS.forEach(s=>clearWeaponSlot({stopPropagation:()=>{}},s));
  }

  /* ── 카운트 ── */
  function updateCounts(){
    document.getElementById('equip-cnt').textContent=`${EQUIP_SLOTS.filter(s=>esSel[s]?.grade).length} / 6`;
    document.getElementById('weapon-cnt').textContent=`${WEAPON_SLOTS.filter(s=>wsSel[s]?.grade).length} / 4`;
  }

  /* ── 결과 ── */
  function collectFx(entry,up,dn){
    if(entry.type==='감소'){dn.push(entry);return;}
    if(entry.type==='혼합'){
      entry.text.split(',').map(s=>s.trim()).filter(Boolean).forEach(p=>{
        const isD=p.includes('-')&&!p.startsWith('+');
        (isD?dn:up).push({text:p,source:entry.source});
      });return;
    }
    up.push(entry);
  }

  function updateResult(){
    const up=[],dn=[];
    EQUIP_SLOTS.forEach(s=>{
      const sel=esSel[s]; if(!sel?.grade||!sel.item) return;
      const g=sel.item.gr[sel.grade]; if(!g?.eff) return;
      collectFx({text:g.eff,source:`${sel.item.name}(${sel.grade})`,type:g.type},up,dn);
    });
    WEAPON_SLOTS.forEach(s=>{
      const sel=wsSel[s]; if(!sel?.grade||!sel.item) return;
      const g=sel.item.gr[sel.grade]; if(!g?.eff) return;
      collectFx({text:g.eff,source:`${sel.item.name}(${sel.grade})`,type:g.type},up,dn);
    });

    const hasAny=up.length>0||dn.length>0;
    document.getElementById('result-sec').style.display=hasAny?'block':'none';
    if(!hasAny) return;

    document.getElementById('up-cnt').textContent=up.length+'개';
    document.getElementById('up-list').innerHTML=up.length
      ?up.map(it=>`<div class="si up"><div class="si-dot"></div><div><div class="si-txt">${it.text}</div><div class="si-src">${it.source}</div></div></div>`).join('')
      :'<div class="empty-r">증가 능력치 없음</div>';

    document.getElementById('dn-cnt').textContent=dn.length+'개';
    document.getElementById('dn-list').innerHTML=dn.length
      ?dn.map(it=>`<div class="si dn"><div class="si-dot"></div><div><div class="si-txt">${it.text}</div><div class="si-src">${it.source}</div></div></div>`).join('')
      :'<div class="empty-r">감소 능력치 없음</div>';
  }

  /* ── 요약 바 ── */
  function updateSummary(){
    const chips=[];
    EQUIP_SLOTS.forEach(s=>{
      const sel=esSel[s]; if(!sel?.item||!sel?.grade) return;
      const c=GC[sel.grade]||'#9d8ec4';
      chips.push(`<span class="sel-chip">${SLOT_ICONS[s]} ${sel.item.name} <span style="color:${c};font-family:'Orbitron',sans-serif;font-size:8px">${sel.grade}</span></span>`);
    });
    WEAPON_SLOTS.forEach(s=>{
      const sel=wsSel[s]; if(!sel?.item||!sel?.grade) return;
      const c=GC[sel.grade]||'#9d8ec4';
      chips.push(`<span class="sel-chip">${WEAPON_ICONS[s]} ${sel.item.name} <span style="color:${c};font-family:'Orbitron',sans-serif;font-size:8px">${sel.grade}</span></span>`);
    });
    const bar=document.getElementById('sel-bar');
    if(chips.length){bar.style.display='flex';document.getElementById('sel-summary').innerHTML=chips.join('');}
    else bar.style.display='none';
  }

  window.addEventListener('DOMContentLoaded',loadAll);
</script>
</body>
</html>

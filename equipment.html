<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장비 — GGO PLAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0612;
    --bg-card: #130d24;
    --bg-card2: #1a1035;
    --purple-1: #7c3aed;
    --purple-2: #9d5ff5;
    --purple-3: #c084fc;
    --purple-4: #e9d5ff;
    --accent-pink: #f472b6;
    --accent-cyan: #22d3ee;
    --accent-gold: #fbbf24;
    --text-main: #f0e8ff;
    --text-sub: #9d8ec4;
    --text-dim: #5c4e7a;
    --sidebar-w: 72px;
    --bottombar-h: 64px;
    --stat-up: #60a5fa;
    --stat-down: #f87171;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg-deep); color:var(--text-main); font-family:'Noto Sans KR',sans-serif; min-height:100vh; overflow-x:hidden; }
  body::before {
    content:''; position:fixed; inset:0;
    background:
      radial-gradient(ellipse 60% 40% at 15% 20%, rgba(124,58,237,0.18) 0%, transparent 70%),
      radial-gradient(ellipse 50% 50% at 85% 75%, rgba(157,95,245,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 30% at 50% 50%, rgba(34,211,238,0.05) 0%, transparent 70%);
    pointer-events:none; z-index:0;
  }

  /* ── SIDEBAR ── */
  .sidebar { position:fixed; left:0; top:0; bottom:0; width:var(--sidebar-w); background:rgba(19,13,36,0.95); border-right:1px solid rgba(124,58,237,0.2); display:flex; flex-direction:column; align-items:center; padding:20px 0; z-index:100; backdrop-filter:blur(20px); }
  .sidebar-logo { width:42px; height:42px; background:linear-gradient(135deg,var(--purple-1),var(--purple-3)); border-radius:12px; display:flex; align-items:center; justify-content:center; font-family:'Orbitron',sans-serif; font-weight:900; font-size:16px; color:white; margin-bottom:32px; box-shadow:0 0 20px rgba(124,58,237,0.5); flex-shrink:0; }
  .sidebar-nav { display:flex; flex-direction:column; gap:8px; flex:1; }
  .nav-item { width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s; position:relative; color:var(--text-dim); font-size:22px; border:none; background:transparent; }
  .nav-item:hover, .nav-item.active { background:rgba(124,58,237,0.2); color:var(--purple-3); box-shadow:0 0 20px rgba(124,58,237,0.3); }
  .nav-item.active::before { content:''; position:absolute; left:-12px; width:3px; height:24px; background:var(--purple-2); border-radius:0 3px 3px 0; }
  .nav-item .tooltip { position:absolute; left:60px; background:rgba(19,13,36,0.95); color:var(--text-main); font-size:12px; padding:6px 10px; border-radius:8px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity 0.15s; z-index:200; border:1px solid rgba(124,58,237,0.2); }
  .nav-item:hover .tooltip { opacity:1; }
  .sidebar-bottom { margin-top:auto; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .avatar-sm { width:36px; height:36px; border-radius:50%; background:rgba(124,58,237,0.2); border:1px solid rgba(124,58,237,0.3); display:flex; align-items:center; justify-content:center; font-size:18px; }

  /* ── BOTTOM NAV ── */
  .bottom-nav { display:none; position:fixed; bottom:0; left:0; right:0; height:var(--bottombar-h); background:rgba(19,13,36,0.97); border-top:1px solid rgba(124,58,237,0.2); z-index:100; backdrop-filter:blur(20px); justify-content:space-around; align-items:center; padding:0 8px; }
  .bottom-nav-item { display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-dim); font-size:10px; cursor:pointer; padding:6px 12px; border-radius:10px; transition:all 0.2s; flex:1; }
  .bottom-nav-item .icon { font-size:20px; }
  .bottom-nav-item.active { color:var(--purple-3); }

  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  @media (max-width:640px) {
    .sidebar { display:none; }
    .bottom-nav { display:flex; }
    .main-wrap { margin-left:0 !important; padding-bottom:calc(var(--bottombar-h)+20px) !important; }
    .calc-columns { flex-direction:column !important; }
    .equip-col, .weapon-col { width:100% !important; }
    .result-grid { grid-template-columns:1fr !important; }
    .slot-items-grid { grid-template-columns:repeat(3,1fr) !important; }
    .page-title { font-size:18px !important; }
  }

  /* ── MAIN ── */
  .main-wrap { margin-left:var(--sidebar-w); padding:28px 28px 48px; position:relative; z-index:1; min-height:100vh; }

  /* ── TOPBAR ── */
  .topbar { display:flex; align-items:center; gap:12px; margin-bottom:32px; }
  .topbar-back { width:36px; height:36px; border-radius:10px; background:rgba(124,58,237,0.15); border:1px solid rgba(124,58,237,0.25); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--purple-3); font-size:18px; transition:all 0.2s; }
  .topbar-back:hover { background:rgba(124,58,237,0.3); }

  /* ── 페이지 타이틀 ── */
  .page-header { text-align:center; margin-bottom:36px; }
  .page-title { font-family:'Orbitron',sans-serif; font-size:24px; font-weight:900; color:var(--text-main); letter-spacing:1px; }
  .page-title span { color:var(--purple-3); }
  .page-sub { font-size:12px; color:var(--text-dim); margin-top:8px; }

  /* ── 계산기 레이아웃 ── */
  .calc-columns { display:flex; gap:20px; margin-bottom:28px; }
  .equip-col { flex:1.2; }
  .weapon-col { flex:0.8; }

  .col-header {
    display:flex; align-items:center; gap:8px; margin-bottom:14px;
    padding-bottom:10px; border-bottom:1px solid rgba(124,58,237,0.15);
  }
  .col-header-icon { width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; }
  .col-header-title { font-family:'Orbitron',sans-serif; font-size:13px; font-weight:700; color:var(--text-main); }
  .col-header-count { font-size:10px; color:var(--text-dim); font-family:'Orbitron',sans-serif; }

  /* ── 장비 슬롯 ── */
  .slot-list { display:flex; flex-direction:column; gap:10px; }
  .slot-row { background:var(--bg-card); border:1px solid rgba(124,58,237,0.12); border-radius:14px; overflow:hidden; transition:border-color 0.2s; }
  .slot-row.has-selection { border-color:rgba(124,58,237,0.35); }

  .slot-header { display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer; user-select:none; }
  .slot-icon { width:36px; height:36px; border-radius:8px; background:var(--bg-card2); border:1px solid rgba(124,58,237,0.2); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; overflow:hidden; }
  .slot-icon img { width:100%; height:100%; object-fit:cover; border-radius:7px; }
  .slot-label { font-size:11px; font-family:'Orbitron',sans-serif; color:var(--text-dim); width:44px; flex-shrink:0; }
  .slot-selected-name { font-size:12px; color:var(--text-main); font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .slot-selected-grade { font-size:10px; padding:2px 7px; border-radius:10px; font-family:'Orbitron',sans-serif; flex-shrink:0; }
  .slot-arrow { font-size:12px; color:var(--text-dim); transition:transform 0.2s; flex-shrink:0; }
  .slot-row.open .slot-arrow { transform:rotate(180deg); }
  .slot-clear { width:20px; height:20px; border-radius:50%; background:rgba(244,114,182,0.15); border:none; color:var(--accent-pink); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  .slot-panel { display:none; padding:0 14px 14px; }
  .slot-row.open .slot-panel { display:block; }

  /* 장비 아이템 그리드 */
  .slot-items-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
  .slot-item { background:var(--bg-card2); border:1px solid rgba(124,58,237,0.12); border-radius:10px; padding:8px 6px 6px; cursor:pointer; transition:all 0.18s; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .slot-item:hover { border-color:rgba(124,58,237,0.4); transform:translateY(-2px); }
  .slot-item.selected { border-color:var(--purple-2); background:rgba(124,58,237,0.12); box-shadow:0 0 10px rgba(124,58,237,0.2); }
  .slot-item-img { width:40px; height:40px; border-radius:8px; background:rgba(124,58,237,0.08); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .slot-item-img img { width:100%; height:100%; object-fit:cover; border-radius:7px; }
  .slot-item-name { font-size:9px; color:var(--text-sub); text-align:center; line-height:1.3; word-break:keep-all; }
  .slot-item-cat { font-size:8px; padding:1px 5px; border-radius:6px; font-family:'Orbitron',sans-serif; }
  .cat-common { background:rgba(148,163,184,0.15); color:#94a3b8; }
  .cat-job    { background:rgba(251,191,36,0.12); color:var(--accent-gold); }
  .cat-personal { background:rgba(244,114,182,0.12); color:var(--accent-pink); }

  /* 등급 선택 */
  .grade-label { font-size:10px; color:var(--text-dim); margin-bottom:6px; font-family:'Orbitron',sans-serif; }
  .grade-buttons { display:flex; flex-wrap:wrap; gap:5px; }
  .grade-btn {
    padding:4px 9px; border-radius:8px; font-size:9px; font-family:'Orbitron',sans-serif;
    border:1px solid rgba(124,58,237,0.2); background:var(--bg-card2);
    color:var(--text-dim); cursor:pointer; transition:all 0.15s; white-space:nowrap;
  }
  .grade-btn:hover { border-color:rgba(124,58,237,0.4); color:var(--text-sub); }
  .grade-btn.selected { color:white; border-color:transparent; }

  /* 등급별 색상 */
  .g-일반      { --gc:#94a3b8; }
  .g-희귀      { --gc:#60a5fa; }
  .g-에픽      { --gc:#a855f7; }
  .g-전설      { --gc:#fbbf24; }
  .g-신화      { --gc:#f97316; }
  .g-슈프림    { --gc:#f472b6; }
  .g-얼티밋   { --gc:#e11d48; }
  .g-셀레스티얼 { --gc:#22d3ee; }
  .g-스텔라    { --gc:#818cf8; }
  .g-이모탈    { --gc:#34d399; }
  .g-디바인    { --gc:#fde68a; }
  .grade-btn.selected { background:var(--gc,var(--purple-2)); box-shadow:0 0 8px color-mix(in srgb,var(--gc,var(--purple-2)) 50%,transparent); }

  /* ── 무기 슬롯 (단일) ── */
  .weapon-block { background:var(--bg-card); border:1px solid rgba(124,58,237,0.12); border-radius:14px; overflow:hidden; }
  .weapon-items-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:14px; }
  .weapon-item { background:var(--bg-card2); border:1px solid rgba(124,58,237,0.12); border-radius:10px; padding:10px 8px 8px; cursor:pointer; transition:all 0.18s; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .weapon-item:hover { border-color:rgba(124,58,237,0.4); transform:translateY(-2px); }
  .weapon-item.selected { border-color:var(--accent-cyan); background:rgba(34,211,238,0.06); box-shadow:0 0 10px rgba(34,211,238,0.15); }
  .weapon-item-img { width:52px; height:38px; border-radius:8px; background:rgba(124,58,237,0.08); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .weapon-item-img img { width:100%; height:100%; object-fit:cover; border-radius:7px; }
  .weapon-item-name { font-size:10px; color:var(--text-sub); text-align:center; line-height:1.3; }

  .weapon-grade-wrap { padding:0 14px 14px; }

  /* ── 결과 패널 ── */
  .result-section { animation:fadeUp 0.3s ease; }
  .result-header { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .result-title { font-family:'Orbitron',sans-serif; font-size:14px; font-weight:700; color:var(--text-main); }
  .result-summary { display:flex; gap:8px; flex-wrap:wrap; margin-left:auto; }
  .result-chip { font-size:10px; padding:3px 10px; border-radius:20px; font-family:'Orbitron',sans-serif; }

  .result-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .result-card { background:var(--bg-card); border:1px solid rgba(124,58,237,0.15); border-radius:16px; overflow:hidden; }
  .result-card-header { padding:14px 16px 10px; border-bottom:1px solid rgba(124,58,237,0.1); display:flex; align-items:center; gap:8px; }
  .result-card-icon { font-size:16px; }
  .result-card-title { font-family:'Orbitron',sans-serif; font-size:11px; font-weight:700; }
  .result-card-count { font-size:10px; font-family:'Orbitron',sans-serif; margin-left:auto; }
  .result-card-body { padding:12px 16px; display:flex; flex-direction:column; gap:8px; min-height:60px; }

  .stat-item { display:flex; align-items:flex-start; gap:8px; padding:6px 10px; border-radius:8px; }
  .stat-item.up   { background:rgba(96,165,250,0.08); border:1px solid rgba(96,165,250,0.15); }
  .stat-item.down { background:rgba(248,113,113,0.08); border:1px solid rgba(248,113,113,0.15); }
  .stat-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; margin-top:5px; }
  .up .stat-dot   { background:var(--stat-up); }
  .down .stat-dot { background:var(--stat-down); }
  .stat-text { font-size:12px; line-height:1.5; flex:1; }
  .up .stat-text   { color:var(--stat-up); }
  .down .stat-text { color:var(--stat-down); }
  .stat-source { font-size:9px; color:var(--text-dim); margin-top:1px; font-family:'Orbitron',sans-serif; }

  .empty-result { text-align:center; padding:24px; color:var(--text-dim); font-size:12px; }
  .empty-result-icon { font-size:28px; margin-bottom:8px; }

  /* 선택 요약 바 */
  .selection-bar {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:var(--bg-card2); border:1px solid rgba(124,58,237,0.15);
    border-radius:12px; padding:10px 16px; margin-bottom:20px;
    font-size:11px; color:var(--text-dim);
  }
  .sel-chip { display:flex; align-items:center; gap:5px; padding:3px 8px; border-radius:8px; background:rgba(124,58,237,0.1); border:1px solid rgba(124,58,237,0.2); color:var(--text-sub); font-size:10px; }
  .sel-chip-grade { font-family:'Orbitron',sans-serif; font-size:9px; }

  /* 로딩 */
  .loading-wrap { text-align:center; padding:60px; color:var(--text-dim); }
  .spinner { width:32px; height:32px; border:3px solid rgba(124,58,237,0.15); border-top-color:var(--purple-2); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 12px; }
</style>
</head>

<main class="main-wrap">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-back" onclick="location.href='index.html'">←</div>
    <span style="font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;color:var(--text-main)">장비</span>
    <div style="margin-left:auto">
      <button onclick="loadAll()" style="background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.25);color:var(--purple-3);padding:6px 14px;border-radius:8px;font-size:11px;cursor:pointer;font-family:'Orbitron',sans-serif;">↻ 새로고침</button>
    </div>
  </div>

  <!-- 로딩 -->
  <div id="loading-state" class="loading-wrap">
    <div class="spinner"></div>
    데이터 불러오는 중...
  </div>

  <!-- 메인 컨텐츠 -->
  <div id="content-wrap" style="display:none">

    <!-- 페이지 타이틀 -->
    <div class="page-header">
      <div class="page-title">장비 / 무기 <span>조합 계산기</span></div>
      <div class="page-sub">장비와 무기를 선택하고 등급을 설정하면 합산 능력치를 확인할 수 있어요</div>
    </div>

    <!-- 선택 요약 -->
    <div class="selection-bar" id="selection-bar">
      <span style="font-family:'Orbitron',sans-serif;font-size:10px;color:var(--text-dim)">선택된 항목:</span>
      <span id="sel-summary" style="color:var(--text-dim);font-size:11px">장비와 무기를 선택하세요</span>
    </div>

    <!-- 계산기 컬럼 -->
    <div class="calc-columns">

      <!-- 장비 컬럼 -->
      <div class="equip-col">
        <div class="col-header">
          <div class="col-header-icon" style="background:rgba(124,58,237,0.15)">🛡️</div>
          <span class="col-header-title">장비 선택</span>
          <span class="col-header-count" id="equip-sel-count">0 / 6</span>
          <button onclick="clearAllEquips()" style="margin-left:auto;background:rgba(244,114,182,0.1);border:1px solid rgba(244,114,182,0.2);color:var(--accent-pink);padding:4px 10px;border-radius:8px;font-size:10px;cursor:pointer;">전체 초기화</button>
        </div>
        <div class="slot-list" id="slot-list"></div>
      </div>

      <!-- 무기 컬럼 -->
      <div class="weapon-col">
        <div class="col-header">
          <div class="col-header-icon" style="background:rgba(34,211,238,0.1)">🔫</div>
          <span class="col-header-title">무기 선택</span>
          <span class="col-header-count" id="weapon-sel-count">미선택</span>
        </div>
        <div class="weapon-block">
          <div class="weapon-items-grid" id="weapon-items-grid"></div>
          <div class="weapon-grade-wrap" id="weapon-grade-wrap" style="display:none">
            <div class="grade-label">무기 등급 선택</div>
            <div class="grade-buttons" id="weapon-grade-btns"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- 결과 패널 -->
    <div class="result-section" id="result-section" style="display:none">
      <div class="result-header">
        <span class="result-title">⚡ 합산 능력치</span>
        <div class="result-summary" id="result-summary"></div>
      </div>
      <div class="result-grid">
        <div class="result-card">
          <div class="result-card-header">
            <span class="result-card-icon">📈</span>
            <span class="result-card-title" style="color:var(--stat-up)">능력치 증가</span>
            <span class="result-card-count" id="up-count" style="color:var(--stat-up)"></span>
          </div>
          <div class="result-card-body" id="up-list">
            <div class="empty-result"><div class="empty-result-icon">📊</div>증가 능력치 없음</div>
          </div>
        </div>
        <div class="result-card">
          <div class="result-card-header">
            <span class="result-card-icon">📉</span>
            <span class="result-card-title" style="color:var(--stat-down)">능력치 감소</span>
            <span class="result-card-count" id="down-count" style="color:var(--stat-down)"></span>
          </div>
          <div class="result-card-body" id="down-list">
            <div class="empty-result"><div class="empty-result-icon">✅</div>감소 능력치 없음</div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /content-wrap -->
</main>

<script>
  const CSV_EQUIP  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmibDA5_-djeNETtuGqt5I3wtRqGs0oJjEQ8KZOW6qkQpINtLtEMIDNlU4N2IwipF7peIV6qWZKx5J/pub?gid=1255169524&single=true&output=csv';
  const CSV_WEAPON = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmibDA5_-djeNETtuGqt5I3wtRqGs0oJjEQ8KZOW6qkQpINtLtEMIDNlU4N2IwipF7peIV6qWZKx5J/pub?gid=2117031065&single=true&output=csv';

  const EQUIP_SLOTS  = ['모자','몸통','장갑','신발','반지','장신구'];
  const SLOT_ICONS   = { '모자':'🪖', '몸통':'🦺', '장갑':'🧤', '신발':'👟', '반지':'💍', '장신구':'📿' };
  const EQUIP_GRADES = ['일반','희귀','에픽','전설','신화','슈프림','얼티밋','셀레스티얼','스텔라','이모탈','디바인'];
  const WEAPON_GRADES= ['일반','희귀','에픽','전설','신화'];
  const GRADE_COLORS = { '일반':'#94a3b8','희귀':'#60a5fa','에픽':'#a855f7','전설':'#fbbf24','신화':'#f97316','슈프림':'#f472b6','얼티밋':'#e11d48','셀레스티얼':'#22d3ee','스텔라':'#818cf8','이모탈':'#34d399','디바인':'#fde68a' };
  const CAT_MAP = { '공통장비':'common','직업장비':'job','개인장비':'personal' };
  const CAT_LABEL = { 'common':'공통','job':'직업','personal':'개인' };

  let equipData  = [];  // [{name,slot,cat,img, grades:{일반:{eff,type},...}}]
  let weaponData = [];  // [{name,img, grades:{일반:{eff,type},...}}]

  // 선택 상태
  const slotSel = {};   // {슬롯명: {item, grade}}
  let weaponSel = null; // {item, grade}

  function parseCSV(text) {
    return text.trim().split('\n').slice(1).map(line => {
      const cols=[]; let cur='', inQ=false;
      for(let c of line){ if(c==='"'){inQ=!inQ;continue;} if(c===','&&!inQ){cols.push(cur.trim());cur='';}else cur+=c; }
      cols.push(cur.trim()); return cols;
    }).filter(r=>r[0]);
  }

  async function loadAll() {
    document.getElementById('loading-state').style.display='block';
    document.getElementById('content-wrap').style.display='none';
    try {
      const [resE, resW] = await Promise.all([
        fetch(CSV_EQUIP  + '&t='+Date.now(), {cache:'no-store'}),
        fetch(CSV_WEAPON + '&t='+Date.now(), {cache:'no-store'}),
      ]);
      const eRows = parseCSV(await resE.text());
      const wRows = parseCSV(await resW.text());

      // 장비 파싱: A=이름, B=부위, C=분류, D=이미지, E~AA=등급별(효과,타입)쌍
      equipData = eRows.map(r => {
        const grades = {};
        EQUIP_GRADES.forEach((g,i) => {
          const eff = r[4+i*2] || '';
          const typ = r[5+i*2] || '';
          if(eff) grades[g] = {eff, type:typ};
        });
        return { name:r[0]||'', slot:r[1]||'', cat:r[2]||'', img:r[3]||'', grades };
      }).filter(e=>e.name);

      // 무기 파싱: A=이름, B=이미지, C~L=등급별(효과,타입)쌍
      weaponData = wRows.map(r => {
        const grades = {};
        WEAPON_GRADES.forEach((g,i) => {
          const eff = r[2+i*2] || '';
          const typ = r[3+i*2] || '';
          if(eff) grades[g] = {eff, type:typ};
        });
        return { name:r[0]||'', img:r[1]||'', grades };
      }).filter(w=>w.name);

      document.getElementById('loading-state').style.display='none';
      document.getElementById('content-wrap').style.display='block';
      renderSlots();
      renderWeapons();
    } catch(e) {
      document.getElementById('loading-state').innerHTML =
        `<div style="color:var(--accent-pink);font-size:13px">⚠️ 불러오기 실패<br><small style="color:var(--text-dim)">${e.message}</small><br><br><button onclick="loadAll()" style="margin-top:8px;background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.3);color:var(--purple-3);padding:8px 20px;border-radius:8px;cursor:pointer;">↻ 다시 시도</button></div>`;
    }
  }

  /* ── 장비 슬롯 렌더 ── */
  function renderSlots() {
    const list = document.getElementById('slot-list');
    list.innerHTML = EQUIP_SLOTS.map(slot => {
      const items = equipData.filter(e => e.slot === slot);
      return `
        <div class="slot-row" id="slot-${slot}">
          <div class="slot-header" onclick="toggleSlot('${slot}')">
            <div class="slot-icon" id="slot-icon-${slot}">${SLOT_ICONS[slot]||'📦'}</div>
            <span class="slot-label">${slot}</span>
            <span class="slot-selected-name" id="slot-name-${slot}" style="color:var(--text-dim)">선택 안 됨</span>
            <span class="slot-selected-grade" id="slot-grade-${slot}"></span>
            <button class="slot-clear" onclick="clearSlot(event,'${slot}')" title="초기화">✕</button>
            <span class="slot-arrow">▾</span>
          </div>
          <div class="slot-panel" id="slot-panel-${slot}">
            <div class="slot-items-grid" id="slot-grid-${slot}">
              ${items.length === 0
                ? `<div style="grid-column:1/-1;color:var(--text-dim);font-size:11px;padding:8px 0">${slot} 장비 데이터 없음</div>`
                : items.map(item => {
                    const catCls = CAT_MAP[item.cat] || 'common';
                    const imgHtml = item.img
                      ? `<img src="${item.img}" onerror="this.outerHTML='🛡️'">`
                      : '🛡️';
                    return `<div class="slot-item" id="si-${slot}-${encodeURIComponent(item.name)}" onclick="selectEquip('${slot}','${item.name.replace(/'/g,"\\'")}')">
                      <div class="slot-item-img">${imgHtml}</div>
                      <div class="slot-item-name">${item.name}</div>
                      <span class="slot-item-cat cat-${catCls}">${CAT_LABEL[catCls]}</span>
                    </div>`;
                  }).join('')
              }
            </div>
            <div id="slot-grades-${slot}" style="display:none">
              <div class="grade-label">등급 선택</div>
              <div class="grade-buttons" id="slot-grade-btns-${slot}"></div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function toggleSlot(slot) {
    const row = document.getElementById('slot-'+slot);
    const isOpen = row.classList.contains('open');
    // 다른 슬롯 닫기
    EQUIP_SLOTS.forEach(s => {
      document.getElementById('slot-'+s)?.classList.remove('open');
    });
    if(!isOpen) row.classList.add('open');
  }

  function selectEquip(slot, itemName) {
    const item = equipData.find(e => e.slot===slot && e.name===itemName);
    if(!item) return;

    // 아이템 선택 표시
    document.querySelectorAll(`#slot-grid-${slot} .slot-item`).forEach(el => el.classList.remove('selected'));
    const el = document.getElementById(`si-${slot}-${encodeURIComponent(itemName)}`);
    if(el) el.classList.add('selected');

    slotSel[slot] = { item, grade: null };

    // 등급 버튼 표시
    const gradeWrap = document.getElementById(`slot-grades-${slot}`);
    const gradeBtns = document.getElementById(`slot-grade-btns-${slot}`);
    gradeWrap.style.display = 'block';
    const avail = EQUIP_GRADES.filter(g => item.grades[g]);
    gradeBtns.innerHTML = avail.map(g =>
      `<button class="grade-btn g-${g}" onclick="selectEquipGrade('${slot}','${g}')">${g}</button>`
    ).join('');

    // 헤더 업데이트
    document.getElementById(`slot-name-${slot}`).textContent = itemName;
    document.getElementById(`slot-name-${slot}`).style.color = 'var(--text-main)';
    const iconEl = document.getElementById(`slot-icon-${slot}`);
    if(item.img) iconEl.innerHTML = `<img src="${item.img}" onerror="this.outerHTML='${SLOT_ICONS[slot]||'📦'}'">`;

    updateSelSummary();
    updateResult();
    updateEquipCount();
  }

  function selectEquipGrade(slot, grade) {
    if(!slotSel[slot]) return;
    slotSel[slot].grade = grade;

    // 버튼 active
    document.querySelectorAll(`#slot-grade-btns-${slot} .grade-btn`).forEach(b => b.classList.remove('selected'));
    document.querySelectorAll(`#slot-grade-btns-${slot} .grade-btn`).forEach(b => {
      if(b.textContent===grade) b.classList.add('selected');
    });

    // 헤더 등급 표시
    const gradeEl = document.getElementById(`slot-grade-${slot}`);
    const c = GRADE_COLORS[grade]||'#9d8ec4';
    gradeEl.textContent = grade;
    gradeEl.style.cssText = `background:${c}22;color:${c};border:1px solid ${c}44;padding:2px 7px;border-radius:10px;font-family:'Orbitron',sans-serif;font-size:10px;`;

    // 슬롯 닫기
    document.getElementById('slot-'+slot).classList.remove('open');
    document.getElementById('slot-'+slot).classList.add('has-selection');

    updateSelSummary();
    updateResult();
  }

  function clearSlot(e, slot) {
    e.stopPropagation();
    delete slotSel[slot];
    document.getElementById(`slot-name-${slot}`).textContent = '선택 안 됨';
    document.getElementById(`slot-name-${slot}`).style.color = 'var(--text-dim)';
    document.getElementById(`slot-grade-${slot}`).textContent = '';
    document.getElementById(`slot-grade-${slot}`).style.cssText = '';
    document.getElementById(`slot-icon-${slot}`).innerHTML = SLOT_ICONS[slot]||'📦';
    document.getElementById(`slot-grades-${slot}`).style.display='none';
    document.querySelectorAll(`#slot-grid-${slot} .slot-item`).forEach(el=>el.classList.remove('selected'));
    document.getElementById('slot-'+slot).classList.remove('open','has-selection');
    updateSelSummary(); updateResult(); updateEquipCount();
  }

  function clearAllEquips() {
    EQUIP_SLOTS.forEach(s => {
      delete slotSel[s];
      const nameEl = document.getElementById(`slot-name-${s}`);
      if(nameEl){ nameEl.textContent='선택 안 됨'; nameEl.style.color='var(--text-dim)'; }
      const gradeEl = document.getElementById(`slot-grade-${s}`);
      if(gradeEl){ gradeEl.textContent=''; gradeEl.style.cssText=''; }
      const iconEl = document.getElementById(`slot-icon-${s}`);
      if(iconEl) iconEl.innerHTML = SLOT_ICONS[s]||'📦';
      const gw = document.getElementById(`slot-grades-${s}`);
      if(gw) gw.style.display='none';
      document.querySelectorAll(`#slot-grid-${s} .slot-item`).forEach(el=>el.classList.remove('selected'));
      document.getElementById('slot-'+s)?.classList.remove('open','has-selection');
    });
    updateSelSummary(); updateResult(); updateEquipCount();
  }

  function updateEquipCount() {
    const sel = EQUIP_SLOTS.filter(s => slotSel[s]?.grade).length;
    document.getElementById('equip-sel-count').textContent = `${sel} / 6`;
  }

  /* ── 무기 렌더 ── */
  function renderWeapons() {
    const grid = document.getElementById('weapon-items-grid');
    grid.innerHTML = weaponData.map(w => {
      const imgHtml = w.img ? `<img src="${w.img}" onerror="this.outerHTML='🔫'">` : '🔫';
      return `<div class="weapon-item" id="wi-${encodeURIComponent(w.name)}" onclick="selectWeapon('${w.name.replace(/'/g,"\\'")}')">
        <div class="weapon-item-img">${imgHtml}</div>
        <div class="weapon-item-name">${w.name}</div>
      </div>`;
    }).join('');
  }

  function selectWeapon(wName) {
    const w = weaponData.find(x=>x.name===wName);
    if(!w) return;
    document.querySelectorAll('.weapon-item').forEach(el=>el.classList.remove('selected'));
    document.getElementById(`wi-${encodeURIComponent(wName)}`)?.classList.add('selected');

    weaponSel = { item:w, grade:null };
    document.getElementById('weapon-grade-wrap').style.display='block';

    const avail = WEAPON_GRADES.filter(g=>w.grades[g]);
    document.getElementById('weapon-grade-btns').innerHTML = avail.map(g =>
      `<button class="grade-btn g-${g}" onclick="selectWeaponGrade('${g}')">${g}</button>`
    ).join('');

    document.getElementById('weapon-sel-count').textContent = wName;
    updateSelSummary(); updateResult();
  }

  function selectWeaponGrade(grade) {
    if(!weaponSel) return;
    weaponSel.grade = grade;
    document.querySelectorAll('#weapon-grade-btns .grade-btn').forEach(b => {
      b.classList.toggle('selected', b.textContent===grade);
    });
    const c = GRADE_COLORS[grade]||'#9d8ec4';
    document.getElementById('weapon-sel-count').innerHTML =
      `${weaponSel.item.name} <span style="font-size:9px;color:${c};font-family:'Orbitron',sans-serif">${grade}</span>`;
    updateSelSummary(); updateResult();
  }

  /* ── 결과 계산 ── */
  function updateResult() {
    const upItems   = [];
    const downItems = [];

    // 장비 효과 수집
    EQUIP_SLOTS.forEach(slot => {
      const s = slotSel[slot];
      if(!s || !s.grade || !s.item) return;
      const g = s.item.grades[s.grade];
      if(!g || !g.eff) return;
      const entry = { text:g.eff, source:`${s.item.name} (${s.grade})`, type:g.type };
      if(g.type==='감소') downItems.push(entry);
      else if(g.type==='혼합') splitMixed(entry, upItems, downItems);
      else upItems.push(entry);
    });

    // 무기 효과 수집
    if(weaponSel?.grade && weaponSel.item) {
      const g = weaponSel.item.grades[weaponSel.grade];
      if(g?.eff) {
        const entry = { text:g.eff, source:`${weaponSel.item.name} (${weaponSel.grade})`, type:g.type };
        if(g.type==='감소') downItems.push(entry);
        else if(g.type==='혼합') splitMixed(entry, upItems, downItems);
        else upItems.push(entry);
      }
    }

    const hasAny = upItems.length > 0 || downItems.length > 0;
    const resultSec = document.getElementById('result-section');
    resultSec.style.display = hasAny ? 'block' : 'none';
    if(!hasAny) return;

    // 증가
    document.getElementById('up-count').textContent = upItems.length+'개';
    document.getElementById('up-list').innerHTML = upItems.length
      ? upItems.map(it => `
          <div class="stat-item up">
            <div class="stat-dot"></div>
            <div><div class="stat-text">${it.text}</div><div class="stat-source">${it.source}</div></div>
          </div>`).join('')
      : '<div class="empty-result"><div class="empty-result-icon">✅</div>증가 능력치 없음</div>';

    // 감소
    document.getElementById('down-count').textContent = downItems.length+'개';
    document.getElementById('down-list').innerHTML = downItems.length
      ? downItems.map(it => `
          <div class="stat-item down">
            <div class="stat-dot"></div>
            <div><div class="stat-text">${it.text}</div><div class="stat-source">${it.source}</div></div>
          </div>`).join('')
      : '<div class="empty-result"><div class="empty-result-icon">📊</div>감소 능력치 없음</div>';
  }

  // 혼합 타입: +는 증가, -는 감소로 분리
  function splitMixed(entry, upList, downList) {
    const parts = entry.text.split(',').map(s=>s.trim()).filter(Boolean);
    parts.forEach(part => {
      const isDown = part.includes('-') && !part.startsWith('+');
      const e = { text:part, source:entry.source, type: isDown?'감소':'증가' };
      (isDown ? downList : upList).push(e);
    });
  }

  function updateSelSummary() {
    const chips = [];
    EQUIP_SLOTS.forEach(slot => {
      const s = slotSel[slot];
      if(s?.item && s?.grade) {
        const c = GRADE_COLORS[s.grade]||'#9d8ec4';
        chips.push(`<span class="sel-chip">${SLOT_ICONS[slot]} ${s.item.name} <span class="sel-chip-grade" style="color:${c}">${s.grade}</span></span>`);
      }
    });
    if(weaponSel?.item && weaponSel?.grade) {
      const c = GRADE_COLORS[weaponSel.grade]||'#9d8ec4';
      chips.push(`<span class="sel-chip">🔫 ${weaponSel.item.name} <span class="sel-chip-grade" style="color:${c}">${weaponSel.grade}</span></span>`);
    }
    const bar = document.getElementById('sel-summary');
    bar.innerHTML = chips.length
      ? chips.join('')
      : '<span style="color:var(--text-dim)">장비와 무기를 선택하세요</span>';
  }

  window.addEventListener('DOMContentLoaded', loadAll);
</script>
</body>
</html>

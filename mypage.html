<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마이페이지 — GGO PLAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep:#0a0612; --bg-card:#130d24; --bg-card2:#1a1035;
    --purple-1:#7c3aed; --purple-2:#9d5ff5; --purple-3:#c084fc;
    --accent-pink:#f472b6; --accent-cyan:#22d3ee; --accent-gold:#fbbf24;
    --text-main:#f0e8ff; --text-sub:#9d8ec4; --text-dim:#5c4e7a;
    --sidebar-w:72px; --bottombar-h:64px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg-deep);color:var(--text-main);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 15% 20%,rgba(124,58,237,0.18) 0%,transparent 70%),radial-gradient(ellipse 50% 50% at 85% 75%,rgba(157,95,245,0.12) 0%,transparent 70%);pointer-events:none;z-index:0;}

  /* SIDEBAR */
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:rgba(19,13,36,0.95);border-right:1px solid rgba(124,58,237,0.2);display:flex;flex-direction:column;align-items:center;padding:20px 0;z-index:100;backdrop-filter:blur(20px);}
  .sidebar-logo{width:42px;height:42px;background:linear-gradient(135deg,var(--purple-1),var(--purple-3));border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:16px;color:white;margin-bottom:32px;box-shadow:0 0 20px rgba(124,58,237,0.5);}
  .sidebar-nav{display:flex;flex-direction:column;gap:8px;flex:1;}
  .nav-item{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;position:relative;color:var(--text-dim);border:none;background:transparent;}
  .nav-item:hover,.nav-item.active{background:rgba(124,58,237,0.2);color:var(--purple-3);box-shadow:0 0 20px rgba(124,58,237,0.3);}
  .nav-item.active::before{content:'';position:absolute;left:-12px;width:3px;height:24px;background:var(--purple-2);border-radius:0 3px 3px 0;}
  .nav-item .tooltip{position:absolute;left:60px;background:rgba(19,13,36,0.95);color:var(--text-main);font-size:12px;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.15s;z-index:200;border:1px solid rgba(124,58,237,0.2);}
  .nav-item:hover .tooltip{opacity:1;}
  .sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .avatar-sm{width:36px;height:36px;border-radius:50%;background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.3);display:flex;align-items:center;justify-content:center;font-size:18px;}

  /* BOTTOM NAV */
  .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bottombar-h);background:rgba(19,13,36,0.97);border-top:1px solid rgba(124,58,237,0.2);z-index:100;backdrop-filter:blur(20px);justify-content:space-around;align-items:center;padding:0 8px;}
  .bottom-nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-dim);font-size:10px;cursor:pointer;padding:6px 12px;border-radius:10px;transition:all 0.2s;flex:1;}
  .bottom-nav-item .icon{font-size:20px;}
  .bottom-nav-item.active{color:var(--purple-3);}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes shimmer{0%{background-position:200% center}100%{background-position:-200% center}}

  @media(max-width:640px){
    .sidebar{display:none}.bottom-nav{display:flex}
    .main-wrap{margin-left:0!important;padding-bottom:calc(var(--bottombar-h)+20px)!important}
    .stats-row{grid-template-columns:repeat(2,1fr)!important}
    .deco-grid{grid-template-columns:repeat(2,1fr)!important}
  }

  /* MAIN */
  .main-wrap{margin-left:var(--sidebar-w);padding:0 0 48px;position:relative;z-index:1;min-height:100vh;}

  /* TOPBAR */
  .topbar{display:flex;align-items:center;gap:12px;padding:18px 28px;position:sticky;top:0;z-index:50;background:rgba(10,6,18,0.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(124,58,237,0.1);}
  .topbar-back{width:36px;height:36px;border-radius:10px;background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.25);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--purple-3);font-size:18px;transition:all 0.2s;}
  .topbar-back:hover{background:rgba(124,58,237,0.3);}

  /* ── 프로필 배너 ── */
  .profile-banner{
    width:100%;height:200px;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#1a0533 0%,#2d1060 40%,#1a0a3a 70%,#0f0620 100%);
  }
  .banner-pattern{position:absolute;inset:0;opacity:0.15;background-image:repeating-linear-gradient(45deg,rgba(124,58,237,0.3) 0px,rgba(124,58,237,0.3) 1px,transparent 1px,transparent 20px),repeating-linear-gradient(-45deg,rgba(34,211,238,0.15) 0px,rgba(34,211,238,0.15) 1px,transparent 1px,transparent 20px);}
  .banner-glow{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 50%,rgba(124,58,237,0.25) 0%,transparent 70%);}
  .banner-img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}

  /* ── 프로필 영역 ── */
  .profile-area{padding:0 28px 24px;position:relative;}
  .profile-avatar-wrap{position:relative;display:inline-block;margin-top:-48px;margin-bottom:12px;}
  .profile-avatar{
    width:88px;height:88px;border-radius:50%;
    background:linear-gradient(135deg,var(--purple-1),var(--purple-2));
    border:3px solid var(--bg-deep);
    display:flex;align-items:center;justify-content:center;
    font-size:36px;overflow:hidden;position:relative;
  }
  .profile-avatar img{width:100%;height:100%;object-fit:cover;}
  .profile-avatar-border{position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(124,58,237,0.4);pointer-events:none;}

  .profile-info{animation:fadeUp 0.4s ease;}
  .profile-title-text{font-size:10px;color:var(--text-dim);margin-bottom:3px;font-family:'Noto Sans KR',sans-serif;}
  .profile-title-badge{display:inline-block;font-size:10px;color:var(--accent-gold);background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.2);border-radius:6px;padding:1px 8px;margin-bottom:5px;}
  .profile-name{font-size:22px;font-weight:700;color:var(--text-main);margin-bottom:4px;}
  .profile-server{font-size:11px;color:var(--accent-cyan);font-family:'Orbitron',sans-serif;}

  /* ── 스탯 카드 ── */
  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px;}
  .stat-card{background:var(--bg-card);border:1px solid rgba(124,58,237,0.15);border-radius:14px;padding:14px 16px;text-align:center;}
  .stat-icon{font-size:18px;margin-bottom:6px;}
  .stat-value{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;color:var(--purple-3);}
  .stat-label{font-size:10px;color:var(--text-dim);margin-top:3px;}

  /* ── 꾸미기 레벨 카드 ── */
  .deco-level-card{
    background:var(--bg-card);border:1px solid rgba(124,58,237,0.2);
    border-radius:16px;padding:18px 20px;margin:20px 28px 0;
    animation:fadeUp 0.4s ease 0.1s both;
  }
  .dlc-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .dlc-badge{
    width:48px;height:48px;border-radius:12px;
    background:linear-gradient(135deg,var(--purple-1),var(--accent-cyan));
    display:flex;align-items:center;justify-content:center;
    font-family:'Orbitron',sans-serif;font-size:11px;font-weight:900;color:white;
    flex-shrink:0;box-shadow:0 0 16px rgba(124,58,237,0.4);
    flex-direction:column;line-height:1.1;
  }
  .dlc-badge .lv-label{font-size:8px;opacity:0.8;}
  .dlc-info{flex:1;}
  .dlc-title{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;color:var(--text-main);}
  .dlc-exp{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .dlc-bar-wrap{background:rgba(124,58,237,0.1);border-radius:20px;height:8px;overflow:hidden;margin-top:2px;}
  .dlc-bar{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--purple-1),var(--purple-3),var(--accent-cyan));transition:width 0.8s ease;box-shadow:0 0 8px rgba(124,58,237,0.4);}
  .dlc-next{font-size:10px;color:var(--text-dim);margin-top:6px;text-align:right;}

  /* ── 보유 아이템 섹션 ── */
  .items-section{padding:24px 28px 0;animation:fadeUp 0.4s ease 0.2s both;}
  .items-section-title{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;color:var(--text-main);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .items-section-title::after{content:'';flex:1;height:1px;background:rgba(124,58,237,0.12);}

  /* 카테고리 탭 */
  .cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .cat-tab{padding:5px 12px;border-radius:20px;font-size:11px;cursor:pointer;transition:all 0.18s;border:1px solid rgba(124,58,237,0.2);color:var(--text-dim);background:var(--bg-card2);}
  .cat-tab:hover{border-color:rgba(124,58,237,0.4);color:var(--text-sub);}
  .cat-tab.active{background:rgba(124,58,237,0.2);border-color:var(--purple-2);color:var(--purple-3);}

  /* 아이템 그리드 */
  .deco-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;}
  .deco-card{background:var(--bg-card);border:1px solid rgba(124,58,237,0.12);border-radius:12px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;transition:all 0.18s;position:relative;}
  .deco-card:hover{border-color:rgba(124,58,237,0.35);transform:translateY(-2px);}
  .deco-card.equipped{border-color:var(--purple-2);background:rgba(124,58,237,0.1);}
  .deco-card-img{width:56px;height:56px;border-radius:10px;background:var(--bg-card2);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;}
  .deco-card-img img{width:100%;height:100%;object-fit:cover;border-radius:9px;}
  .deco-card-name{font-size:10px;color:var(--text-sub);text-align:center;line-height:1.3;word-break:keep-all;}
  .deco-grade-badge{font-size:8px;font-family:'Orbitron',sans-serif;padding:1px 6px;border-radius:10px;}
  .grade-일반{background:rgba(148,163,184,0.12);color:#94a3b8;border:1px solid rgba(148,163,184,0.2);}
  .grade-희귀{background:rgba(96,165,250,0.12);color:#60a5fa;border:1px solid rgba(96,165,250,0.2);}
  .grade-에픽{background:rgba(168,85,247,0.12);color:#a855f7;border:1px solid rgba(168,85,247,0.2);}
  .grade-전설{background:rgba(251,191,36,0.12);color:#fbbf24;border:1px solid rgba(251,191,36,0.2);}
  .equipped-tag{position:absolute;top:6px;right:6px;font-size:7px;font-family:'Orbitron',sans-serif;background:rgba(124,58,237,0.3);color:var(--purple-3);border:1px solid rgba(124,58,237,0.4);padding:1px 5px;border-radius:5px;}

  /* 빈 상태 */
  .empty-items{text-align:center;padding:40px 20px;color:var(--text-dim);}
  .empty-icon{font-size:36px;margin-bottom:10px;opacity:0.5;}
  .empty-title{font-size:13px;margin-bottom:6px;color:var(--text-sub);}
  .empty-sub{font-size:11px;line-height:1.6;}
  .btn-go-shop{display:inline-block;margin-top:14px;padding:8px 20px;background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.3);color:var(--purple-3);border-radius:10px;font-size:12px;cursor:pointer;transition:all 0.18s;}
  .btn-go-shop:hover{background:rgba(124,58,237,0.25);}

  /* 로딩 */
  .loading-wrap{text-align:center;padding:60px;color:var(--text-dim);}
  .spinner{width:32px;height:32px;border:3px solid rgba(124,58,237,0.15);border-top-color:var(--purple-2);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}

  /* EXP 정보 */
  .exp-info-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .exp-chip{font-size:10px;padding:3px 9px;border-radius:8px;font-family:'Orbitron',sans-serif;background:var(--bg-card2);border:1px solid rgba(124,58,237,0.15);color:var(--text-dim);}
  .exp-chip span{color:var(--text-sub);}

  /* ── 재화 카드 ── */
  .currency-section { padding: 20px 28px 0; animation: fadeUp 0.4s ease 0.05s both; }
  .currency-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
  .currency-card {
    background: var(--bg-card);
    border: 1px solid rgba(124,58,237,0.15);
    border-radius: 14px;
    padding: 14px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    transition: all 0.2s;
  }
  .currency-card:hover { border-color: rgba(124,58,237,0.35); transform: translateY(-2px); }
  .currency-icon { font-size: 24px; line-height: 1; }
  .currency-value { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 900; }
  .currency-label { font-size: 10px; color: var(--text-dim); }
  .currency-card.ruby   .currency-value { color: #f87171; }
  .currency-card.crystal .currency-value { color: #60a5fa; }
  .currency-card.gp     .currency-value { color: #fbbf24; }


  /* 아이템 선택/액션 */
  .deco-card { cursor: pointer; }
  .deco-card.selected { border-color: var(--purple-2) !important; background: rgba(124,58,237,0.15) !important; }
  .item-action-btns { display: flex; gap: 5px; margin-top: 5px; width: 100%; }
  .btn-equip   { flex:1; padding:4px 0; border-radius:7px; border:none; background:linear-gradient(135deg,var(--purple-1),var(--purple-2)); color:white; font-size:9px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }
  .btn-unequip { flex:1; padding:4px 0; border-radius:7px; border:1px solid rgba(34,211,238,0.35); background:rgba(34,211,238,0.08); color:var(--accent-cyan); font-size:9px; font-weight:700; cursor:pointer; }
  .btn-delete  { padding:4px 8px; border-radius:7px; border:1px solid rgba(244,114,182,0.3); background:rgba(244,114,182,0.07); color:var(--accent-pink); font-size:9px; cursor:pointer; }
  .btn-equip:hover   { opacity:0.85; }
  .btn-unequip:hover { background:rgba(34,211,238,0.15); }
  .btn-delete:hover  { background:rgba(244,114,182,0.15); }


  /* ── 장착 아이템 효과 ── */
  @keyframes legendaryFlow { 0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%} }
  @keyframes rotateBorder  { to{transform:rotate(360deg)} }
  @keyframes glowPulse     { 0%,100%{opacity:0.6}50%{opacity:1} }
  @keyframes shimmer       { 0%{background-position:200% center}100%{background-position:-200% center} }
  @keyframes nameGlow      { 0%,100%{text-shadow:0 0 8px currentColor}50%{text-shadow:0 0 20px currentColor,0 0 40px currentColor} }

  /* 배너 패턴 오버레이 */
  .banner-epic-grid::after {
    content:''; position:absolute; inset:0;
    background:repeating-linear-gradient(45deg,rgba(255,255,255,0.04) 0,rgba(255,255,255,0.04) 1px,transparent 0,transparent 10px);
  }
  .banner-epic-lines::after {
    content:''; position:absolute; inset:0;
    background:repeating-linear-gradient(0deg,rgba(34,211,238,0.08) 0,rgba(34,211,238,0.08) 1px,transparent 0,transparent 8px);
  }
  /* 테두리 회전 래퍼 */
  .border-rotating-wrap {
    position:absolute; inset:-6px; border-radius:50%;
    animation:rotateBorder 2s linear infinite;
  }
  /* 이름 그라데이션 텍스트 */
  .name-gradient {
    background-size:200%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .name-shimmer { animation:shimmer 2s linear infinite; }
  .name-glow    { animation:nameGlow 2s ease-in-out infinite; }


  /* 에픽/전설 배너 패턴 */
  #profile-banner.banner-epic-grid::after,
  #profile-banner.banner-epic-lines::after,
  #profile-banner.banner-epic-hex::after,
  #profile-banner.banner-epic-stars::after,
  #profile-banner.banner-epic-cross::after,
  #profile-banner.banner-legend-hex::after,
  #profile-banner.banner-legend-circle::after,
  #profile-banner.banner-legend-diamond::after {
    content:''; position:absolute; inset:0; pointer-events:none;
  }
  #profile-banner.banner-epic-grid::after { background:repeating-linear-gradient(45deg,rgba(124,58,237,0.15) 0,rgba(124,58,237,0.15) 1px,transparent 0,transparent 12px); }
  #profile-banner.banner-epic-lines::after { background:repeating-linear-gradient(0deg,rgba(34,211,238,0.1) 0,rgba(34,211,238,0.1) 1px,transparent 0,transparent 8px); }
  #profile-banner.banner-epic-hex::after { background:repeating-linear-gradient(60deg,rgba(168,85,247,0.1) 0,rgba(168,85,247,0.1) 1px,transparent 0,transparent 14px); }
  #profile-banner.banner-epic-stars::after { background:radial-gradient(circle,rgba(255,255,255,0.3) 1px,transparent 1px) 0 0/20px 20px; }
  #profile-banner.banner-epic-cross::after { background:repeating-linear-gradient(90deg,rgba(129,140,248,0.1) 0,rgba(129,140,248,0.1) 1px,transparent 0,transparent 16px),repeating-linear-gradient(0deg,rgba(129,140,248,0.1) 0,rgba(129,140,248,0.1) 1px,transparent 0,transparent 16px); }
  #profile-banner.banner-legend-hex::after { background:repeating-linear-gradient(60deg,rgba(255,255,255,0.08) 0,rgba(255,255,255,0.08) 1px,transparent 0,transparent 18px); }
  #profile-banner.banner-legend-circle::after { background:radial-gradient(circle,rgba(255,255,255,0.06) 1px,transparent 1px) 0 0/18px 18px; }
  #profile-banner.banner-legend-diamond::after { background:repeating-linear-gradient(45deg,rgba(255,255,255,0.06) 0,rgba(255,255,255,0.06) 1px,transparent 0,transparent 14px); }

</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">G</div>
  <nav class="sidebar-nav">
    <button class="nav-item" onclick="location.href='index.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><polyline points="9 21 9 12 15 12 15 21"/></svg><span class="tooltip">홈</span></button>
    <button class="nav-item" onclick="location.href='character.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg><span class="tooltip">캐릭터</span></button>
    <button class="nav-item" onclick="location.href='equipment.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7h7l-5.5 4 2 7L12 16l-6.5 4 2-7L2 9h7z"/></svg><span class="tooltip">장비</span></button>
    <button class="nav-item" onclick="location.href='battlepass.html'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><span class="tooltip">배틀패스</span></button>

<script>
  const CSV_MEMBER = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmibDA5_-djeNETtuGqt5I3wtRqGs0oJjEQ8KZOW6qkQpINtLtEMIDNlU4N2IwipF7peIV6qWZKx5J/pub?gid=1765510409&single=true&output=csv';

  const EXP_PER_GRADE = {일반:100, 희귀:300, 에픽:500, 전설:1000};
  const EXP_PER_LEVEL = 1000;

  let allItems = []; // 보유 아이템 전체 (상점 연동 후 채워짐)

  function parseCSV(txt) {
    return txt.trim().split('\n').slice(1).map(line => {
      const cols=[]; let cur='',inQ=false;
      for(let c of line){if(c==='"'){inQ=!inQ;continue;}if(c===','&&!inQ){cols.push(cur.trim());cur='';}else cur+=c;}
      cols.push(cur.trim()); return cols;
    }).filter(r=>r[0]);
  }

  function calcDecoLevel(items) {
    const totalExp = items.reduce((sum,it) => sum + (EXP_PER_GRADE[it.grade]||0), 0);
    const level = Math.floor(totalExp / EXP_PER_LEVEL) + 1;
    const expInLevel = totalExp % EXP_PER_LEVEL;
    return { level, totalExp, expInLevel };
  }

  function renderDecoLevel(items) {
    // 누적 EXP 우선 (삭제해도 EXP 보존)
    const username = localStorage.getItem('ggo_username')||'';
    const savedExp = parseInt(localStorage.getItem('ggo_deco_exp_'+username)||'0');
    const EXP_MAP2 = {일반:100,희귀:300,에픽:500,전설:1000};
    const curExp   = items.reduce((s,it)=>s+(EXP_MAP2[it.grade]||0),0);
    const useExp   = Math.max(savedExp, curExp);
    const level    = Math.floor(useExp/1000)+1;
    const expInLevel = useExp%1000;
    const totalExp = useExp;
    const { } = {}; // dummy
    const pct = (expInLevel / EXP_PER_LEVEL) * 100;

    document.getElementById('dlc-lv-num').textContent = level;
    document.getElementById('stat-deco-lv').textContent = 'Lv.' + level;
    document.getElementById('dlc-exp-text').textContent = `${expInLevel} / ${EXP_PER_LEVEL} EXP  (총 ${totalExp} EXP)`;
    document.getElementById('dlc-next-text').textContent = `다음 레벨까지 ${EXP_PER_LEVEL - expInLevel} EXP`;
    setTimeout(() => {
      document.getElementById('dlc-bar').style.width = pct + '%';
    }, 100);
  }

  function renderItems(items) {
    const grid = document.getElementById('deco-grid');
    if(!items.length) {
      grid.innerHTML = `
        <div class="empty-items" style="grid-column:1/-1">
          <div class="empty-icon">🛍️</div>
          <div class="empty-title">아직 보유한 아이템이 없어요</div>
          <div class="empty-sub">상점에서 꾸미기 아이템을 구매하면<br>이곳에 표시됩니다</div>
          <div class="btn-go-shop" onclick="location.href='shop.html'">🛒 상점 방문하기</div>
        </div>`;
      return;
    }

    const CAT_ICONS = {프로필배너:'🖼',프로필아이콘:'👤',테두리효과:'💫',칭호:'🏅',이름색상효과:'🎨'};
    grid.innerHTML = items.map((it,i) => {
      const globalIdx = allItems.indexOf(it);
      const imgHtml = it.img
        ? `<img src="${it.img}" onerror="this.outerHTML='<span>${CAT_ICONS[it.type]||'✨'}</span>'">`
        : `<span>${CAT_ICONS[it.type]||'✨'}</span>`;
      const equippedTag = it.equipped ? '<div class="equipped-tag">장착중</div>' : '';
      return `<div class="deco-card ${it.equipped?'equipped':''}" id="deco-card-${globalIdx}" onclick="selectItem(${globalIdx}, event)">
        ${equippedTag}
        <div class="deco-card-img">${imgHtml}</div>
        <div class="deco-card-name">${it.name}</div>
        <span class="deco-grade-badge grade-${it.grade}">${it.grade}</span>
        <div class="item-action-btns" id="item-btns-${globalIdx}" style="display:none">
          ${it.equipped
            ? `<button class="btn-unequip" onclick="unequipItem(${globalIdx},event)">해제</button>`
            : `<button class="btn-equip"   onclick="equipItem(${globalIdx},event)">장착</button>`}
          <button class="btn-delete" onclick="deleteItem(${globalIdx},event)">삭제</button>
        </div>
      </div>`;
    }).join('');
  }


  let selectedItemIdx = -1;

  function selectItem(idx, e) {
    e.stopPropagation();
    // 이전 선택 해제
    if(selectedItemIdx !== -1) {
      const prev = document.getElementById('deco-card-'+selectedItemIdx);
      const prevBtns = document.getElementById('item-btns-'+selectedItemIdx);
      if(prev) prev.classList.remove('selected');
      if(prevBtns) prevBtns.style.display='none';
    }
    // 같은 카드 재클릭 시 선택 해제
    if(selectedItemIdx === idx) { selectedItemIdx = -1; return; }
    selectedItemIdx = idx;
    const card = document.getElementById('deco-card-'+idx);
    const btns = document.getElementById('item-btns-'+idx);
    if(card) card.classList.add('selected');
    if(btns) btns.style.display='flex';
  }

  // 외부 클릭 시 선택 해제
  document.addEventListener('click', () => {
    if(selectedItemIdx !== -1) {
      const card = document.getElementById('deco-card-'+selectedItemIdx);
      const btns = document.getElementById('item-btns-'+selectedItemIdx);
      if(card) card.classList.remove('selected');
      if(btns) btns.style.display='none';
      selectedItemIdx = -1;
    }
  });

  function saveItems(items) {
    const username = localStorage.getItem('ggo_username')||'';
    // EXP는 보존 — 별도 누적 저장
    const expKey = 'ggo_deco_exp_'+username;
    const EXP_MAP = {일반:100,희귀:300,에픽:500,전설:1000};
    const prevExp = parseInt(localStorage.getItem(expKey)||'0');
    const curExp  = items.reduce((s,it)=>s+(EXP_MAP[it.grade]||0),0);
    // 누적 EXP = max(기존, 현재) — 삭제해도 줄지 않음
    const keepExp = Math.max(prevExp, curExp);
    localStorage.setItem(expKey, keepExp);
    localStorage.setItem('ggo_items_'+username, JSON.stringify(items));
  }

  function equipItem(idx, e) {
    e.stopPropagation();
    const username = localStorage.getItem('ggo_username')||'';
    const items = JSON.parse(localStorage.getItem('ggo_items_'+username)||'[]');
    if(!items[idx]) return;
    const type = items[idx].type;
    // 같은 타입 기존 장착 해제
    items.forEach((it,i) => { if(it.type===type) items[i].equipped=false; });
    items[idx].equipped = true;
    saveItems(items);
    allItems = items;
    // 프로필에 즉시 반영
    applyEquipped(items);
    selectedItemIdx = -1;
    const activeCat = document.querySelector('.cat-tab.active');
    const cat = activeCat ? activeCat.textContent.trim() : '전체';
    filterCatByLabel(cat);
  }

  function unequipItem(idx, e) {
    e.stopPropagation();
    const username = localStorage.getItem('ggo_username')||'';
    const items = JSON.parse(localStorage.getItem('ggo_items_'+username)||'[]');
    if(!items[idx]) return;
    items[idx].equipped = false;
    saveItems(items);
    allItems = items;
    applyEquipped(items);
    selectedItemIdx = -1;
    const activeCat = document.querySelector('.cat-tab.active');
    filterCatByLabel(activeCat ? activeCat.textContent.trim() : '전체');
  }

  function deleteItem(idx, e) {
    e.stopPropagation();
    if(!confirm('아이템을 삭제하시겠습니까?\n획득한 꾸미기 EXP는 유지됩니다.')) return;
    const username = localStorage.getItem('ggo_username')||'';
    const items = JSON.parse(localStorage.getItem('ggo_items_'+username)||'[]');
    items.splice(idx,1);
    saveItems(items);
    allItems = items;
    applyEquipped(items);
    selectedItemIdx = -1;
    const activeCat = document.querySelector('.cat-tab.active');
    filterCatByLabel(activeCat ? activeCat.textContent.trim() : '전체');
  }

  // 장착 아이템 프로필 반영

  // ──────────────────────────────────────────
  //  꾸미기 아이템 시각화 데이터 정의
  // ──────────────────────────────────────────


  // ── 배너 데이터 (shop.html과 동일) ──

    일반: [
      {name:'미드나잇 블루',css:'background:#1e3a5f;'},
      {name:'딥 퍼플',css:'background:#2d1b69;'},
      {name:'포레스트 그린',css:'background:#1a3d2b;'},
      {name:'크림슨 레드',css:'background:#6b1a1a;'},
      {name:'다크 마젠타',css:'background:#4a1040;'},
      {name:'오션 딥',css:'background:#0d2e4a;'},
      {name:'아이언 그레이',css:'background:#2c3140;'},
      {name:'다크 슬레이트',css:'background:#1c2b3a;'},
      {name:'브론즈 틴트',css:'background:#3d2b1a;'},
      {name:'에메랄드 나이트',css:'background:#0d3b2e;'},
      {name:'인디고 다크',css:'background:#1a1f5e;'},
      {name:'마룬 섀도우',css:'background:#4a1525;'},

      {name:'딥 코랄',css:'background:#5c2a1a;'},
      {name:'나이트 바이올렛',css:'background:#2e1545;'},
      {name:'스틸 블루',css:'background:#1e3050;'},
      {name:'다크 사이안',css:'background:#0d3040;'},
      {name:'어쉬 블랙',css:'background:#1a1a2e;'},
      {name:'다크 앰버',css:'background:#3d2800;'},
    ],
    희귀: [

  // ──────────────────────────────────────────
  //  applyEquipped: 장착 아이템 → 프로필 반영
  // ──────────────────────────────────────────
  function applyEquipped(items) {
    // ── 배너 ──
    const bannerItem = items.find(it=>it.type==='프로필배너'&&it.equipped);
    const bannerEl   = document.getElementById('profile-banner');
    if(bannerEl) {
      const epicClasses=['banner-epic-grid','banner-epic-lines','banner-epic-hex','banner-epic-stars','banner-epic-cross','banner-legend-hex','banner-legend-circle','banner-legend-diamond'];
      epicClasses.forEach(cls=>bannerEl.classList.remove(cls));
      if(bannerItem) {
        const g  = bannerItem.grade;
        const bi = bannerItem.bannerIdx !== undefined ? bannerItem.bannerIdx : (bannerItem.visualIdx||0);
        const bList = MP_BANNER_ITEMS[g]||[];
        const b  = bList[bi % (bList.length||1)];
        if(b) {
          // CSS 파싱 후 적용
          const tempDiv = document.createElement('div');
          tempDiv.setAttribute('style', b.css);
          bannerEl.style.background     = tempDiv.style.background || tempDiv.style.backgroundImage || b.css.replace('background:','').replace(';','');
          bannerEl.style.backgroundSize = b.css.includes('300% 300%') ? '300% 300%' : '';
          bannerEl.style.animation      = b.animated ? 'legendaryFlow 4s ease infinite' : '';
          if(b.patternClass) bannerEl.classList.add(b.patternClass);
        }
      } else {
        bannerEl.style.background     = 'linear-gradient(135deg,#1a0533 0%,#2d1060 40%,#1a0a3a 70%,#0f0620 100%)';
        bannerEl.style.backgroundSize = '';
        bannerEl.style.animation      = '';
      }
    }

    // ── 아이콘 ──
    const iconItem = items.find(it=>it.type==='프로필아이콘'&&it.equipped);
    const avatarEl = document.getElementById('profile-avatar');
    if(avatarEl) {
      if(iconItem) {
        const g   = iconItem.grade;
        const bi  = iconItem.itemIdx !== undefined ? iconItem.itemIdx : (iconItem.visualIdx||0);
        const it2 = (MP_ICON_ITEMS[g]||[])[bi % (MP_ICON_ITEMS[g]?.length||1)];
        if(it2) {
          avatarEl.style.background = 'rgba(124,58,237,0.1)';
          avatarEl.style.overflow   = 'hidden';
          if(it2.emoji) {
            avatarEl.innerHTML = `<span style="font-size:44px;line-height:1">${it2.emoji}</span>`;
          } else if(it2.svg) {
            avatarEl.innerHTML = `<svg width="60" height="60" viewBox="0 0 52 52" fill="none">${it2.svg}</svg>`;
          } else if(it2.holo) {
            avatarEl.innerHTML = `<div style="position:absolute;inset:0;border-radius:50%;background:${it2.holo};background-size:200%;${it2.anim?'animation:legendaryFlow 3s ease infinite':''}"></div><div style="position:relative;font-size:32px">✦</div>`;
            avatarEl.style.position='relative';
          } else if(it2.glass) {
            avatarEl.innerHTML = `<div style="position:absolute;inset:0;border-radius:50%;background:${it2.glass};border:2px solid ${it2.border}"></div><div style="position:relative;font-size:32px">💠</div>`;
            avatarEl.style.position='relative';
          }
        }
      } else {
        const u = localStorage.getItem('ggo_username')||'';
        avatarEl.innerHTML = u.charAt(0).toUpperCase()||'?';
        avatarEl.style.background  = 'linear-gradient(135deg,var(--purple-1),var(--purple-2))';
        avatarEl.style.fontSize    = '';
        avatarEl.style.overflow    = '';
        avatarEl.style.position    = '';
      }
    }

    // ── 테두리 ──
    const borderItem = items.find(it=>it.type==='테두리효과'&&it.equipped);
    const borderEl   = document.getElementById('profile-border');
    if(borderEl) {
      // 기존 회전 래퍼 제거
      const existRotWrap = document.getElementById('border-rotating-wrap');
      if(existRotWrap) existRotWrap.remove();

      if(borderItem) {
        const g   = borderItem.grade;
        const idx = (borderItem.visualIdx||0) % (BORDER_STYLES[g]?.length||1);
        const st  = BORDER_STYLES[g]?.[idx];
        if(st) {
          // MP_BORDER_ITEMS 기반 적용
          const g2  = borderItem.grade;
          const bi2 = borderItem.itemIdx !== undefined ? borderItem.itemIdx : (borderItem.visualIdx||0);
          const bst = (MP_BORDER_ITEMS[g2]||[])[bi2 % (MP_BORDER_ITEMS[g2]?.length||1)];
          if(!bst) {}
          else if(bst.rotating) {
            borderEl.style.border='none'; borderEl.style.boxShadow=''; borderEl.style.background='transparent';
            const wrap=document.createElement('div');
            wrap.id='border-rotating-wrap'; wrap.className='border-rotating-wrap';
            wrap.style.cssText=`position:absolute;inset:-6px;border-radius:50%;background:${bst.grad};animation:rotateBorder 2s linear infinite;`;
            const inner=document.createElement('div');
            inner.style.cssText='position:absolute;inset:4px;border-radius:50%;background:var(--bg-card);';
            wrap.appendChild(inner);
            borderEl.parentElement.style.position='relative';
            borderEl.parentElement.appendChild(wrap);
          } else if(bst.glow) {
            borderEl.style.border=`3px solid ${bst.color}`; borderEl.style.boxShadow=bst.glow;
            borderEl.style.background='transparent'; borderEl.style.padding=''; borderEl.style.inset='-4px';
          } else if(bst.grad) {
            borderEl.style.background=bst.grad; borderEl.style.border='none';
            borderEl.style.padding='3px'; borderEl.style.boxShadow=''; borderEl.style.inset='-3px';
          } else if(bst.color) {
            borderEl.style.border=`3px solid ${bst.color}`; borderEl.style.boxShadow='';
            borderEl.style.background='transparent'; borderEl.style.padding=''; borderEl.style.inset='-4px';
          }
        }
      } else {
        // 기본 테두리 복원
        borderEl.style.border     = '2px solid rgba(124,58,237,0.4)';
        borderEl.style.boxShadow  = '';
        borderEl.style.background = 'transparent';
        borderEl.style.padding    = '';
        borderEl.style.inset      = '-4px';
      }
    }

    // ── 이름 색상 효과 ──
    const nameEffItem = items.find(it=>it.type==='이름색상효과'&&it.equipped);
    const nameEl      = document.getElementById('profile-name');
    if(nameEl) {
      // 초기화
      nameEl.style.cssText='';
      nameEl.style.fontSize='22px';
      nameEl.style.fontWeight='700';
      nameEl.classList.remove('name-gradient','name-shimmer','name-glow');

      if(nameEffItem) {
        const g2  = nameEffItem.grade;
        const bi2 = nameEffItem.itemIdx !== undefined ? nameEffItem.itemIdx : (nameEffItem.visualIdx||0);
        const nst = (MP_NAME_EFF_ITEMS[g2]||[])[bi2 % (MP_NAME_EFF_ITEMS[g2]?.length||1)];
        if(nst) {
          if(nst.grad) {
            nameEl.style.background     = nst.grad;
            nameEl.style.backgroundSize = '200%';
            nameEl.style.webkitBackgroundClip = 'text';
            nameEl.style.webkitTextFillColor  = 'transparent';
            nameEl.style.backgroundClip       = 'text';
            if(nst.anim) nameEl.classList.add('name-shimmer');
          } else if(nst.color) {
            nameEl.style.color = nst.color;
            if(nst.glow) { nameEl.style.textShadow=nst.glow; nameEl.classList.add('name-glow'); }
          }
        }
      } else {
        nameEl.style.color = 'var(--text-main)';
      }
    }

    // ── 칭호 ──
    const titleItem = items.find(it=>it.type==='칭호'&&it.equipped);
    const titleEl   = document.getElementById('profile-title');
    if(titleEl) {
      if(titleItem) {
        titleEl.textContent  = '< '+titleItem.name+' >';
        titleEl.style.display= 'inline-block';
      } else {
        titleEl.style.display='none';
      }
    }
  }


  function filterCatByLabel(label) {
    const MAP = {'전체':'전체','🖼 배너':'프로필배너','👤 아이콘':'프로필아이콘','💫 테두리':'테두리효과','🏅 칭호':'칭호','🎨 이름색상':'이름색상효과'};
    const cat = MAP[label] || (label==='전체'?'전체':label);
    const filtered = cat==='전체' ? allItems : allItems.filter(it=>it.type===cat);
    renderItems(filtered);
  }


  function filterCat(cat, el) {
    document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    const filtered = cat==='전체' ? allItems : allItems.filter(it=>it.type===cat);
    renderItems(filtered);
    selectedItemIdx = -1;
  }

  async function loadMyPage() {
    // 로그인 체크
    const username = localStorage.getItem('ggo_username');
    const isLoggedIn = localStorage.getItem('ggo_logged_in') === 'true';
    if(!isLoggedIn || !username) { location.href='login.html'; return; }

    try {
      // 회원 데이터 로드: A=ID, B=GGO NUMBER, C=배틀패스점수, D=친선대회점수
      const res = await fetch(CSV_MEMBER+'&t='+Date.now(), {cache:'no-store'});
      const rows = parseCSV(await res.text());
      const user = rows.find(r=>r[0].trim()===username);

      const bp   = user ? (parseFloat(user[2])||0) : 0;
      const ts   = user ? (parseFloat(user[3])||0) : 0;

      // 보유 아이템: localStorage에서 로드 (상점 연동 후 채워짐)
      const storedItems = JSON.parse(localStorage.getItem('ggo_items_'+username)||'[]');
      allItems = storedItems;

      // 프로필 렌더
      document.getElementById('profile-name').textContent = username;
      document.getElementById('stat-bp').textContent = bp.toLocaleString();
      document.getElementById('stat-ts').textContent = ts.toLocaleString();

      // 칭호는 applyEquipped에서 처리

      // 재화
      const currKey = 'ggo_currency_' + username;
      const curr    = JSON.parse(localStorage.getItem(currKey)||'{"루비":0,"크리스탈":0,"GP":0}');
      document.getElementById('cur-ruby').textContent    = (curr['루비']||0).toLocaleString();
      document.getElementById('cur-crystal').textContent = (curr['크리스탈']||0).toLocaleString();
      document.getElementById('cur-gp').textContent      = (curr['GP']||0).toLocaleString() + ' GP';

      // 꾸미기 레벨
      renderDecoLevel(allItems);

      // 아이템 렌더
      renderItems(allItems);

      // 장착 아이템 프로필 반영
      applyEquipped(allItems);

      document.getElementById('loading-state').style.display='none';
      document.getElementById('content-wrap').style.display='block';

    } catch(e) {
      document.getElementById('loading-state').innerHTML=`<div style="color:var(--accent-pink);font-size:13px">⚠️ 불러오기 실패<br><small style="color:var(--text-dim)">${e.message}</small><br><br><button onclick="loadMyPage()" style="margin-top:8px;background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.3);color:var(--purple-3);padding:8px 20px;border-radius:8px;cursor:pointer;">↻ 다시 시도</button></div>`;
    }
  }

  window.addEventListener('DOMContentLoaded', loadMyPage);
</script>
</body>
</html>

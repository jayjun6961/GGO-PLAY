<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미션 — GGO PLAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg-deep:#0a0612;--bg-card:#130d24;--bg-card2:#1a1035;--purple-1:#7c3aed;--purple-2:#9d5ff5;--purple-3:#c084fc;--accent-pink:#f472b6;--accent-cyan:#22d3ee;--accent-gold:#fbbf24;--text-main:#f0e8ff;--text-sub:#9d8ec4;--text-dim:#5c4e7a;--sidebar-w:72px;--bottombar-h:64px;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg-deep);color:var(--text-main);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 15% 20%,rgba(124,58,237,0.18) 0%,transparent 70%),radial-gradient(ellipse 50% 50% at 85% 75%,rgba(251,191,36,0.10) 0%,transparent 70%);pointer-events:none;z-index:0;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);background:rgba(19,13,36,0.95);border-right:1px solid rgba(124,58,237,0.2);display:flex;flex-direction:column;align-items:center;padding:20px 0;z-index:100;backdrop-filter:blur(20px);}
  .sidebar-logo{width:42px;height:42px;background:linear-gradient(135deg,var(--purple-1),var(--purple-3));border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-weight:900;font-size:16px;color:white;margin-bottom:32px;box-shadow:0 0 20px rgba(124,58,237,0.5);}
  .sidebar-nav{display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:auto;scrollbar-width:none;}
  .sidebar-nav::-webkit-scrollbar{display:none;}
  .nav-item{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;position:relative;color:var(--text-dim);border:none;background:transparent;}
  .nav-item:hover,.nav-item.active{background:rgba(124,58,237,0.2);color:var(--purple-3);box-shadow:0 0 20px rgba(124,58,237,0.3);}
  .nav-item.active::before{content:'';position:absolute;left:-12px;width:3px;height:24px;background:var(--purple-2);border-radius:0 3px 3px 0;}
  .nav-item .tooltip{position:absolute;left:60px;background:rgba(19,13,36,0.95);color:var(--text-main);font-size:12px;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 0.15s;z-index:200;border:1px solid rgba(124,58,237,0.2);}
  .nav-item:hover .tooltip{opacity:1;}
  .sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .avatar-sm{width:36px;height:36px;border-radius:50%;background:rgba(124,58,237,0.2);border:1px solid rgba(124,58,237,0.3);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
  .bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bottombar-h);background:rgba(13,9,26,0.97);border-top:1px solid rgba(124,58,237,0.15);z-index:100;backdrop-filter:blur(20px);}
  .bnav-scroll{display:flex;height:100%;overflow-x:auto;scrollbar-width:none;}
  .bnav-scroll::-webkit-scrollbar{display:none;}
  .bnav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:64px;padding:0 8px;cursor:pointer;color:var(--text-dim);transition:color 0.2s;flex:1;}
  .bnav-item.active,.bnav-item:hover{color:var(--purple-3);}
  .bnav-icon{font-size:20px;line-height:1;}
  .bnav-label{font-size:9px;white-space:nowrap;}
  @media(max-width:768px){.sidebar{display:none;}.bottom-nav{display:flex;}.main-wrap{margin-left:0!important;padding-bottom:calc(var(--bottombar-h)+20px)!important}}
  .main-wrap{margin-left:var(--sidebar-w);padding:0 0 80px;position:relative;min-height:100vh;}
  .topbar{display:flex;align-items:center;gap:12px;padding:18px 24px;position:sticky;top:0;z-index:50;background:rgba(10,6,18,0.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(124,58,237,0.1);}
  .topbar-back{width:36px;height:36px;border-radius:10px;background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.25);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--purple-3);font-size:18px;transition:all 0.2s;}
  .topbar-back:hover{background:rgba(124,58,237,0.3);}
  .topbar-title{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;color:var(--accent-gold);}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .gp-badge{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:10px;background:rgba(251,191,36,0.12);border:1px solid rgba(251,191,36,0.25);font-size:13px;font-weight:700;color:var(--accent-gold);}
  .content{padding:20px 24px;max-width:640px;margin:0 auto;}
  .page-hero{background:linear-gradient(135deg,rgba(124,58,237,0.2),rgba(251,191,36,0.1));border:1px solid rgba(124,58,237,0.2);border-radius:20px;padding:28px 24px;text-align:center;margin-bottom:20px;position:relative;overflow:hidden;}
  .page-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(251,191,36,0.15),transparent 70%);pointer-events:none;}
  .page-hero-icon{font-size:48px;margin-bottom:10px;animation:floatY 3s ease-in-out infinite;}
  @keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .page-hero-title{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:900;color:var(--accent-gold);margin-bottom:6px;}
  .page-hero-desc{font-size:13px;color:var(--text-sub);line-height:1.6;}
  .gp-info-card{background:var(--bg-card);border:1px solid rgba(124,58,237,0.2);border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:16px;margin-bottom:20px;}
  .gp-info-icon{font-size:28px;}
  .gp-info-label{font-size:11px;color:var(--text-dim);margin-bottom:2px;}
  .gp-info-value{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;color:var(--accent-gold);}
  .gp-info-cost{margin-left:auto;text-align:right;}
  .gp-info-cost-label{font-size:10px;color:var(--text-dim);margin-bottom:2px;}
  .gp-info-cost-value{font-size:13px;color:var(--text-sub);}
  .roulette-wrap{background:var(--bg-card);border:1px solid rgba(124,58,237,0.25);border-radius:20px;padding:28px 20px;margin-bottom:20px;text-align:center;}
  .roulette-canvas-wrap{position:relative;display:inline-block;margin-bottom:20px;}
  #roulette-canvas{border-radius:50%;box-shadow:0 0 40px rgba(124,58,237,0.4),0 0 80px rgba(124,58,237,0.15);}
  .roulette-pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid var(--accent-gold);filter:drop-shadow(0 4px 8px rgba(251,191,36,0.6));z-index:10;}
  .spin-btn{display:inline-flex;align-items:center;gap:10px;padding:14px 36px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--purple-1),var(--accent-gold));color:#fff;font-size:15px;font-weight:700;font-family:'Orbitron',sans-serif;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 20px rgba(124,58,237,0.4);letter-spacing:0.5px;}
  .spin-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px rgba(124,58,237,0.6);}
  .spin-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
  .spin-cost{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:8px;background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.3);font-size:11px;color:var(--accent-gold);margin-top:10px;}
  .spin-notice{font-size:11px;color:#f87171;margin-top:8px;min-height:18px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:300;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
  .modal-overlay.open{display:flex;}
  .result-modal{background:var(--bg-card);border:1px solid rgba(251,191,36,0.3);border-radius:24px;padding:36px 32px;text-align:center;max-width:360px;width:90%;box-shadow:0 24px 64px rgba(0,0,0,0.6),0 0 40px rgba(251,191,36,0.15);animation:popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);}
  @keyframes popIn{from{opacity:0;transform:scale(0.7);}to{opacity:1;transform:scale(1);}}
  .result-emoji{font-size:64px;margin-bottom:12px;}
  .result-label{font-size:12px;color:var(--text-dim);margin-bottom:4px;font-family:'Orbitron',sans-serif;}
  .result-name{font-size:22px;font-weight:700;color:var(--accent-gold);margin-bottom:4px;}
  .result-desc{font-size:13px;color:var(--text-sub);margin-bottom:20px;}
  .result-close{padding:12px 32px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--purple-1),var(--purple-2));color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Orbitron',sans-serif;transition:all 0.2s;}
  .result-close:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(124,58,237,0.5);}
  .feed-section{background:var(--bg-card);border:1px solid rgba(124,58,237,0.2);border-radius:20px;padding:20px;margin-bottom:20px;}
  .feed-title{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--text-sub);letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .feed-title::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent-gold);animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  .feed-list{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;}
  .feed-list::-webkit-scrollbar{width:3px;}
  .feed-list::-webkit-scrollbar-thumb{background:rgba(124,58,237,0.3);border-radius:2px;}
  .feed-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,0.03);border-radius:10px;border:1px solid rgba(255,255,255,0.05);font-size:12px;}
  .feed-item-ico{font-size:20px;flex-shrink:0;}
  .feed-item-text{flex:1;color:var(--text-sub);line-height:1.5;}
  .feed-item-text strong{color:var(--text-main);}
  .feed-item-text .item-name{color:var(--accent-gold);font-weight:700;}
  .feed-item-time{font-size:10px;color:var(--text-dim);flex-shrink:0;}
  .feed-empty{text-align:center;padding:24px;color:var(--text-dim);font-size:13px;}
  .prob-section{background:var(--bg-card);border:1px solid rgba(124,58,237,0.2);border-radius:20px;padding:20px;margin-bottom:20px;}
  .prob-title{font-family:'Orbitron',sans-serif;font-size:12px;font-weight:700;color:var(--text-sub);letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .prob-title::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--purple-3);}
  .prob-table{width:100%;border-collapse:collapse;}
  .prob-table th{font-size:10px;color:var(--text-dim);font-family:'Orbitron',sans-serif;text-align:left;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,0.06);}
  .prob-table td{font-size:12px;padding:8px 8px;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--text-sub);}
  .prob-table td:first-child{font-size:18px;width:36px;}
  .item-name-col{color:var(--text-main)!important;font-weight:500;}
  .prob-col{color:var(--accent-gold)!important;font-family:'Orbitron',sans-serif;font-size:11px!important;text-align:right!important;}
  .prob-bar-wrap{width:60px;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;}
  .prob-bar{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--purple-2),var(--accent-gold));}
  .spin-icon{display:inline-block;animation:rotate 0.8s linear infinite;}
  @keyframes rotate{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>

        <span style="font-size:18px">💎</span>

          <div style="font-size:9px;color:var(--text-dim);font-family:'Orbitron',sans-serif;letter-spacing:.5px;">루비</div>
          <div style="font-size:14px;font-weight:700;color:#f472b6;" id="cur-ruby">0</div>
        </div>
      </div>
      <div class="cur-chip" style="display:flex;align-items:center;gap:6px;background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.3);border-radius:12px;padding:8px 14px;flex:1;min-width:110px;">
        <span style="font-size:18px">🔷</span>
        <div>
          <div style="font-size:9px;color:var(--text-dim);font-family:'Orbitron',sans-serif;letter-spacing:.5px;">크리스탈</div>
          <div style="font-size:14px;font-weight:700;color:#22d3ee;" id="cur-crystal">0</div>
        </div>
      </div>
      <div class="cur-chip" style="display:flex;align-items:center;gap:6px;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.3);border-radius:12px;padding:8px 14px;flex:1;min-width:110px;">
        <span style="font-size:18px">🎟️</span>
        <div>
          <div style="font-size:9px;color:var(--text-dim);font-family:'Orbitron',sans-serif;letter-spacing:.5px;">응모권</div>
          <div style="font-size:14px;font-weight:700;color:#a78bfa;" id="cur-ticket">0</div>
        </div>
      </div>
    </div>
    <div class="roulette-wrap">
      <div class="roulette-canvas-wrap">
        <div class="roulette-pointer"></div>
        <canvas id="roulette-canvas" width="300" height="300"></canvas>
      </div>
      <div>
        <button class="spin-btn" id="spin-btn" onclick="spinRoulette()">🎡 룰렛 돌리기</button>
      </div>
      <div class="spin-cost">🟡 100 GP 소모</div>
      <div class="spin-notice" id="spin-notice"></div>
    </div>
    <div class="feed-section">
      <div class="feed-title">LIVE FEED — 실시간 획득 내역</div>
      <div class="feed-list" id="feed-list">
        <div class="feed-empty">🎡 룰렛 기록을 불러오는 중...</div>
      </div>
    </div>
    <div class="prob-section">
      <div class="prob-title">ITEM TABLE — 아이템 목록 및 확률</div>
      <table class="prob-table">
        <thead><tr><th></th><th>아이템명</th><th>수량</th><th style="text-align:right">확률</th></tr></thead>
        <tbody id="prob-tbody"><tr><td colspan="4" style="text-align:center;padding:16px;color:var(--text-dim)">불러오는 중...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
'use strict';
const SHEET_BASE   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmibDA5_-djeNETtuGqt5I3wtRqGs0oJjEQ8KZOW6qkQpINtLtEMIDNlU4N2IwipF7peIV6qWZKx5J/pub';
const CSV_ROULETTE = SHEET_BASE + '?gid=1617306718&single=true&output=csv';
const SPIN_COST    = 100;
const username = sessionStorage.getItem('ggo_username') || localStorage.getItem('ggo_username') || '';

let _db = null;
(function(){
  try{
    const cfg={apiKey:"AIzaSyCXJrfH4ZrppPgqoN4zhUPVaRE8Mi3WygA",authDomain:"ggo-play.firebaseapp.com",databaseURL:"https://ggo-play-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"ggo-play",storageBucket:"ggo-play.firebasestorage.app"};
    if(typeof firebase!=='undefined'){if(!firebase.apps.length)firebase.initializeApp(cfg);_db=firebase.database();}
  }catch(e){console.warn('[Mission] Firebase 실패:',e);}
})();

function getGP(){
  if(!username)return 0;
  const cur=JSON.parse(localStorage.getItem('ggo_currency_'+username)||'{"GP":0,"루비":0,"크리스탈":0}');
  return parseInt(cur['GP'])||0;
}
function spendGP(n){
  if(!username)return false;
  const k='ggo_currency_'+username;
  const cur=JSON.parse(localStorage.getItem(k)||'{"GP":0,"루비":0,"크리스탈":0}');
  if((cur['GP']||0)<n)return false;
  cur['GP']=(cur['GP']||0)-n;
  localStorage.setItem(k,JSON.stringify(cur));
  return true;
}
function addCurrency(type,n){
  if(!username)return;
  const k='ggo_currency_'+username;
  const cur=JSON.parse(localStorage.getItem(k)||'{"GP":0,"루비":0,"크리스탈":0,"응모권":0}');
  cur[type]=(cur[type]||0)+n;
  localStorage.setItem(k,JSON.stringify(cur));
}
function getCurrency(type){
  if(!username)return 0;
  const cur=JSON.parse(localStorage.getItem('ggo_currency_'+username)||'{"GP":0,"루비":0,"크리스탈":0,"응모권":0}');
  return parseInt(cur[type])||0;
}
function updateGPDisplay(){
  const gp=getGP();
  const ruby=getCurrency('루비');
  const crystal=getCurrency('크리스탈');
  const ticket=getCurrency('응모권');
  // 상단 토픽바
  const e2=document.getElementById('topbar-gp');
  if(e2)e2.textContent=gp.toLocaleString();
  // 보유 GP 카드
  const e1=document.getElementById('my-gp');
  if(e1)e1.textContent=gp.toLocaleString();
  // 재화 현황 바지
  const elRuby=document.getElementById('cur-ruby');
  const elCrystal=document.getElementById('cur-crystal');
  const elTicket=document.getElementById('cur-ticket');
  const elGp=document.getElementById('cur-gp');
  if(elGp)elGp.textContent=gp.toLocaleString();
  if(elRuby)elRuby.textContent=ruby.toLocaleString();
  if(elCrystal)elCrystal.textContent=crystal.toLocaleString();
  if(elTicket)elTicket.textContent=ticket.toLocaleString();
  // 룰렛 버튼
  const btn=document.getElementById('spin-btn'),notice=document.getElementById('spin-notice');
  if(btn){
    if(gp<SPIN_COST){btn.disabled=true;if(notice)notice.textContent='GP가 부족합니다. (보유: '+gp+'GP / 필요: '+SPIN_COST+'GP)';}
    else{btn.disabled=false;if(notice)notice.textContent='';}
  }
}

let ITEMS=[];
const PALETTE=['#7c3aed','#f472b6','#22d3ee','#fbbf24','#34d399','#f97316','#a78bfa','#60a5fa','#fb7185','#4ade80'];

async function loadItems(){
  try{
    const res=await fetch(CSV_ROULETTE+'&t='+Date.now(),{cache:'no-store'});
    const text=await res.text();
    const lines=text.trim().split('\n').slice(1);
    const parsed=[];
    lines.forEach((line,i)=>{
      const cols=line.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
      if(!cols[1])return;
      const prob=parseFloat(cols[3])||0;
      if(prob<=0)return;
      parsed.push({emoji:cols[0]||'🎁',name:cols[1]||'?',qty:parseInt(cols[2])||1,prob,type:cols[4]||'기타',color:cols[5]||PALETTE[i%PALETTE.length]});
    });
    if(parsed.length>0)ITEMS=parsed;
  }catch(e){console.warn('[Mission] 시트 로드 실패:',e);}
  if(ITEMS.length===0){
    ITEMS=[
      {emoji:'🟡',name:'GP',qty:50,prob:30,type:'GP',color:'#fbbf24'},
      {emoji:'🟡',name:'GP',qty:100,prob:20,type:'GP',color:'#f59e0b'},
      {emoji:'🟡',name:'GP',qty:200,prob:15,type:'GP',color:'#d97706'},
      {emoji:'💎',name:'루비',qty:10,prob:15,type:'루비',color:'#f472b6'},
      {emoji:'💎',name:'루비',qty:30,prob:8,type:'루비',color:'#ec4899'},
      {emoji:'🔷',name:'크리스탈',qty:5,prob:7,type:'크리스탈',color:'#22d3ee'},
      {emoji:'🔷',name:'크리스탈',qty:20,prob:3,type:'크리스탈',color:'#0ea5e9'},
      {emoji:'⚡',name:'FP',qty:500,prob:2,type:'FP',color:'#a78bfa'},
    ];
  }
  drawRoulette();
  renderProbTable();
}

const canvas=document.getElementById('roulette-canvas');
const ctx=canvas.getContext('2d');
const CX=150,CY=150,R=138;

function resizeCanvas(){const maxW=Math.min(window.innerWidth-80,300);canvas.style.width=maxW+'px';canvas.style.height=maxW+'px';}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

function drawRoulette(angle){
  if(!angle)angle=0;
  if(!ITEMS.length)return;
  const total=ITEMS.reduce((s,it)=>s+it.prob,0);
  ctx.clearRect(0,0,300,300);
  let sa=angle;
  ITEMS.forEach((it,i)=>{
    const slice=(it.prob/total)*Math.PI*2;
    const ea=sa+slice,mid=sa+slice/2;
    ctx.beginPath();ctx.moveTo(CX,CY);ctx.arc(CX,CY,R,sa,ea);ctx.closePath();
    ctx.fillStyle=it.color+(i%2===0?'ee':'bb');ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.save();
    ctx.translate(CX+Math.cos(mid)*R*0.65,CY+Math.sin(mid)*R*0.65);
    ctx.rotate(mid+Math.PI/2);ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=5;
    ctx.font='15px Noto Sans KR,sans-serif';ctx.fillStyle='#fff';ctx.fillText(it.emoji,0,-11);
    ctx.font='bold 9px Noto Sans KR,sans-serif';
    const lbl=(it.name+(it.qty>1?' x'+it.qty:'')).slice(0,8);
    ctx.fillText(lbl,0,3);
    ctx.restore();
    sa=ea;
  });
  // 중앙
  ctx.beginPath();ctx.arc(CX,CY,22,0,Math.PI*2);ctx.fillStyle='#0a0612';ctx.fill();
  ctx.strokeStyle='rgba(251,191,36,0.7)';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#fbbf24';ctx.font='bold 11px Orbitron,sans-serif';ctx.textAlign='center';ctx.shadowBlur=0;ctx.fillText('GO',CX,CY+4);
  // 외곽
  ctx.beginPath();ctx.arc(CX,CY,R+3,0,Math.PI*2);ctx.strokeStyle='rgba(251,191,36,0.35)';ctx.lineWidth=5;ctx.stroke();
}

let spinning=false,currentAngle=0;

function pickItem(){
  const total=ITEMS.reduce((s,it)=>s+it.prob,0);
  let r=Math.random()*total;
  for(const it of ITEMS){r-=it.prob;if(r<=0)return it;}
  return ITEMS[ITEMS.length-1];
}

function spinRoulette(){
  if(spinning)return;
  if(!username){document.getElementById('spin-notice').textContent='로그인이 필요합니다.';return;}
  if(getGP()<SPIN_COST){document.getElementById('spin-notice').textContent='GP가 부족합니다!';return;}
  if(!spendGP(SPIN_COST))return;
  updateGPDisplay();
  spinning=true;
  const btn=document.getElementById('spin-btn');
  btn.disabled=true;btn.innerHTML='<span class="spin-icon">⟳</span> 돌리는 중...';
  const winner=pickItem();
  const total=ITEMS.reduce((s,it)=>s+it.prob,0);
  let cumAngle=0;
  for(const it of ITEMS){const slice=(it.prob/total)*Math.PI*2;if(it===winner){cumAngle+=slice/2;break;}cumAngle+=slice;}
  const extraSpins=5+Math.floor(Math.random()*3);
  const targetOffset=(-Math.PI/2-cumAngle-currentAngle+Math.PI*2*100)%(Math.PI*2);
  const totalDelta=extraSpins*Math.PI*2+targetOffset;
  const duration=4000+Math.random()*1000;
  const startTime=performance.now();
  const startAngle=currentAngle;
  function easeOut(t){return 1-Math.pow(1-t,4);}
  function animate(now){
    const t=Math.min((now-startTime)/duration,1);
    currentAngle=startAngle+totalDelta*easeOut(t);
    drawRoulette(currentAngle);
    if(t<1){requestAnimationFrame(animate);}
    else{
      spinning=false;currentAngle=currentAngle%(Math.PI*2);drawRoulette(currentAngle);
      btn.disabled=false;btn.innerHTML='🎡 룰렛 돌리기';
      updateGPDisplay();giveReward(winner);showResult(winner);
    }
  }
  requestAnimationFrame(animate);
}

function giveReward(item){
  if(!username)return;
  if(item.type==='GP')addCurrency('GP',item.qty);
  else if(item.type==='루비')addCurrency('루비',item.qty);
  else if(item.type==='크리스탈')addCurrency('크리스탈',item.qty);
  else if(item.type==='응모권')addCurrency('응모권',item.qty);
  else if(item.type==='FP'){const k='ggo_fp_'+username;localStorage.setItem(k,String((parseInt(localStorage.getItem(k)||'0'))+item.qty));}
  else if(item.type==='G골드'){try{const k='gwo_save_'+username;const s=JSON.parse(localStorage.getItem(k)||'null');if(s){s.gold=(s.gold||0)+item.qty;localStorage.setItem(k,JSON.stringify(s));}}catch(e){}}
  updateGPDisplay();
  saveFeed(item);
}

function showResult(item){
  document.getElementById('result-emoji').textContent=item.emoji;
  document.getElementById('result-name').textContent=item.name+(item.qty>1?' × '+item.qty.toLocaleString():'');
  document.getElementById('result-desc').textContent=item.qty.toLocaleString()+' '+item.name+'을(를) 획득했습니다!';
  document.getElementById('result-modal').classList.add('open');
}
function closeModal(){document.getElementById('result-modal').classList.remove('open');}

function saveFeed(item){
  if(!username)return;
  // 로컬 피드에도 즉시 저장 (Firebase 실패 대비)
  const localKey = 'ggo_roulette_feed_' + username;
  const localFeed = JSON.parse(localStorage.getItem(localKey) || '[]');
  const entry = {user:username, emoji:item.emoji, name:item.name, qty:item.qty, type:item.type, ts:Date.now()};
  localFeed.unshift(entry);
  if(localFeed.length > 30) localFeed.length = 30;
  localStorage.setItem(localKey, JSON.stringify(localFeed));

  // Firebase에 저장
  if(!_db) { renderLocalFeed(); return; }
  const ref = _db.ref('roulette_feed');
  ref.push({
    user: username,
    emoji: item.emoji,
    name: item.name,
    qty: item.qty,
    type: item.type,
    ts: firebase.database.ServerValue.TIMESTAMP
  }).then(() => {
    console.log('[Feed] Firebase 저장 성공');
    // child_added 리스너가 곧 받아서 renderFeed 호출하므로 별도 처리 불필요
  }).catch(e => {
    console.warn('[Feed] Firebase 저장 실패 → 로컬 직접 삽입:', e);
    // Firebase 실패 시 로컬 _feedItems에 직접 추가해서 즉시 표시
    const entry = {user:username, emoji:item.emoji, name:item.name, qty:item.qty, type:item.type, ts:Date.now()};
    _feedItems.unshift(entry);
    if(_feedItems.length > 50) _feedItems.length = 50;
    renderFeed(_feedItems);
  });
}

// Firebase 실패 시 로컬 피드로 표시
function renderLocalFeed(){
  const localKey = 'ggo_roulette_feed_' + username;
  const localFeed = JSON.parse(localStorage.getItem(localKey) || '[]');
  if(localFeed.length > 0) renderFeed(localFeed);
}

function timeAgo(ts){
  const d=Date.now()-ts;
  if(d<60000)return Math.floor(d/1000)+'초 전';
  if(d<3600000)return Math.floor(d/60000)+'분 전';
  if(d<86400000)return Math.floor(d/3600000)+'시간 전';
  return Math.floor(d/86400000)+'일 전';
}
function renderFeed(items){
  const el = document.getElementById('feed-list'); if(!el) return;
  if(!items || !items.length){
    el.innerHTML = '<div class="feed-empty">아직 획득 내역이 없습니다 🎡<br><span style="font-size:11px;color:var(--text-dim)">룰렛을 돌리면 여기에 표시됩니다</span></div>'; return;
  }
  el.innerHTML = items.map(it => {
    const isMe = it.user === username;
    const border = isMe ? 'border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.06);' : '';
    const userTag = isMe
      ? '<strong style="color:#fbbf24">' + it.user + '</strong> <span style="font-size:9px;background:rgba(251,191,36,.2);color:#fbbf24;padding:1px 5px;border-radius:4px;font-family:Orbitron,sans-serif;">나</span>'
      : '<strong>' + it.user + '</strong>';
    return '<div class="feed-item" style="' + border + '">'
      + '<div class="feed-item-ico">' + it.emoji + '</div>'
      + '<div class="feed-item-text">'
      +   userTag + '님이 룰렛에서 '
      +   '<span class="item-name">' + it.name + (it.qty > 1 ? ' × ' + it.qty.toLocaleString() : '') + '</span>'
      +   '을(를) 획득하였습니다'
      + '</div>'
      + '<div class="feed-item-time">' + (it.ts ? timeAgo(it.ts) : '') + '</div>'
      + '</div>';
  }).join('');
}
// 피드 항목 배열 (최신순, 최대 50개)
let _feedItems = [];

function subscribeFeed(){
  const feedEl = document.getElementById('feed-list');
  if(!_db){
    feedEl.innerHTML = '<div class="feed-empty">Firebase 미연결 — 로컬 내역만 표시됩니다</div>';
    renderLocalFeed();
    return;
  }

  // ── 1단계: 기존 50개 먼저 한번에 로드 ──
  _db.ref('roulette_feed').orderByChild('ts').limitToLast(50).get()
    .then(snap => {
      _feedItems = [];
      if(snap.exists()){
        snap.forEach(ch => _feedItems.push(ch.val()));
        _feedItems.sort((a,b) => (b.ts||0) - (a.ts||0));
      }
      renderFeed(_feedItems);

      // ── 2단계: 이후 새 항목은 child_added로 실시간 수신 ──
      // 현재 최신 ts 이후 항목만 받음
      const latestTs = _feedItems.length ? (_feedItems[0].ts || Date.now()) : Date.now();
      _db.ref('roulette_feed').orderByChild('ts').startAt(latestTs + 1)
        .on('child_added', snap => {
          const item = snap.val();
          if(!item) return;
          // 중복 방지 (같은 ts+user 조합)
          const isDup = _feedItems.some(f => f.ts === item.ts && f.user === item.user && f.name === item.name);
          if(isDup) return;
          _feedItems.unshift(item);
          if(_feedItems.length > 50) _feedItems.length = 50;
          renderFeed(_feedItems);
        });
    })
    .catch(err => {
      console.warn('[Feed] 로드 실패 → 로컬 표시:', err);
      renderLocalFeed();

      // 로컬 실패해도 리스너는 붙임
      _db.ref('roulette_feed').orderByChild('ts').limitToLast(1)
        .on('child_added', snap => {
          const item = snap.val();
          if(!item) return;
          const isDup = _feedItems.some(f => f.ts === item.ts && f.user === item.user);
          if(!isDup) {
            _feedItems.unshift(item);
            if(_feedItems.length > 50) _feedItems.length = 50;
            renderFeed(_feedItems);
          }
        });
    });
}

function renderProbTable(){
  const tbody=document.getElementById('prob-tbody');if(!tbody||!ITEMS.length)return;
  const total=ITEMS.reduce((s,it)=>s+it.prob,0);
  tbody.innerHTML=ITEMS.map(it=>{
    const pct=((it.prob/total)*100).toFixed(1);
    const bw=Math.round((it.prob/total)*100);
    return '<tr><td>'+it.emoji+'</td><td class="item-name-col">'+it.name+'</td><td style="color:var(--text-sub)">'+(it.qty>1?'× '+it.qty.toLocaleString():'-')+'</td><td class="prob-col"><div style="display:flex;align-items:center;gap:6px;justify-content:flex-end;"><div class="prob-bar-wrap"><div class="prob-bar" style="width:'+bw+'%"></div></div>'+pct+'%</div></td></tr>';
  }).join('');
}

window.addEventListener('DOMContentLoaded',()=>{
  updateGPDisplay();loadItems();subscribeFeed();
  document.getElementById('result-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
});
</script>
